  - id: goal-flow-performance
    advice: "Recommended default: Keep 500 nodes and 700 edges as the target size."
  - id: req-flow-perf-drag
    advice: "Recommended default: Keep p95 under 8 ms and 95% of frames within 33.5 ms; thresholds live in `tools/journey`."
  - id: rule-flow-keyboard-actions
    advice: "Recommended default: Keep the current keys; `keyboardStep` 10, Shift four times; it is an option."
  - id: req-flow-portability-browsers
    advice: "Recommended default: 0.x: Chromium, mouse and keyboard; Firefox, WebKit and touch not promised; widen before 1.0."
  - id: problem-flow-browsers-untested
    advice: "Recommended default: Keep open until the default above is written into README."
  - id: problem-flow-journey-not-in-ci
    advice: "Recommended default: Until CI has Chromium, the PR author runs `bun run journey` and records the result; 75 counts as not run."
  - id: resource-flow-chromium
    advice: "Recommended default: Provide a pinned Chromium through devenv when CI gets the step; `FLOW_CHROMIUM` stays the override."
  - id: problem-flow-bun-mismatch
    advice: "Recommended default: Pin Bun exactly as issue #3 proposes."
  - id: req-flow-reproducible-toolchain
    advice: "Recommended default: Same: a check that `vp exec -- bun --revision` equals devenv's."
  - id: problem-flow-deferred-workflow-questions
    advice: "Recommended default: Keep all four deferred (subtree, required approval, signed commits, Renovate); re-ask before the first publish."
  - id: problem-flow-community-files
    advice: "Recommended default: Add SECURITY.md (use GitHub private reporting), CONTRIBUTING.md (link AGENTS.md) and a code of conduct before the first publish; the conduct text is the operator's choice."
  - id: problem-flow-demand-unmeasured
    advice: "Recommended default: Read npm downloads and GitHub issues after the first pre-release."
  - id: problem-flow-goals-undocumented
    advice: "Recommended default: Link the model's goals from README."
  - id: problem-flow-no-glossary
    advice: "Recommended default: Generate GLOSSARY.md from the model concepts."
  - id: problem-flow-state-blocked-nothing
    advice: "Recommended default: Add a \"Risks\" list to STATE.md."
  - id: resource-flow-foldkit-pin
    advice: "Recommended default: Keep the exact pin; change it only in its own upgrade spec."
  - id: resource-flow-effect
    advice: "Recommended default: Keep 4.1.0 exact, peer `~4.1.0`."
  - id: problem-flow-lint-mocking-gap
    advice: "Recommended default: Keep open; add ref issue #5 (open on foldkit-flow, 2026-10-29)."
