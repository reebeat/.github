# The lead's advice on elements that still wait for the operator (triage of 2026-10-29): 'confirm' for the standard groups, a
# recommended default for the configuration items. It is advice, not a decision: an element becomes decided only when a log line
# shows the operator decided it, and its entry here is then deleted (the check TRIAGE-DECIDED fails on a decided element).
# docs/confirm.md prints each entry beside its element.
advice:
  - id: actor-creator
    advice: "Recommended default: Confirm as a persona label, \"Creator\" (person or agent). Matches log:7 (\"you focus on creating\")."
  - id: actor-learner
    advice: "Recommended default: Confirm as an audience persona; keep \"Learner\" until the operator names another label."
  - id: actor-presenter
    advice: "Recommended default: Confirm as a separate persona from Creator (deck view, narration recording, log:45); merge later if it adds nothing."
  - id: actor-agent-operator
    advice: "Recommended default: Confirm; the persona behind \"bring your own agents\" (log:43)."
  - id: actor-plugin-author
    advice: "Recommended default: Confirm; the persona behind plugins, extensions and the render-engine SDK (log:28, log:43)."
  - id: req-org-build-incremental
    advice: "Recommended default: Confirm the requirement; reword the scenario to what ADR-0000 (PR #23, open) says: a narration edit re-synthesises only that line, the plan verdict returns without pixels, and pixel reuse follows the spec for issue #9."
  - id: comp-org-how-it-works
    advice: "Recommended default: Keep proposed until PR #24 merges; then change the link to `docs/design/how-it-works.md` on `main` and confirm."
  - id: opportunity-org-one-declaration-many-surfaces
    advice: "Recommended default: Confirm; the wording \"one declaration, many surfaces\" is a slogan. ADR-0000 (PR #23) designs the capability check it needs (`cap/*` rules, interaction surfaces)."
