  - id: problem-tsukuri-spec-status-mismatch
    advice: "Recommended default: Leave spec text frozen; generate a spec index (number, title, merged or open) from the pull requests, and let STATE.md link it."
  - id: problem-tsukuri-no-contributing
    advice: "Recommended default: A short CONTRIBUTING.md in `tsukuri-labs/.github` (see D12) that links AGENTS.md and spec 0000."
  - id: problem-tsukuri-no-issue-templates
    advice: "Recommended default: Organisation-level issue forms in `tsukuri-labs/.github`: spec or journey, version, command, expected and observed result."
  - id: problem-tsukuri-no-pr-template
    advice: "Recommended default: Organisation-level PR template with the eight sections of spec 0000 (lines 59-70)."
  - id: problem-tsukuri-experimental-gate-open
    advice: "Recommended default: Add the scan of exported declarations when the first experimental package (XState) is locked; the unstable-Effect scan in `tools/quality/release.ts` is the pattern."
  - id: problem-tsukuri-licence-gate-declared-only
    advice: "Recommended default: Keep the gate; add a licence-file check at release time and keep the limit written in `third-party.md:93`. Tool not chosen."
  - id: constraint-tsukuri-canvas
    advice: "Recommended default: Keep 1280x720 at 30 fps as the release-1 default; make canvas and frame rate explicit settings with presets 24, 30, 60 (log:22); add 1920x1080 after capture cost is measured."
  - id: resource-tsukuri-speech-cache
    advice: "Recommended default: Keep the cache committed for the one fixture story (about 1.2 MB); add a size gate so it cannot grow unnoticed. History is hard to purge, so this is the only generated file kept."
  - id: resource-tsukuri-same-id-story
    advice: "Recommended default: Keep it as the public fixture; topic and voice (`af_heart`) stay unless the operator names another."
  - id: rule-tsukuri-standin-scope
    advice: "Recommended default: The narrow rule stands: stand-ins exist where a model, credential or store is involved; Renderer, FrameCapturer and Encoder are local tools tested with fakes. This narrows the decided line \"every integration has a stand-in\": the operator should read it as a change of that line."
  - id: process-tsukuri-guarded-merge
    advice: "Recommended default: Confirm. Hardening: have `record-round.sh` post a required status `review`, because branch protection today requires `checks` only and 0 human approvals (`gh api`, 2026-10-29); the recorded round is enforced by a script, not by GitHub."
  - id: req-tsukuri-nfr-timing
    advice: "Recommended default: Keep the one-frame tolerance; it is measured and a threshold, not a design."
  - id: process-tsukuri-speech-stage
    advice: "Recommended default: Keep the 0.9 alignment threshold and the miss rule. The silent stand-in's exception is decided in two places (`packages/cli/src/build.ts:26-31` by selection key; `packages/verify/src/load.ts:35` by the `-standin` id suffix): derive both from one field of the adapter info."
  - id: req-tsukuri-speech-cache
    advice: "Recommended default: Same as above: keep the key (text and adapter settings) and the miss rule; one stand-in flag."
  - id: req-tsukuri-selection
    advice: "Recommended default: Keep `tsukuri.config.json` beside the story and the flags as the defaults; the file name and flag names change when ADR-0000 settles plugin selection."
  - id: comp-tsukuri-statechart-xstate
    advice: "Recommended default: Keep the name `@tsukuri/statechart-xstate` from spec 0007; it does not exist yet, so a rename is free until spec 0005."
