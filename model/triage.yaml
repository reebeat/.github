    advice: "Recommended default: Before building any paid feature: a waitlist for sync and hosted agents plus a handful of interviews; no pricing page before that"
  - id: problem-studio-unsigned-binaries
    advice: "Recommended default: Sign and notarise before the first public release; draft releases stay unsigned (0004 question 1)"
  - id: process-studio-deploy-web
    advice: "Recommended default: One Worker per stage, as built; Worker Previews later (0004 question 4)"
