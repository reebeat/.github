elements:
  - id: rule-studio-free-costs-nothing
    kind: rule
    ruleType: derivation
    title: Free means it costs the project nothing to run
    statement: >-
      A feature is free when it runs in the user's browser or on their machine and costs the project nothing. It is paid
      when the project runs something for the user, such as an always-on server, model inference or render minutes.
    when: A studio feature is placed in a tier
    if: Its running cost falls on the project (a server, inference or render minutes)
    then: The feature is paid; otherwise it is free
    status: decided
    source: [log:43, studio:docs/design/lenses.md:13-15, studio:docs/specs/0001-first-felt-journey.md:112, log:118]
    links:
      serves: [goal-studio-free-paid-split]

  - id: rule-studio-single-edit-path
    kind: rule
    ruleType: constraint
    title: Every edit goes through one validated path
    statement: >-
      A UI action, an agent tool call and a lens all change the story through one edit path. The path checks the result
      and keeps the old story when the result is invalid.
    when: A person, an agent or a lens changes the story
    then: The change is checked against the story schema and refused with a reason if the result is invalid
    status: decided
    source: [studio:docs/specs/0001-first-felt-journey.md:19-21, studio:docs/specs/0001-first-felt-journey.md:76, studio:docs/specs/0001-first-felt-journey.md:172, log:118]
    links:
      serves: [goal-studio-first-felt-journey]
      constrains: [comp-studio-edit-path]
      triggers: [process-studio-edit-property]

  - id: rule-studio-edit-by-element-id
    kind: rule
    ruleType: constraint
    title: Edit by Element id, not by array index
    statement: >-
      Agents and the UI address an Element by its id. A raw JSON Patch is for callers that build their own pointers.
    when: An agent or the UI edits an Element
    then: The tool resolves the Element id, never an array position
    status: decided
    source: [studio:docs/specs/0001-first-felt-journey.md:89, studio:docs/specs/0002-collaboration-spike.md:27, studio:docs/specs/0002-collaboration-spike.md:188, log:118]
    links:
      serves: [goal-studio-valid-shared-story]
      constrains: [comp-studio-tool-protocol]

  - id: rule-studio-keyed-by-uid
    kind: rule
    ruleType: constraint
    title: Objects with an id are keyed by an immutable uid
    statement: >-
      Each object that has an id becomes a map keyed by an immutable uid, with an explicit position. References use the uid,
      and repeated data is derived, not stored twice. Composite values, a position and a curve point, are declared atomic in
      the schema and merge as whole values. The other properties merge property-wise.
    status: decided
    source: [log:47, log:100, studio:docs/specs/0002-collaboration-spike.md:24, studio:docs/specs/0002-collaboration-spike.md:188]
    links:
      serves: [goal-studio-valid-shared-story]

  - id: rule-studio-replicate-updates-not-patches
    kind: rule
    ruleType: constraint
    title: Peers exchange Loro updates, not JSON Patches
    statement: >-
      The replicated unit is the Loro update. A JSON Patch only describes an edit, for tool calls, review, proposals and
      undo.
    status: decided
    source: [record:studio:docs/specs/0001-first-felt-journey.md:172, log:47, studio:docs/specs/0002-collaboration-spike.md:27, studio:docs/specs/0002-collaboration-spike.md:194]
    links:
      serves: [goal-studio-collaboration]

  - id: rule-studio-gate-refuses-invalid-merge
    kind: rule
    ruleType: event-action
    title: The gate refuses a merge that is not a valid story
    statement: >-
      The sync server decodes every merged change. It refuses a change whose result is not a valid IR and gives the reason,
      so the author can rebase.
    when: A change set reaches the sync server
    if: The merged document does not decode as a valid story IR
    then: The server refuses the change and returns the reason
    status: decided
    source: [log:47, studio:docs/specs/0002-collaboration-spike.md:25, studio:docs/specs/0002-collaboration-spike.md:190, log:118]
    links:
      serves: [goal-studio-valid-shared-story]
      triggers: [process-studio-collaborate-merge]

  - id: rule-studio-repair-is-proposal
    kind: rule
    ruleType: constraint
    title: A repair is a proposal, never applied silently
    statement: >-
      A repair for an invalid merge is offered as a proposal and is never applied without a person.
    status: decided
    source: [record:studio:docs/specs/0002-collaboration-spike.md:198, log:118]
    links:
      serves: [goal-studio-human-control]

  - id: rule-studio-hash-projected-ir
    kind: rule
    ruleType: derivation
    title: Hash the projected IR text, not CRDT bytes
    statement: >-
      A document revision is the hash of the story text projected from the document. Studio never uses a library's saved
      bytes as a revision.
    status: decided
    source: [studio:docs/specs/0002-collaboration-spike.md:26, studio:docs/specs/0002-collaboration-spike.md:126-129, studio:docs/specs/0002-collaboration-spike.md:194, log:118]
    links:
      serves: [goal-studio-valid-shared-story]

  - id: rule-studio-suggestions-need-human-accept
    kind: rule
    ruleType: constraint
    title: A suggestion needs a human to accept it
    statement: >-
      An edit proposed by an agent or a collaborator is not applied. It appears with the name of its author, and a person
      accepts or rejects it. An accepted suggestion applies as the same patch.
    when: An agent or a collaborator proposes an edit
    then: The edit waits as a named proposal until a person accepts or rejects it
    status: proposed
    rationale: >-
      The lenses note designs suggestion mode. The operator decided the same for repairs only (spec 0002 line 198), so the
      general rule needs confirmation.
      The operator should confirm the general rule for suggestions.
    source: [studio:docs/design/lenses.md:66-67, record:studio:docs/specs/0002-collaboration-spike.md:198]
    links:
      serves: [goal-studio-human-control]
      triggers: [process-studio-review-suggestion]

  - id: rule-studio-agent-scope
    kind: rule
    ruleType: constraint
    title: An agent's permissions are action sets on resources
    statement: >-
      An agent's permissions are action sets on resources (scenes, elements, effects, timing, narration), declared in code.
      Read, suggest and apply are named presets: read lets the agent read, suggest lets it propose edits that wait for a
      person, and apply lets it edit directly. Each lens has a default preset in the UI.
    status: decided
    source: [studio:docs/design/lenses.md:91-99, log:99]
    links:
      serves: [goal-studio-lens-agent-panel]
      constrains: [comp-studio-lens-agent-panel]

  - id: rule-studio-narration-drives-or-follows
    kind: rule
    ruleType: constraint
    title: Studio states no narration timing rule
    statement: >-
      Studio states no rule for how a narration piece drives timing or follows an event. Tsukuri writes that rule once, in
      its spec 0004 or 0005, and studio shows tsukuri's diagnostics in the Wiring lens.
    status: decided
    source: [log:103, log:27]
    links:
      serves: [goal-studio-deck-view-narration, goal-studio-lens-wiring]

  - id: rule-studio-no-narration-cycles
    kind: rule
    ruleType: event-action
    title: The Wiring lens shows tsukuri's cycle diagnostics
    statement: >-
      Studio states no rule on narration cycles. When tsukuri's lint reports a cycle, where a piece follows an event that
      waits for the same piece, the Wiring lens shows the loop.
    when: Tsukuri's lint reports a narration cycle
    then: The Wiring lens shows the loop with the line it comes from
    status: decided
    source: [log:103, studio:docs/design/lenses.md:60]
    links:
      serves: [goal-studio-lens-wiring]

  - id: rule-studio-retime-by-offset
    kind: rule
    ruleType: constraint
    title: Retiming changes the offset from the anchor
    statement: >-
      Dragging an effect on the timeline writes a new offset from its anchor, not an absolute time. The story stays correct
      when narration changes length.
    when: An author retimes an effect on the timeline
    then: Studio changes the offset and keeps the anchor
    status: decided
    source: [studio:docs/design/lenses.md:56, log:118]
    links:
      serves: [goal-studio-lens-timeline]

  - id: rule-studio-lens-switch-never-mutates
    kind: rule
    ruleType: constraint
    title: Switching lens never changes the story
    statement: >-
      Switching a lens never changes the story. All lenses read and write one story, and the preview, the playhead and the
      agent panel stay present in every lens.
    status: decided
    source: [studio:docs/design/lenses.md:7, studio:docs/design/lenses.md:9, log:118]
    links:
      serves: [goal-studio-lenses]

  - id: rule-studio-stale-result-dropped
    kind: rule
    ruleType: constraint
    title: A late compile never replaces a newer one
    statement: >-
      A compile is keyed by the story revision. A newer edit interrupts an older compile, and update drops a late result for
      an old revision.
    status: decided
    source: [studio:docs/specs/0001-first-felt-journey.md:72, studio:docs/specs/0001-first-felt-journey.md:139, log:118]
    links:
      serves: [goal-studio-first-felt-journey]

  - id: rule-studio-pure-update
    kind: rule
    ruleType: constraint
    title: update and view stay pure
    statement: >-
      Foldkit update and view are total functions. Work leaves update only as a Command, a Subscription or a
      ManagedResource.
    status: decided
    source: [studio:AGENTS.md:53, studio:docs/specs/0000-development-lifecycle.md:81-82, log:118]
    links:
      serves: [goal-studio-checked-change]
      constrains: [comp-studio-editor]

  - id: rule-studio-effect-one-version
    kind: rule
    ruleType: constraint
    title: Effect packages stay on one pinned version
    statement: >-
      The effect package and every @effect runtime package use one version, and an upgrade of Effect or Foldkit is its own
      spec. A check on the lock file enforces it.
    status: decided
    source: [studio:AGENTS.md:34, studio:AGENTS.md:54, studio:docs/specs/0000-development-lifecycle.md:77, log:118]
    links:
      serves: [goal-org-stay-on-supported-stack]
      constrains: [comp-studio-editor]

  - id: rule-studio-one-spec-one-pr
    kind: rule
    ruleType: constraint
    title: One spec, one branch, one pull request
    statement: >-
      Each change has one spec, one branch and one pull request. The plan evolves with the build, and review checks the
      plan, the code and their agreement.
    status: decided
    source: [studio:docs/specs/0000-development-lifecycle.md:3, studio:AGENTS.md:13-17, log:118]
    links:
      serves: [goal-studio-checked-change]
      triggers: [process-studio-pr-review-loop]

  - id: rule-studio-main-protected
    kind: rule
    ruleType: constraint
    title: Main needs a pull request and a passing check
    statement: >-
      Main requires a pull request, even for administrators. The status check named checks must pass, and force push and
      deletion are blocked.
    status: decided
    source: [studio:docs/specs/0000-development-lifecycle.md:55, studio:AGENTS.md:20, log:118]
    links:
      serves: [goal-studio-checked-change]

  - id: rule-studio-exceptions-registered
    kind: rule
    ruleType: constraint
    title: Every suppression has a registry entry
    statement: >-
      A lint or type suppression needs an entry in the exception registry with a reason and a retirement trigger. The check
      fails on a suppression without an entry and on an entry without a suppression. It does not yet see
      effect-diagnostics comments (issue 7).
    status: decided
    source: [studio:AGENTS.md:33, studio:AGENTS.md:45, issue:studio#7, log:118]
    links:
      serves: [goal-studio-checked-change]
      constrains: [comp-studio-quality-tools]

  - id: rule-studio-reviewer-not-author
    kind: rule
    ruleType: constraint
    title: A reviewer is never the author of the head
    statement: >-
      The record script refuses a pass whose author is among its reviewers. It stops the honest mistake, not forgery,
      because names are self-declared.
    status: decided
    source: [studio:AGENTS.md:17, studio:docs/specs/0003-review-and-verify-skills.md:46, log:118]
    links:
      serves: [goal-studio-checked-change]
      constrains: [comp-studio-review-skills]

  - id: rule-studio-verify-skill-maintenance
    kind: rule
    ruleType: event-action
    title: A user-visible change updates the verify skill
    statement: >-
      A pull request that adds or changes user-visible behaviour updates the feature map of the verify skill in the same
      pull request. A reviewer runs the skill, and a stale map is a medium finding.
    when: A pull request adds or changes user-visible behaviour
    then: The same pull request updates the feature map, and a test checks that each spec has an entry or a reason
    status: decided
    source: [studio:AGENTS.md:18, studio:docs/specs/0003-review-and-verify-skills.md:3, studio:docs/specs/0003-review-and-verify-skills.md:62-68, log:118]
    links:
      serves: [goal-studio-checked-change]
      constrains: [comp-studio-verify-skill]
      triggers: [process-studio-verify-journey]

  - id: rule-studio-heavy-job-headroom
    kind: rule
    ruleType: constraint
    title: A heavy job needs machine headroom first
    statement: >-
      A heavy job, such as a build, a browser run or the full gate, runs only within the operator's four limits for memory,
      swap-in, memory pressure and load.
    status: decided
    source: [record:studio:docs/specs/0003-review-and-verify-skills.md:113, log:118]
    links:
      serves: [goal-studio-checked-change]
      triggers: [process-studio-verify-journey]

  - id: rule-studio-no-licence-file
    kind: rule
    ruleType: constraint
    title: Studio is proprietary, all rights reserved
    statement: >-
      Studio is proprietary, all rights reserved. A LICENSE file and third-party notices are to state this (neither exists
      yet), and third-party code keeps its own licence.
    when: Studio code or a binary is shared
    then: The LICENSE file states proprietary, all rights reserved, and the third-party notices list bundled code
    status: decided
    source: [log:95, log:43]
    links:
      serves: [goal-studio-vision]
      constrains: [comp-studio-product]
