elements:
  - id: goal-org-vision
    kind: goal
    title: Multimedia that authors declare and tools rebuild
    statement: >-
      People make multimedia by declaring its narrative and structure. tsukuri builds the artifacts, so they stay
      accessible and reproducible and are rebuilt as the author edits.
    tagline: "Declarative multimedia: accessible, reproducible, rebuilt as you edit."
    intentLine: "We take care of building; you focus on creating."
    technicalLine: >-
      Semantically declared story beats, compiled into multimedia artifacts: statecharts for structure, functional
      reactive time, and an incremental build graph, written in Effect.
    elevator: >-
      You declare the story's beats and what they mean; tsukuri derives motion, timing and every artifact, reproducibly,
      rebuilding only what an edit changes.
    status: decided
    source: [log:7, log:9, log:10, log:60-61]
    canvas: [value-propositions]

  - id: goal-org-declarative-creation
    kind: goal
    title: Declare scenes and transitions, not build steps
    statement: >-
      Authors declare the story: scenes, states and the transitions between them, with effects tied to events. They do
      not write the imperative steps that build the video.
    status: decided
    source: [log:11, log:14, log:19]
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-org-vision]

  - id: goal-org-accessible-artifacts
    kind: goal
    title: Accessible artifacts for every audience
    statement: >-
      Every artifact can serve hearing-impaired, visually impaired and reduced-motion audiences, and language variants
      adjust the timing.
    status: decided
    source: [log:10, log:32]
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-org-vision]

  - id: goal-org-reproducible-builds
    kind: goal
    title: Reproducible builds
    statement: Builds are reproducible.
    status: decided
    source: [log:10]
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-org-vision]

  - id: goal-org-incremental-builds
    kind: goal
    title: Fast, incremental, reactive builds
    statement: An edit rebuilds only what it changes, fast enough that the author sees the result as they edit.
    status: decided
    source: [log:10, log:7]
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-org-vision]

  - id: goal-org-interactive-multimedia
    kind: goal
    title: Interactive multimedia for learning
    statement: >-
      Interactivity is the missing multimedia dimension. Websites become an artifact type with interactive learning
      material. Interactive lessons are deferred for later investigation.
    status: decided
    source: [log:36, log:37, log:38]
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-org-vision]

  - id: goal-org-modular-extensible
    kind: goal
    title: Modular and extensible by users
    statement: >-
      The compiler gives modular contracts, components and building blocks. Users can write plugins and extensions,
      add render engines through an SDK, and bring their own agents.
    status: decided
    source: [log:15, log:28, log:43]
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-org-vision]

  - id: goal-org-open-compiler
    kind: goal
    title: An open compiler and open formats
    statement: The compiler and its formats are open source under Apache-2.0, so products and plugins can build on them.
    status: decided
    source: [log:43, log:44]
    canvas: [value-propositions, channels]
    links:
      supports: [goal-org-modular-extensible]

  - id: goal-org-product-family
    kind: goal
    title: A family of products on the open core
    statement: >-
      The family has a collaborative editor, closed source and built on the open compiler, and a node-graph UI library
      for Foldkit, in its own repository under the MIT licence.
    status: decided
    source: [log:43, log:45, log:48]
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-org-vision]

  - id: goal-org-sustainable-funding
    kind: goal
    title: Fund the work with paid features that cost money to run
    statement: >-
      The editor has a free tier for basic features that cost nothing to run. Costly premium features sit behind a
      paywall: multiplayer collaboration and deeply integrated hosted AI agents.
    status: decided
    source: [log:43]
    canvas: [revenue-streams]
    links:
      supports: [goal-org-product-family]

  - id: goal-org-correctness-by-construction
    kind: goal
    title: Correctness by construction
    statement: >-
      Make bad states unrepresentable, keep one source for every fact, and give every derived thing an explicit edge
      back to its core.
    status: decided
    source: [log:54]
    canvas: [key-activities]

  - id: goal-org-stay-on-supported-stack
    kind: goal
    title: Stay on supported Effect APIs and fix problems upstream
    statement: >-
      Packages that use unstable Effect APIs cap their version range below the next minor. Upstream fixes through
      Effect's own services are preferred to workarounds.
    status: decided
    source: [log:55, log:56]

  - id: goal-org-written-intent
    kind: goal
    title: Intent written down, sourced and testable
    statement: >-
      Why the products exist, what they must do and what is still open is written in one model. Every element cites a
      source, and CI fails when the model contradicts itself.
    status: proposed
    rationale: >-
      The operator asked for this model in the session of 2026-10-29. The request is not a line of the decision log, so
      the goal waits for the operator to confirm it.
    source: [log:3]
    canvas: [key-activities]

  - id: problem-org-imperative-tools
    kind: problem
    title: Video tools model a video as imperative steps
    statement: >-
      Traditional video editors and motion-graphics tools treat a video as a sequence of imperative commands or steps.
      The implicit state machine stays hidden.
    status: decided
    source: [log:14, log:19]
    links:
      motivates: [goal-org-declarative-creation]

  - id: problem-org-demand-unmeasured
    kind: problem
    title: Demand for the products is not measured
    statement: >-
      Demand is validated before tiers are designed. The project publishes the roadmap, collects a waitlist for the sync
      server and hosted agents, interviews prospective creators and sets a threshold; no pricing or billing code is
      written before the threshold is met. The repositories read hold no measure of demand yet, so this work is still to
      do.
    status: decided
    source: [log:79, tsukuri:docs/design/open-core-boundary.md:69]
    links:
      hinders: [goal-org-sustainable-funding]

  - id: problem-org-lifecycle-copies
    kind: problem
    title: The lifecycle toolchain is copied into every repository
    statement: >-
      The four repositories keep their own copies of the lifecycle toolchain (hooks, scripts and CI), each with a
      provenance note. A drift test in `tsukuri-labs/.github` compares blob hashes of the files that should be identical and
      fails on a difference; unifying the copies stays manual. The test does not exist yet.
    status: decided
    source: [log:80, studio:PROVENANCE.md:3, foldkit-flow:PROVENANCE.md:3]
    links:
      hinders: [comp-org-lifecycle-toolchain]
    gap:
      repo: org
      fix: Add a script to tsukuri-labs/.github that compares blob hashes of the files that should be identical across the four repositories and fails on a difference.

  - id: problem-org-no-written-roadmap
    kind: problem
    title: The product READMEs do not link the generated roadmap
    statement: >-
      The roadmap is generated in the `tsukuri-labs/.github` repository (`docs/roadmap.md`) and linked from the organisation
      profile. The READMEs of tsukuri and studio do not link it, and neither contains the word "roadmap". The root of
      both repositories has no ROADMAP file.
    status: open
    rationale: >-
      Checked at the pinned commits of tsukuri and studio. Issues 19 and 20 of tsukuri are roadmap entries kept as
      issues. The gap is one link in each README. The operator should confirm that the generated roadmap is the place
      to link.
    source:
      ["absent:tsukuri:ROADMAP.md", "absent:studio:ROADMAP.md", "tsukuri:README.md:1", "studio:README.md:1"]
    gap:
      repo: tsukuri
      fix: Link the generated roadmap of the tsukuri-labs/.github repository from the README of tsukuri and of studio.

  - id: constraint-org-apache-2
    kind: constraint
    constraintType: legal
    title: The compiler and formats are Apache-2.0
    statement: >-
      The compiler and its formats are licensed under Apache-2.0. The copyright holder is the operator as an individual;
      contributions stay with their authors under the same licence.
    status: decided
    source: [log:44, record:tsukuri:docs/design/open-core-boundary.md:64]
    links:
      hinders: [goal-org-sustainable-funding]

  - id: constraint-org-gpl-ffmpeg
    kind: constraint
    constraintType: legal
    title: ffmpeg with libx264 is GPL
    statement: >-
      ffmpeg with libx264 is GPL. The operator decided to keep libx264 and never bundle ffmpeg, so GPL duties arise only
      if a product ever bundles it (issue 7).
    status: decided
    source: [log:50, log:78]
    refs: ["issue:tsukuri#7"]
    links:
      hinders: [goal-org-product-family]

  - id: constraint-org-working-name
    kind: constraint
    constraintType: organisational
    title: The name reebeat was the working name
    statement: >-
      `reebeat` was the working name until 2026-10-30; the operator replaced it with Tsukuri (see
      constraint-org-final-name). The clearance check found no register hit for REEBEAT itself, but a registered EU mark
      REBEAT (classes 9, 35, 41, to 2034) and an active Norwegian registration FREEBEAT (classes 16, 28, 38, 41, 42). The
      operator paused the first npm publish for a Norwegian IP advisor's opinion (line 113), then named Tsukuri the
      preferred replacement (line 114) and decided on 2026-10-30 not to wait for the advisor (lines 118 and 119). The GitHub and npm organisations named reebeat
      were reserved. A trademark policy is not written yet.
    status: decided
    source:
      - log:75
      - log:113
      - log:114
      - log:118
      - log:119
      - tsukuri:README.md:42
      - tsukuri:docs/design/open-core-boundary.md:68

  - id: constraint-org-final-name
    kind: constraint
    constraintType: organisational
    title: The product is published as Tsukuri, without an advisor's clearance, at the operator's risk
    statement: >-
      The operator said Tsukuri (作り) is good and named it the preferred replacement for the working name `reebeat` (line
      114), and decided on 2026-10-30 to publish `@tsukuri/*` now, without waiting for the Norwegian IP advisor (lines 118
      and 119). No advisor has cleared Tsukuri; line 114 had asked for that opinion, and the operator accepts the trademark
      risk (line 119, D4). The npm organisation `tsukuri` is owned by the operator (line 118). The GitHub organisation
      handle is `tsukuri-labs`: the operator decided to rename the organisation and never to delete it (lines 117 and 118).
      The domain `tsukuri.dev` is registered and managed in Cloudflare (line 123). A published npm name is permanent.
    status: decided
    source:
      - log:114
      - log:117
      - log:118
      - log:119
      - log:123
    links:
      constrains: [comp-tsukuri-product]

  - id: opportunity-org-one-declaration-many-surfaces
    kind: opportunity
    title: One declaration, many surfaces
    statement: >-
      One declared interaction can become an agent function, a web control, a visible-cursor action in a video and a deck
      step. Authors do not write each surface by hand.
    status: proposed
    rationale: >-
      Proposed in comments on issue 19. The operator's log states the interaction model (lines 37 to 39) but not this
      slogan or the capability negotiation it needs.
    source: [log:37-39, "issue:tsukuri#19@6503203735"]
    links:
      supports: [goal-org-interactive-multimedia]

  - id: opportunity-org-accessibility-from-one-source
    kind: opportunity
    title: Accessible variants come from the same declaration
    statement: >-
      Captions, audio description, reduced motion and language variants can be derived from the declared story, instead
      of being made by hand for each audience.
    status: proposed
    rationale: >-
      The operator names accessibility as the project's power (log line 10). That derived variants beat hand-made ones
      is an inference from issue 12, not an operator statement.
    source: [log:10, "issue:tsukuri#12"]
    links:
      supports: [goal-org-accessible-artifacts]

  - id: constraint-org-novelty-claim
    kind: constraint
    constraintType: organisational
    title: Claim novelty only for the combination
    statement: >-
      The parts are prior art: statecharts, SMIL, FRP, build systems, Effect and XState. Only their combination applied to
      multimedia is new. The build engine may be designed generically, but it is claimed only for multimedia until it is
      proven elsewhere.
    status: decided
    source: [log:63]

  - id: constraint-org-ffmpeg-process-boundary
    kind: constraint
    constraintType: legal
    title: tsukuri calls ffmpeg as a separate process
    statement: >-
      For now tsukuri keeps libx264 and never bundles ffmpeg: it runs the user's own ffmpeg (or the devenv one) as a
      separate process, so the GPL of ffmpeg does not reach the tsukuri code. A hosted service does not distribute ffmpeg.
      In future, several encoders may sit behind an adapter. If a product ever bundles ffmpeg, it takes on GPL duties for
      that binary.
    status: decided
    source: [log:78, tsukuri:docs/design/third-party.md:5-12]
    refs: ["issue:tsukuri#7"]
    links:
      hinders: [goal-org-product-family]
