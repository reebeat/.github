elements:
  - id: actor-operator
    kind: actor
    actorType: individual
    title: The operator and project owner
    statement: >-
      The person who owns the tsukuri projects, decides their direction and holds the copyright. His sole proprietorship
      is not a separate legal person.
    status: decided
    source: [log:44, record:tsukuri:docs/design/open-core-boundary.md:64]
    links:
      responsible-for: [goal-org-vision, resource-github-org, resource-npm-org]

  - id: actor-contributor-agent
    kind: actor
    actorType: role
    title: Coding agents that build the projects
    statement: >-
      Agents write specs, code and reviews under the lifecycle rules. A pass that the author of the head records about
      its own pull request is refused.
    status: decided
    source: [tsukuri:AGENTS.md:15-17, studio:AGENTS.md:17, log:118]
    links:
      performs: [process-org-ship-change]

  - id: actor-creator
    kind: actor
    actorType: role
    persona: true
    title: Creator
    statement: >-
      A person or agent who declares a story: its scenes, states, transitions and effects. They want to focus on the
      narrative, not on how it is built.
    status: decided
    source: [log:7, log:11, log:118]
    canvas: [customer-segments]
    links:
      performs: [process-org-create-and-deliver]

  - id: actor-learner
    kind: actor
    actorType: role
    persona: true
    title: Learner
    statement: >-
      A person who learns from the artifact. They may be hearing-impaired, visually impaired or sensitive to motion, and
      may need a language variant. They may interact with a website artifact.
    status: decided
    source: [log:32, log:36, log:118]
    canvas: [customer-segments]

  - id: actor-presenter
    kind: actor
    actorType: role
    persona: true
    title: Presenter
    statement: >-
      A person who presents a deck with narration in speaker notes, and records narration against the beats of a story.
    status: decided
    source: [log:45, log:118]
    canvas: [customer-segments]

  - id: actor-agent-operator
    kind: actor
    actorType: role
    persona: true
    title: Agent operator
    statement: >-
      A person who brings their own AI agent and gives it the editing tools, so it can read, edit and check a story.
    status: decided
    source: [log:38, log:43, log:118]
    canvas: [customer-segments]

  - id: actor-plugin-author
    kind: actor
    actorType: role
    persona: true
    title: Plugin author
    statement: >-
      A developer who writes an adapter, a render engine or an extension against the open contracts of the compiler.
    status: decided
    source: [log:28, log:43, log:118]
    canvas: [customer-segments]
    links:
      performs: [process-org-publish-packages]

  - id: resource-github-org
    kind: resource
    resourceType: service
    title: The GitHub organisation tsukuri-labs
    statement: The organisation that holds the repositories of the compiler, the editor and the graph library, and this model.
    status: decided
    source: [tsukuri:README.md:42, log:118]
    canvas: [channels, key-resources]

  - id: resource-npm-org
    kind: resource
    resourceType: service
    title: The npm organisation tsukuri
    statement: The npm organisation under which `@tsukuri/*` pre-releases are published. It exists.
    status: decided
    source: [log:49]
    canvas: [channels, key-resources]

  - id: resource-decision-log
    kind: resource
    resourceType: document
    title: The operator's decision log
    statement: >-
      The operator's own decisions and wording, compiled by the lead agent from the working sessions of 2026-10-28 and
      2026-10-29. Its header says that where a repository document disagrees, the log and its date win.
    status: decided
    source: [log:3, log:118]
    canvas: [key-resources]
