elements:
  - id: process-org-create-and-deliver
    kind: process
    category: primary
    title: Create and deliver a multimedia artifact
    statement: >-
      The value stream of the product family: an author declares a story, tsukuri builds the artifact, the author
      reviews it, and the audience receives it.
    status: decided
    source: [log:7, log:11, log:118]
    links:
      serves: [goal-org-vision]

  - id: process-org-declare-story
    kind: process
    category: primary
    title: Declare the story
    statement: >-
      The creator declares scenes, states, transitions and effects tied to events, by hand, with a studio editor or
      through an agent.
    status: decided
    source: [log:11, log:14, log:20, log:45]
    links:
      part-of: [process-org-create-and-deliver]
      serves: [goal-org-declarative-creation]
      next: [process-org-build-artifact]
      uses: [concept-org-ir]

  - id: process-org-build-artifact
    kind: process
    category: primary
    title: Build the artifact
    statement: >-
      The compiler turns the declared story into the artifact. An edit rebuilds only what it changes, and the build is
      reproducible.
    status: decided
    source: [log:7, log:10]
    links:
      part-of: [process-org-create-and-deliver]
      serves: [goal-org-reproducible-builds, goal-org-incremental-builds]
      next: [process-org-review-artifact]
      produces: [concept-org-artifact]

  - id: process-org-review-artifact
    kind: process
    category: primary
    title: Review the artifact and the plan
    statement: >-
      The author reviews the plan and the artifact, and checks them against the source. They edit the story and build
      again, or approve the result.
    status: decided
    source: [tsukuri:README.md:3, tsukuri:README.md:12-19, log:118]
    links:
      part-of: [process-org-create-and-deliver]
      next: [process-org-deliver-artifact, process-org-declare-story]
      serves: [goal-org-reproducible-builds]

  - id: process-org-deliver-artifact
    kind: process
    category: primary
    title: Deliver the artifact to its audience
    statement: >-
      The artifact reaches its audience as a video, a presentation deck or a website, in a variant that fits the
      audience, for example with captions, reduced motion or another language.
    status: decided
    source: [log:32, log:36, log:37, log:118]
    links:
      part-of: [process-org-create-and-deliver]
      serves: [goal-org-accessible-artifacts, goal-org-interactive-multimedia]
      next: [extproc-org-audience-consumes]

  - id: extproc-org-audience-consumes
    kind: external-process
    title: The audience watches, hears or interacts
    statement: >-
      Learners and viewers consume the artifact. In a dynamic artifact they step through it and raise events by interacting.
    status: decided
    source: [log:36, log:37, log:118]

  - id: process-org-ship-change
    kind: process
    category: governance
    title: Ship a change through spec, code and pull request
    statement: >-
      Every change follows spec, then code, then pull request, one to one. It passes CI and a recorded independent review
      round before the guarded script merges it.
    status: decided
    source: [tsukuri:AGENTS.md:9-17, studio:AGENTS.md:17, log:118]
    links:
      serves: [goal-org-correctness-by-construction]
      uses: [resource-github-org]

  - id: process-org-publish-packages
    kind: process
    category: supporting
    title: Publish packages to npm
    statement: >-
      The compiler's libraries and services are to be published to npm as `@tsukuri/*` pre-releases, so products and
      plugin authors can depend on them. On 2026-10-30 the operator decided to publish without waiting for the Norwegian IP
      advisor (log lines 118 and 119).
    status: decided
    source: [log:49, log:113, log:118, log:119]
    refs: ["pr:tsukuri#18"]
    links:
      serves: [goal-org-open-compiler, goal-org-modular-extensible]
      uses: [resource-npm-org]

  - id: process-org-upgrade-to-paid
    kind: process
    category: supporting
    title: A free user becomes a paying user
    statement: >-
      A free user becomes a paying user only after demand is validated: the project publishes the roadmap, collects a
      waitlist for the sync server and hosted agents, interviews prospective creators and sets a threshold. Tiers are
      designed after that, and no pricing or billing code is written before the threshold is met.
    status: decided
    source: [log:79, log:43, tsukuri:docs/design/open-core-boundary.md:69]
    canvas: [customer-relationships, revenue-streams]
