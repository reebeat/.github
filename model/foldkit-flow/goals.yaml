elements:
  # ---- goals ----
  - id: goal-flow-vision
    kind: goal
    title: A graph canvas for Foldkit applications
    statement: >-
      foldkit-flow is a node-based graph UI for Foldkit, like React Flow or Svelte Flow, in its own repository.
    status: decided
    source:
      - log:48
      - foldkit-flow:README.md:3
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-org-product-family]

  - id: goal-flow-generic-library
    kind: goal
    title: A generic library with no product logic
    statement: >-
      foldkit-flow stays a generic library. It holds no tsukuri product logic, so any Foldkit application can use it.
    status: decided
    source:
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:3
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:35
      - foldkit-flow:README.md:7
      - log:118
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-flow-vision]

  - id: goal-flow-studio-story-graph
    kind: goal
    title: Carry tsukuri studio's story graph
    statement: >-
      The library can draw a statechart map in which Scenes contain States, so tsukuri studio can use it for its story
      graph. tsukuri studio is an intended consumer, not a committed one: it depends on the library only once a studio
      spec adopts it.
    status: decided
    source:
      - log:19
      - log:108
      - studio:docs/design/lenses.md:50-52
      - foldkit-flow:README.md:20
      - foldkit-flow:packages/flow/src/types.ts:54
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-flow-vision]

  - id: goal-flow-first-journey
    kind: goal
    title: One felt journey works end to end
    statement: >-
      A person opens the example, sees a graph, pans and zooms, drags a node, connects two handles, reconnects an edge
      and selects by box. A keyboard-only person can select, move and delete nodes.
    status: proposed
    source:
      - foldkit-flow:README.md:5
      - foldkit-flow:README.md:20
      - foldkit-flow:README.md:66
      - foldkit-flow:README.md:78
    rationale: >-
      README line 5 says the first journey is built (spec 0001) and not published yet. Lines 20 and 66 list what it
      holds: pan and zoom, drag, connect and reconnect with validation, compound nodes, box select, minimap, zoom
      controls, fit view and node-level keyboard control. Keyboard connect is not built (line 78; see
      problem-flow-keyboard-connect-missing). The operator must accept this built journey as the first release scope,
      and confirm that the merged canvas is the intended first release.
    refs: [pr:foldkit-flow#4]
    jtbd:
      persona: actor-flow-app-developer
      when: I build a Foldkit application that shows a graph
      want: a ready canvas with pan, zoom, drag, connect and selection
      soThat: I do not write that interaction code myself
    links:
      subgoal-of: [goal-flow-vision]

  - id: goal-flow-keyboard-access
    kind: goal
    title: Keyboard-accessible graph editing
    statement: >-
      A person who uses only the keyboard can reach nodes, select, move and delete them, and hear the result announced.
      Creating a connection by keyboard is not in the 0.x releases: the README documents it as a gap, the project builds
      it as the next spec, and 1.0 waits for it.
    status: decided
    source:
      - log:110
      - foldkit-flow:README.md:74-78
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:87
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:3
    refs: [pr:foldkit-flow#4]
    canvas: [value-propositions]
    jtbd:
      persona: actor-flow-keyboard-user
      when: I cannot or do not use a pointer
      want: to select, move and delete nodes with keys
      soThat: I can edit the same graph as a pointer user
    links:
      supports: [goal-org-accessible-artifacts]
      subgoal-of: [goal-flow-vision]

  - id: goal-flow-performance
    kind: goal
    title: Stay smooth at 500 nodes and 700 edges
    statement: >-
      Dragging one node in a graph of 500 nodes and 700 edges feels smooth, and zoom and pan re-render no node.
    status: decided
    source:
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:91
      - foldkit-flow:README.md:82
      - log:118
    refs: [pr:foldkit-flow#4]
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-flow-vision]

  - id: goal-flow-browser-proof
    kind: goal
    title: Prove interaction in a real browser
    statement: >-
      Graph behaviour is checked with real pointer and keyboard input in a real browser, not only in unit tests.
    status: decided
    source:
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:92
      - foldkit-flow:AGENTS.md:48
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:130
      - log:118
    refs: [pr:foldkit-flow#4]
    links:
      supports: [goal-flow-first-journey]

  - id: goal-flow-lifecycle
    kind: goal
    title: Every change travels spec, code, PR
    statement: >-
      Each change has one spec, one branch and one PR. It passes the same gates locally, in CI and in a recorded review.
    status: decided
    source:
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:3
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:9
      - foldkit-flow:AGENTS.md:13-19
      - log:118
    canvas: [key-activities]
    links:
      supports: [goal-org-correctness-by-construction, goal-org-written-intent]

  - id: goal-flow-upstream-offer
    kind: goal
    title: Offer the library to Foldkit
    statement: >-
      When the API has settled, the project offers the library to Foldkit as `@foldkit/flow`. It does not offer it
      earlier.
    status: decided
    source:
      - record:foldkit-flow:STATE.md:14
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:111
      - log:118
    canvas: [key-partners, channels]

  - id: goal-flow-publish
    kind: goal
    title: Publish the package for others to use
    statement: >-
      The project publishes pre-releases of the library as `@tsukuri/flow` under the tsukuri npm organisation, so other
      applications can install it; on 2026-10-30 the operator decided not to wait for the Norwegian IP advisor (log line
      118). The repository stays `foldkit-flow`. If Foldkit adopts the library, the project publishes `@foldkit/flow` and deprecates
      `@tsukuri/flow`.
    status: decided
    source:
      - log:49
      - log:105
      - log:113
      - log:118
      - foldkit-flow:README.md:5
      - foldkit-flow:packages/flow/package.json:4
    canvas: [channels]
    links:
      subgoal-of: [goal-flow-vision]

  - id: goal-flow-respect-xyflow
    kind: goal
    title: Credit and respect xyflow
    statement: >-
      The project keeps xyflow's licence notice and credit. The credit link is visible by default, and an application
      may hide it. xyflow asks its users to keep its attribution or to support the project.
    status: decided
    source:
      - log:106
      - foldkit-flow:NOTICE:4-17
      - foldkit-flow:README.md:86
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:34
    canvas: [key-partners]
    links:
      subgoal-of: [goal-flow-vision]

  # ---- problems and gaps ----
  - id: problem-flow-unpublished
    kind: problem
    title: The package is unpublished and private
    statement: >-
      The operator decided to publish `@tsukuri/flow` pre-releases under the npm org. Nothing is published yet: the
      library package is private at version 0.0.0 and still named `foldkit-flow`, and the README says it is not
      published yet. On 2026-10-30 the operator decided to publish without waiting for the Norwegian IP advisor (log line
      118).
    status: decided
    source:
      - log:105
      - log:113
      - log:118
      - foldkit-flow:README.md:5
      - foldkit-flow:packages/flow/package.json:4
    gap:
      repo: foldkit-flow
      fix: >-
        Rename the package to `@tsukuri/flow`, drop `private`, and publish a pre-release through the org's publish
        process.
    links:
      hinders: [goal-flow-publish]

  - id: problem-flow-licence-scan-missing
    kind: problem
    title: No licence scan of published dependencies
    statement: >-
      The operator decided to add a licence scan of the published dependencies, so that no copyleft licence reaches
      `packages/`. No gate runs it: the `ready` script lists no licence check.
    status: open
    source:
      - log:111
      - foldkit-flow:package.json:13
    rationale: >-
      The operator decision (log line 111) adds the scan. The scripts in package.json line 13 show no licence gate at
      the pinned commit.
    gap:
      repo: foldkit-flow
      fix: Add a licence scan of the published dependencies to `ready` and CI, failing on an EPL or GPL licence.
    links:
      hinders: [req-flow-licence-hygiene]

  - id: problem-flow-library-applies-deletion
    kind: problem
    title: The library applies a deletion itself
    statement: >-
      The operator decided that the library reports outcomes and the app applies graph changes (log line 109). For a
      deletion, the Flow removes the deleted nodes and edges from its own Model and then reports them.
    status: open
    source:
      - log:109
      - foldkit-flow:packages/flow/src/update.ts:289-343
    rationale: >-
      update.ts lines 289 to 343 remove the nodes and edges and report both sets. The log line does not say whether a
      deletion counts as a graph change that the app applies, or whether the Flow's own Model is the app's. The operator
      must say how "the app applies" reads for a deletion.
    gap:
      repo: foldkit-flow
      fix: Report a deletion as an outcome that the application applies, or record that the Flow's own Model is the application's.
    links:
      hinders: [comp-flow-flow-submodel]

  - id: problem-flow-goals-undocumented
    kind: problem
    title: No stated goals beyond the README
    statement: >-
      The README gives one sentence of purpose, and spec 0000 states the goal of its lifecycle. No file gives the
      library's own product goals, users or success measures.
    status: decided
    source:
      - foldkit-flow:README.md:3-7
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:9
      - foldkit-flow:STATE.md:7
      - log:118
    gap:
      repo: foldkit-flow
      fix: Link this model's goals from the README so the purpose is written once.
    links:
      hinders: [goal-flow-vision]

  - id: problem-flow-no-glossary
    kind: problem
    title: No glossary for the graph terms
    statement: >-
      The repository has no GLOSSARY.md. Terms such as node, handle, connection and controller have no single
      definition.
    status: decided
    source:
      - absent:foldkit-flow:GLOSSARY.md
      - log:118
    gap:
      repo: foldkit-flow
      fix: Add a GLOSSARY.md generated from the concepts in this model.
    links:
      hinders: [goal-flow-first-journey]

  - id: problem-flow-state-blocked-nothing
    kind: problem
    title: STATE says nothing is blocked
    statement: >-
      STATE.md lists "Blocked: Nothing". The same file names the Foldkit plugin mismatch, and issue #3 about the Bun
      toolchain is open.
    status: decided
    source:
      - foldkit-flow:STATE.md:13
      - foldkit-flow:STATE.md:16-18
      - issue:foldkit-flow#3
      - log:118
    gap:
      repo: foldkit-flow
      fix: 'Add a "Risks" list to STATE.md that names the plugin mismatch and issue #3.'
    links:
      hinders: [goal-flow-lifecycle]

  - id: problem-flow-bun-mismatch
    kind: problem
    title: vp run may use a different Bun than devenv
    statement: >-
      The package manager range is `^1.4.2` with download on failure. `vp run` can download its own Bun and so differ
      from the Bun that devenv pins.
    status: decided
    source:
      - issue:foldkit-flow#3
      - foldkit-flow:package.json:44-48
      - foldkit-flow:devenv.nix:8
      - log:118
    refs: [issue:foldkit-flow#3]
    gap:
      repo: foldkit-flow
      fix: Pin devEngines to Bun 1.4.2 exactly and bump it together with devenv.
    links:
      hinders: [req-flow-reproducible-toolchain]

  - id: problem-flow-keyboard-connect-missing
    kind: problem
    title: Keyboard users cannot create connections
    statement: >-
      The operator decided to publish 0.x with keyboard connect documented as a gap, to build it as the next spec, and
      to block 1.0 on it. Today the built journey does not let a keyboard-only person connect two handles: README line
      78 says keyboard connect is not built, and spec 0001 lists it as an open question.
    status: decided
    source:
      - log:110
      - foldkit-flow:README.md:78
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:116
      - foldkit-flow:STATE.md:11
    gap:
      repo: foldkit-flow
      fix: >-
        Write the keyboard connect spec (choose a handle, then a target with arrow keys) and build it as the next spec;
        keep the gap in the README until then, and do not release 1.0 before it ships.
    links:
      hinders: [goal-flow-keyboard-access]

  - id: problem-flow-journey-not-in-ci
    kind: problem
    title: The browser journey does not run in CI
    statement: >-
      CI has no browser. The journey and the performance check run only on a developer's machine.
    status: decided
    source:
      - foldkit-flow:.github/workflows/checks.yml:3
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:92
      - foldkit-flow:AGENTS.md:48
      - foldkit-flow:STATE.md:12
      - log:118
    gap:
      repo: foldkit-flow
      fix: Run the journey in CI with a pinned Chromium, or record who runs it before each merge.
    links:
      hinders: [goal-flow-browser-proof]

  - id: problem-flow-browsers-untested
    kind: problem
    title: Only Chromium and mouse input were tested
    statement: >-
      The journey ran in one Chromium version. Firefox, WebKit and touch input were not run.
    status: decided
    source:
      - pr:foldkit-flow#4
      - log:118
    gap:
      repo: foldkit-flow
      fix: Choose which browsers and input types the library supports, then add them to the journey.
    links:
      hinders: [req-flow-portability-browsers]

  - id: problem-flow-demand-unmeasured
    kind: problem
    title: Demand and users are not measured
    statement: >-
      The cited sources show no measure of who needs the library or who uses it. Nothing is published, and the sources
      record no user count or request.
    status: decided
    source:
      - foldkit-flow:README.md:5
      - foldkit-flow:packages/flow/package.json:4
      - log:118
    gap:
      repo: foldkit-flow
      fix: Choose a signal to read after publishing, such as downloads or issues, and write it down.
    links:
      hinders: [goal-flow-publish]

  - id: problem-flow-upstream-terms-open
    kind: problem
    title: Terms of the Foldkit offer remain to record
    statement: >-
      The operator decided to offer the library as `@foldkit/flow` once its API settles. If Foldkit adopts it, the
      project publishes `@foldkit/flow` and deprecates `@tsukuri/flow`. What counts as settled, the date and the licence
      header are not yet recorded.
    status: decided
    source:
      - log:105
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:111
      - foldkit-flow:STATE.md:14
    gap:
      repo: foldkit-flow
      fix: Record what counts as a settled API, the date and the licence header in a spec revision.
    links:
      hinders: [goal-flow-upstream-offer]

  - id: problem-flow-deferred-workflow-questions
    kind: problem
    title: Workflow hardening is deferred
    statement: >-
      Vendoring Foldkit as a subtree, requiring human approval, signed commits and Renovate are all deferred.
    status: decided
    source:
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:112-113
      - log:118
    gap:
      repo: foldkit-flow
      fix: Decide each item or record that it stays deferred.
    links:
      hinders: [goal-flow-lifecycle]

  - id: problem-flow-lint-mocking-gap
    kind: problem
    title: The module-mocking lint rule has a gap
    statement: >-
      The lint rule that forbids module mocking matches only the `vitest` import source, so a mock imported from
      `vite-plus/test` passes.
    status: decided
    source:
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:142
      - foldkit-flow:tools/oxlint/anti-slop/rules/no-module-mocking.ts:41-42
      - issue:foldkit-flow#5
      - log:118
    refs: [issue:foldkit-flow#5]
    gap:
      repo: foldkit-flow
      fix: Make the anti-slop module-mocking rule match the `vite-plus/test` source too.
    links:
      hinders: [goal-flow-lifecycle]

  - id: problem-flow-community-files
    kind: problem
    title: No security, conduct or contributing files
    statement: >-
      The public repository has no SECURITY.md, CODE_OF_CONDUCT.md or CONTRIBUTING.md. The README has a short
      contributing section.
    status: decided
    source:
      - absent:foldkit-flow:SECURITY.md
      - absent:foldkit-flow:CODE_OF_CONDUCT.md
      - absent:foldkit-flow:CONTRIBUTING.md
      - foldkit-flow:README.md:98-100
      - log:118
    gap:
      repo: foldkit-flow
      fix: Add the three files before the first publish.
    links:
      hinders: [goal-flow-publish]

  # ---- constraints ----
  - id: constraint-flow-mit-licence
    kind: constraint
    constraintType: legal
    title: The library is MIT licensed
    statement: >-
      foldkit-flow is released under the MIT licence.
    status: decided
    source:
      - log:48
      - foldkit-flow:LICENSE:1-3
      - foldkit-flow:README.md:96
    canvas: [key-resources]
    links:
      constrains: [comp-flow-product]

  - id: constraint-flow-public-repo
    kind: constraint
    constraintType: organisational
    title: The repository is public and holds no secrets
    statement: >-
      The repository is public. It never holds a secret or personal data.
    status: decided
    source:
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:3
      - foldkit-flow:AGENTS.md:3
      - log:118
    links:
      constrains: [resource-flow-repo]

  - id: constraint-flow-xyflow-notice
    kind: constraint
    constraintType: legal
    title: Keep xyflow's licence notice and credit
    statement: >-
      xyflow's code is MIT licensed. The project keeps its notice in NOTICE, credits it in the README and shows the
      credit link by default. An application may hide the link.
    status: decided
    source:
      - log:106
      - foldkit-flow:NOTICE:4-17
      - foldkit-flow:README.md:86
      - foldkit-flow:AGENTS.md:73
    links:
      constrains: [comp-flow-library]
      hinders: [goal-flow-publish]

  - id: constraint-flow-no-elk
    kind: constraint
    constraintType: legal
    title: ELK stays out of the library
    statement: >-
      ELK.js is licensed EPL-2.0 OR GPL-3.0. It stays out of `packages/`, so the library does not depend on it. A
      private example may use it, and layout stays with the application.
    status: decided
    source:
      - log:111
      - foldkit-flow:AGENTS.md:31
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:35
      - foldkit-flow:README.md:7
    links:
      constrains: [comp-flow-library]

  - id: constraint-flow-effect-range
    kind: constraint
    constraintType: technical
    title: Cap the Effect range for unstable API use
    statement: >-
      A package that uses an unstable or experimental Effect API accepts nothing above the next minor.
    status: decided
    source:
      - log:55
      - record:foldkit-flow:AGENTS.md:65
      - foldkit-flow:packages/flow/package.json:30-33
    links:
      constrains: [comp-flow-library]

  - id: constraint-flow-effect-peer-mismatch
    kind: constraint
    constraintType: technical
    title: Foldkit declares Effect 4.0.0, the repo runs 4.1.0
    statement: >-
      Foldkit 0.169.0 declares a peer of `effect@4.0.0`. The repository runs 4.1.0, so Bun prints peer warnings.
    status: decided
    source:
      - foldkit-flow:AGENTS.md:64
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:103
      - log:118
    links:
      hinders: [comp-flow-library]

  - id: constraint-flow-vite-plugin-crypto
    kind: constraint
    constraintType: technical
    title: The Foldkit Vite plugin cannot run on Effect 4.1.0
    statement: >-
      `@foldkit/vite-plugin` 0.28.0 imports `Crypto` from the Effect root, which 4.1.0 lacks, so the example does not
      use it. The project waits for an upstream fix and does not work around it.
    status: decided
    source:
      - log:56
      - foldkit-flow:AGENTS.md:64
      - foldkit-flow:STATE.md:13
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:104
      - log:118
    canvas: [key-partners]
    links:
      constrains: [comp-flow-example-app]

  - id: constraint-flow-xyflow-pinned
    kind: constraint
    constraintType: technical
    title: Pin @xyflow/system exactly
    statement: >-
      The library depends on `@xyflow/system` at the exact version 0.0.83, because a 0.0.x release may break. The
      project bumps the pin on purpose, and the journey gate decides each bump.
    status: decided
    source:
      - log:107
      - foldkit-flow:packages/flow/package.json:18
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:42
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:111
    links:
      constrains: [resource-flow-xyflow-system]

  # ---- opportunities ----
  - id: opportunity-flow-xyflow-core
    kind: opportunity
    title: Reuse xyflow's framework-free core
    statement: >-
      React Flow and Svelte Flow share `@xyflow/system`, which holds pan and zoom, drag, handles, edge paths and the
      minimap. The Foldkit binding reuses it at an exact pin that the project bumps on purpose, instead of rewriting
      that interaction code.
    status: decided
    source:
      - log:107
      - foldkit-flow:README.md:86
      - foldkit-flow:NOTICE:12-15
    canvas: [key-partners, key-resources]
    links:
      supports: [goal-flow-first-journey]

  - id: opportunity-flow-other-foldkit-apps
    kind: opportunity
    title: Other Foldkit apps can use it
    statement: >-
      Foldkit app developers are the audience: a generic library with no product logic can serve any Foldkit
      application, and Foldkit itself may adopt it. The example app is the only consumer for now.
    status: decided
    source:
      - log:48
      - log:108
      - foldkit-flow:STATE.md:14
    canvas: [customer-segments]
    links:
      supports: [goal-flow-upstream-offer]

  - id: opportunity-flow-real-browser-defects
    kind: opportunity
    title: A real browser finds defects unit tests miss
    statement: >-
      Spec 0001 records that real Chromium runs found defects that unit tests missed: the connect gesture, the minimap,
      teardown, reconnect ends and the lazy cache.
    status: decided
    source:
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:130
      - pr:foldkit-flow#4
      - log:118
    links:
      supports: [goal-flow-browser-proof]
