elements:
  # ---- components ----
  - id: comp-flow-product
    kind: component
    tier: product
    title: foldkit-flow
    statement: >-
      A node-based graph UI for Foldkit, like React Flow or Svelte Flow, in its own repository under the MIT licence.
    status: decided
    source:
      - log:48
      - foldkit-flow:README.md:3
      - foldkit-flow:README.md:96
    repo: foldkit-flow
    licence: MIT
    canvas: [value-propositions, key-resources]
    links:
      serves: [goal-flow-vision]

  - id: comp-flow-library
    kind: component
    tier: library
    title: packages/flow (the library)
    statement: >-
      The reusable library, to be published as `@tsukuri/flow` (pre-releases under the tsukuri npm org; the operator decided
      on 2026-10-30 not to wait for the Norwegian IP advisor, log line 118; the repository stays `foldkit-flow`): the graph Model, update, view
      and Mounts, with peers on Effect and Foldkit. If Foldkit adopts it, the project publishes `@foldkit/flow` and
      deprecates `@tsukuri/flow`.
    status: decided
    source:
      - log:105
      - log:113
      - log:118
      - foldkit-flow:AGENTS.md:25
      - foldkit-flow:README.md:5
      - foldkit-flow:packages/flow/src/index.ts:1-39
    package: "@tsukuri/flow"
    repo: foldkit-flow
    licence: MIT
    proposedPricing: free
    links:
      part-of: [comp-flow-product]
      serves: [goal-flow-generic-library]
      depends-on: [resource-flow-xyflow-system, resource-flow-foldkit, resource-flow-effect]

  - id: comp-flow-example-app
    kind: component
    tier: app
    title: apps/example (the example app)
    statement: >-
      A Foldkit app that is the library's first user. It exercises every feature and shows how an application applies
      outcomes.
    status: decided
    source:
      - foldkit-flow:AGENTS.md:3
      - foldkit-flow:AGENTS.md:24
      - foldkit-flow:apps/example/package.json:16
      - foldkit-flow:README.md:20
      - log:118
    links:
      part-of: [comp-flow-product]
      serves: [goal-flow-first-journey]
      depends-on: [comp-flow-library, resource-flow-foldkit]

  - id: comp-flow-quality-tools
    kind: component
    tier: tool
    title: tools/quality (repository checks)
    statement: >-
      Checks for the exception registry, the Effect family, the published Effect range and the Foldkit lint adapter.
    status: decided
    source:
      - foldkit-flow:AGENTS.md:26
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:45-47
      - log:118
    links:
      part-of: [comp-flow-product]
      realizes: [req-flow-maintain-gates, req-flow-effect-range-gated]

  - id: comp-flow-oxlint-rules
    kind: component
    tier: tool
    title: tools/oxlint (vendored lint rules)
    statement: >-
      The anti-slop Oxlint rules, copied from studio with their provenance.
    status: decided
    source:
      - foldkit-flow:AGENTS.md:28
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:48
      - log:118
    links:
      part-of: [comp-flow-product]
      realizes: [req-flow-maintain-gates]

  - id: comp-flow-journey-tool
    kind: component
    tier: tool
    title: tools/journey (browser gate)
    statement: >-
      A tool that drives the built example in headless Chromium through the journey and measures the performance
      budget. It exits 0 when the checks hold, 1 when a check fails and 75 when it could not time the budget on a busy
      host.
    status: proposed
    source:
      - foldkit-flow:package.json:18
      - foldkit-flow:tools/journey/journey.ts:65-66
      - foldkit-flow:AGENTS.md:48
    rationale: >-
      The tool is built: `bun run journey` runs tools/journey (package.json line 18). journey.ts lines 65 and 66 define
      exit code 75 for a journey that failed nothing but could not time J9 on a busy host, and AGENTS.md line 48 says
      75 means not run, never a pass. The tool runs only locally. The operator must confirm it as a standing tool.
    refs: [pr:foldkit-flow#4]
    links:
      part-of: [comp-flow-product]
      realizes: [req-flow-browser-gate, req-flow-perf-drag]
      depends-on: [resource-flow-chromium]

  - id: comp-flow-ci
    kind: component
    tier: process-asset
    title: CI workflow (checks)
    statement: >-
      The GitHub Actions workflow that runs every gate script on each PR and on pushes to main. It has no browser.
    status: decided
    source:
      - foldkit-flow:.github/workflows/checks.yml:3-10
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:50
      - log:118
    links:
      part-of: [comp-flow-product]
      serves: [goal-flow-lifecycle]
      depends-on: [resource-flow-repo, resource-flow-toolchain]

  - id: comp-flow-agent-skills
    kind: component
    tier: process-asset
    title: Review and PR skills
    statement: >-
      The agent skills `review-pr` and `pr-create`, with scripts that record a review round and refuse to merge without a
      passing one.
    status: decided
    source:
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:51
      - log:118
    links:
      part-of: [comp-flow-product]
      serves: [goal-flow-lifecycle]

  - id: comp-flow-attribution
    kind: component
    tier: library
    title: Attribution option and view
    statement: >-
      The Attribution type (Visible or Hidden, Visible by default) and the view that draws the "Built with xyflow" link.
      An application may set it to Hidden.
    status: decided
    source:
      - log:106
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:53
      - foldkit-flow:packages/flow/src/attribution.ts:15-38
    links:
      part-of: [comp-flow-library]
      realizes: [req-flow-attribution-toggle]

  - id: comp-flow-flow-submodel
    kind: component
    tier: library
    title: Flow Submodel (Model, update, view)
    statement: >-
      The pure part of the library: the graph Model, Messages, update, and view, exposed through `defineFlow`, `init`,
      `update` and `view`. It reports outcomes as out-messages, and the application applies the graph changes.
    status: decided
    source:
      - log:109
      - foldkit-flow:packages/flow/src/flow.ts:14-24
      - foldkit-flow:packages/flow/src/index.ts:1-39
      - foldkit-flow:packages/flow/src/model.ts:14-61
    refs: [pr:foldkit-flow#4]
    links:
      part-of: [comp-flow-library]
      realizes: [req-flow-pan-zoom, req-flow-drag-node, req-flow-connect, req-flow-box-select, req-flow-compound-nodes, req-flow-keyboard-edit, req-flow-delete-closure, req-flow-custom-nodes, req-flow-controls-minimap, isgoal-flow-elm-boundary]

  - id: comp-flow-mounts
    kind: component
    tier: library
    title: Mounts that own the xyflow controllers
    statement: >-
      Foldkit Mounts for the pane (pan, zoom, box), nodes (drag), handles and reconnection (connect), and the minimap.
      Each acquires a controller and destroys it on unmount. The controller factories are injectable: `defineFlow`
      takes them as its second argument and defaults to the real xyflow ones.
    status: proposed
    source:
      - foldkit-flow:packages/flow/src/mounts.ts:34-39
      - foldkit-flow:packages/flow/src/xyflow.ts:7-20
      - foldkit-flow:packages/flow/src/flow.ts:14-24
      - foldkit-flow:AGENTS.md:63
    rationale: >-
      The Mounts are built in mounts.ts: the pane (line 141), the node (line 350), the handle and reconnect anchor
      (lines 529 and 739) and the minimap (line 757). The rule that controllers live in Mounts is in AGENTS.md line 63.
      The factories are the `Controllers` of xyflow.ts, which `defineFlow` accepts. The operator must confirm the Mount
      design and controller lifetimes.
    refs: [pr:foldkit-flow#4]
    links:
      part-of: [comp-flow-library]
      realizes: [req-flow-reconnect, req-flow-correct-lifetimes, isgoal-flow-reuse-controllers]
      depends-on: [resource-flow-xyflow-system]

  # ---- IS goals ----
  - id: isgoal-flow-elm-boundary
    kind: is-goal
    title: The graph lives in the app's Model
    statement: >-
      The graph state sits in the application's Model and changes only in update. Controllers report through Messages,
      and the library reports outcomes that the application applies.
    status: decided
    source:
      - log:109
      - pr:foldkit-flow#4
      - foldkit-flow:AGENTS.md:63
    links:
      supports: [goal-flow-generic-library, goal-flow-first-journey]

  - id: isgoal-flow-reuse-controllers
    kind: is-goal
    title: Reuse xyflow's controllers
    statement: >-
      Pan and zoom, drag, handle connection and the minimap come from xyflow's controllers in `@xyflow/system`, not
      from new code. The package is pinned exactly and bumped on purpose, and the controllers are injected, so a bump
      touches one seam.
    status: decided
    source:
      - log:107
      - foldkit-flow:README.md:86
      - foldkit-flow:packages/flow/src/xyflow.ts:7-20
    links:
      supports: [goal-flow-first-journey]

  - id: isgoal-flow-structural-gates
    kind: is-goal
    title: Gates make bad changes impossible to merge
    statement: >-
      A gate that can be made structural is structural. One command, `bun run ready`, runs them all, and CI runs the
      same scripts.
    status: decided
    source:
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:30-31
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:55
      - log:118
    links:
      supports: [goal-flow-lifecycle]

  - id: isgoal-flow-measured-budget
    kind: is-goal
    title: Measure the performance budget
    statement: >-
      The performance target is measured in a real browser on every journey run, not assumed from design.
    status: decided
    source:
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:91
      - foldkit-flow:README.md:82
      - log:118
    links:
      supports: [goal-flow-performance]

  # ---- functional requirements ----
  - id: req-flow-pan-zoom
    kind: requirement
    reqType: functional
    title: Pan and zoom by wheel and drag
    statement: >-
      A wheel or a drag on the empty canvas changes the viewport. No node is re-rendered.
    status: proposed
    source:
      - foldkit-flow:packages/flow/src/mounts.ts:157-208
      - foldkit-flow:README.md:82
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:83
    rationale: >-
      Built: the pane Mount creates the xyflow pan and zoom controller (mounts.ts lines 157 to 208), and README line 82
      says pan and zoom render no node. Spec 0001 sets falsifier J1 (line 83). The operator must confirm the
      requirement.
    refs: [pr:foldkit-flow#4]
    links:
      serves: [goal-flow-first-journey]
      requires: [concept-flow-viewport]

  - id: req-flow-drag-node
    kind: requirement
    reqType: functional
    title: Drag a node, edges follow
    statement: >-
      Dragging a node changes its position in the Model, and the edges attached to it follow.
    status: proposed
    source:
      - foldkit-flow:packages/flow/src/mounts.ts:384-470
      - foldkit-flow:packages/flow/src/update.ts:183-186
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:84
    rationale: >-
      Built: the node Mount creates the xyflow drag controller (mounts.ts lines 384 to 470), and `DraggedNodes` changes
      the position in the Model (update.ts lines 183 to 186). Spec 0001 sets falsifier J2 (line 84). The operator must
      confirm the requirement.
    refs: [pr:foldkit-flow#4]
    links:
      serves: [goal-flow-first-journey]
      requires: [concept-flow-node]

  - id: req-flow-connect
    kind: requirement
    reqType: functional
    title: Connect handles with validation
    statement: >-
      Dragging from a source handle to a target handle makes a Connected outcome. A target the application refuses makes
      none.
    status: proposed
    source:
      - foldkit-flow:packages/flow/src/mounts.ts:601-625
      - foldkit-flow:packages/flow/src/update.ts:266-281
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:85
    rationale: >-
      Built: the handle Mount starts the connection gesture with the application's `isValidConnection` (mounts.ts lines
      601 to 625), and `update` reports `Connected` only for an accepted connection (update.ts lines 266 to 281). Spec
      0001 sets falsifier J3 (line 85). The operator must confirm the requirement.
    refs: [pr:foldkit-flow#4]
    links:
      serves: [goal-flow-first-journey]
      requires: [concept-flow-connection]

  - id: req-flow-reconnect
    kind: requirement
    reqType: functional
    title: Reconnect an edge end
    statement: >-
      Dragging one end of a selected edge to another handle makes a Reconnected outcome.
    status: proposed
    source:
      - foldkit-flow:packages/flow/src/mounts.ts:723-755
      - foldkit-flow:packages/flow/src/update.ts:522-529
      - foldkit-flow:README.md:20
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:85
    rationale: >-
      Built: dragging one end of a selected edge starts a connection from the opposite end (mounts.ts lines 723 to
      755), and `update` reports `Reconnected` (update.ts lines 522 to 529). README line 20 lists reconnect in the
      Small graph, and spec 0001 sets falsifier J3 (line 85). The operator must confirm the requirement.
    refs: [pr:foldkit-flow#4]
    links:
      serves: [goal-flow-first-journey]
      requires: [concept-flow-edge]

  - id: req-flow-box-select
    kind: requirement
    reqType: functional
    title: Select with a box
    statement: >-
      Shift and drag on the empty canvas selects the nodes inside the box and no others. A plain drag pans.
    status: proposed
    source:
      - foldkit-flow:packages/flow/src/mounts.ts:235-252
      - foldkit-flow:README.md:66
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:86
    rationale: >-
      Built: the pane Mount starts a box on a Shift and left-button press, and a plain drag pans (mounts.ts lines 235
      to 252; README line 66). Spec 0001 sets falsifier J4 (line 86). The operator must confirm the requirement.
    refs: [pr:foldkit-flow#4]
    links:
      serves: [goal-flow-first-journey]
      requires: [concept-flow-selection]

  - id: req-flow-controls-minimap
    kind: requirement
    reqType: functional
    title: Controls, fit view and minimap
    statement: >-
      Buttons zoom in, zoom out and fit the view. A minimap shows the nodes and pans when dragged.
    status: proposed
    source:
      - foldkit-flow:README.md:66
      - foldkit-flow:packages/flow/src/view.ts:464-478
      - foldkit-flow:packages/flow/src/view.ts:499-523
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:88
    rationale: >-
      Built: README line 66 lists the minimap, the zoom controls and fit view, and view.ts draws the controls and the
      minimap (lines 464 to 478 and 499 to 523). Spec 0001 sets falsifier J6 (line 88). The operator must confirm the
      requirement.
    refs: [pr:foldkit-flow#4]
    links:
      serves: [goal-flow-first-journey]
      requires: [concept-flow-minimap]

  - id: req-flow-compound-nodes
    kind: requirement
    reqType: functional
    title: Compound nodes with relative positions
    statement: >-
      A child node has a position relative to its parent. Dragging the parent moves the child, and a clamped child stays
      inside the parent.
    status: proposed
    source:
      - foldkit-flow:packages/flow/src/geometry.ts:88
      - foldkit-flow:packages/flow/src/geometry.ts:451-474
      - foldkit-flow:README.md:20
      - log:19
    rationale: >-
      Built so Scenes can hold States (log line 19): the Compound graph of the example (README line 20) has parent
      nodes, a child's position is relative to its parent, and a clamped child stays inside it (geometry.ts line 88
      and lines 451 to 474). Spec 0001 sets falsifier J7 (line 89). The operator must confirm the requirement.
    refs: [pr:foldkit-flow#4]
    links:
      serves: [goal-flow-studio-story-graph]
      requires: [concept-flow-parent-node]

  - id: req-flow-delete-closure
    kind: requirement
    reqType: functional
    title: Delete a parent with its descendants and edges
    statement: >-
      Deleting a parent removes all its descendants and every edge attached to any of them, and reports the full sets.
    status: proposed
    source:
      - foldkit-flow:packages/flow/src/update.ts:289-343
      - foldkit-flow:README.md:75
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:135
    rationale: >-
      Built: update.ts lines 289 to 343 compute the descendant closure and the attached edges and report both sets, and
      README line 75 describes it. Spec 0001 line 135 records it as the round-1 review fix. The operator must confirm
      the behaviour.
    refs: [pr:foldkit-flow#4]
    links:
      serves: [goal-flow-studio-story-graph]

  - id: req-flow-keyboard-edit
    kind: requirement
    reqType: functional
    title: Edit the graph by keyboard
    statement: >-
      Nodes take focus. Enter or Space selects, arrow keys move (Shift makes a larger step), Delete removes, Escape
      clears, and a live region announces each result.
    status: decided
    source:
      - foldkit-flow:README.md:74-78
      - foldkit-flow:packages/flow/src/update.ts:413-435
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:87
      - log:118
    refs: [pr:foldkit-flow#4]
    links:
      serves: [goal-flow-keyboard-access]
      requires: [concept-flow-live-region]

  - id: req-flow-custom-nodes
    kind: requirement
    reqType: functional
    title: The app draws node content
    statement: >-
      The application draws node content, as it owns the graph and the layout. Nodes render through one callback that
      the application supplies. Handles are declared on the node. Edges come in three kinds with an optional arrow.
    status: decided
    source:
      - log:109
      - foldkit-flow:README.md:56-63
      - foldkit-flow:packages/flow/src/view.ts:45-54
      - foldkit-flow:packages/flow/src/types.ts:33-38
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:30-33
    refs: [pr:foldkit-flow#4]
    links:
      serves: [goal-flow-generic-library]

  - id: req-flow-attribution-toggle
    kind: requirement
    reqType: functional
    title: Show the xyflow credit by default, allow hiding
    statement: >-
      The "Built with xyflow" link shows by default. It hides only when the application sets Attribution to Hidden.
    status: decided
    source:
      - log:106
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:53
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:90
      - foldkit-flow:README.md:86
    links:
      serves: [goal-flow-respect-xyflow]

  - id: req-flow-browser-gate
    kind: requirement
    reqType: functional
    title: A browser journey gate
    statement: >-
      One command drives the built example in headless Chromium with real pointer and keyboard input and fails if a
      journey step fails.
    status: decided
    source:
      - foldkit-flow:package.json:18
      - foldkit-flow:README.md:17
      - foldkit-flow:AGENTS.md:48
      - pr:foldkit-flow#4
      - log:118
    refs: [pr:foldkit-flow#4]
    links:
      serves: [goal-flow-browser-proof]

  # ---- non-functional requirements ----
  - id: req-flow-perf-drag
    kind: requirement
    reqType: non-functional
    quality: performance
    title: Dragging stays fast at 500 nodes and 700 edges
    statement: >-
      Dragging one node of 500 nodes and 700 edges has a median p95 scripting time per pointer move under 8 ms. At least
      95 percent of frame intervals are within 33.5 ms.
    scenario: >-
      A person drags one node of the Large graph (500 nodes, 700 edges) for 150 pointer moves, three times, in headless
      Chromium on the production build. The median of the three p95 scripting times per move is under 8 ms, and 95
      percent of frame intervals are within 33.5 ms. Ten wheel steps change no node or edge.
    status: decided
    source:
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:91
      - foldkit-flow:README.md:82
      - pr:foldkit-flow#4
      - log:118
    refs: [pr:foldkit-flow#4]
    links:
      serves: [goal-flow-performance]

  - id: req-flow-a11y-keyboard
    kind: requirement
    reqType: non-functional
    quality: accessibility
    title: Keyboard-only use with announcements
    statement: >-
      Selecting, moving, deleting and clearing nodes works with the keyboard alone, and results are announced to
      assistive technology. Creating a connection by keyboard is a documented gap in 0.x, and 1.0 waits for it.
      Reconnecting an edge and using the minimap by keyboard are not specified.
    scenario: >-
      A keyboard-only user presses Tab to reach a node, Enter to select it, an arrow key to move it by 10, Shift and an
      arrow to move it by 40, Escape to clear, Enter again and Delete to remove it. The canvas has role application, each
      node has role group and a name, and a polite live region says what happened.
    status: decided
    source:
      - log:110
      - foldkit-flow:README.md:74-78
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:87
    refs: [pr:foldkit-flow#4]
    canvas: [value-propositions]
    links:
      serves: [goal-flow-keyboard-access]

  - id: req-flow-correct-lifetimes
    kind: requirement
    reqType: non-functional
    quality: correctness
    title: Controllers never leak after unmount
    statement: >-
      Every controller is destroyed when its Mount is released, and no listener it added remains.
    scenario: >-
      A test mounts the Flow, presses a handle before the drag threshold, then disposes the runtime. Every created
      controller is destroyed once, and no document or window listener from the library remains.
    status: proposed
    source:
      - foldkit-flow:packages/flow/src/controllers.test.ts:42-67
      - foldkit-flow:packages/flow/src/runtime.test.ts:357
      - foldkit-flow:packages/flow/src/mounts.ts:34-39
      - foldkit-flow:AGENTS.md:63
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:90
    rationale: >-
      Built: controllers.test.ts lines 42 to 67 pass factories that record each `destroy` and require that each created
      controller (the pane, the minimap and three nodes) is destroyed once after the app is disposed (README line 70).
      runtime.test.ts line 357 tests a handle pressed before the drag threshold. Spec 0001 sets falsifier J8 (line 90).
      The operator must confirm.
    refs: [pr:foldkit-flow#4]
    links:
      serves: [goal-flow-first-journey]

  - id: req-flow-maintain-gates
    kind: requirement
    reqType: non-functional
    quality: maintainability
    title: Gates catch drift, dead code and copies
    statement: >-
      Gates catch suppressions without a registry entry, unused code and copy-paste, and every gate runs locally and in
      CI.
    scenario: >-
      A contributor pastes a 40-token block twice and `bun run cpd` fails. A contributor adds a suppression directive
      with no registry entry and `bun run check:exceptions` fails.
    status: decided
    source:
      - foldkit-flow:AGENTS.md:44
      - foldkit-flow:AGENTS.md:49-50
      - log:118
    canvas: [key-activities]
    links:
      serves: [goal-flow-lifecycle]

  - id: req-flow-maintain-tiers
    kind: requirement
    reqType: non-functional
    quality: maintainability
    title: Tools, packages and apps stay separate
    statement: >-
      Apps, packages and tools are separate workspaces. The app depends on the library and tools depend on neither.
    scenario: >-
      A reader lists the workspaces and finds apps, packages and tools apart. The example app declares the library as a
      workspace dependency, and the library does not depend on the app.
    status: decided
    source:
      - foldkit-flow:AGENTS.md:21-31
      - foldkit-flow:package.json:5-9
      - foldkit-flow:apps/example/package.json:16
      - log:118
    links:
      serves: [goal-flow-generic-library]

  - id: req-flow-reproducible-toolchain
    kind: requirement
    reqType: non-functional
    quality: reproducibility
    title: The same Bun runs everywhere
    statement: >-
      `vp run` and devenv use the same Bun version.
    scenario: >-
      A contributor runs `vp exec -- bun --revision` and `bun --revision` in devenv. Both print the same version. The
      check does not show that every gate gives the same result in both.
    status: decided
    source:
      - issue:foldkit-flow#3
      - foldkit-flow:package.json:44-48
      - log:118
    refs: [issue:foldkit-flow#3]
    links:
      serves: [goal-org-reproducible-builds]

  - id: req-flow-licence-hygiene
    kind: requirement
    reqType: non-functional
    quality: licensing
    title: MIT library, xyflow credited, no copyleft dependency
    statement: >-
      The library is MIT licensed with xyflow's notice kept. No package under `packages/` depends on ELK.js or another
