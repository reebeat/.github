elements:
  - id: concept-flow-flow
    kind: concept
    title: Flow
    statement: >-
      A Flow is one node-based graph canvas inside a Foldkit application. It holds the nodes, edges, viewport and
      selection, and it lives in the application's Model.
    status: decided
    source:
      - log:48
      - foldkit-flow:README.md:3
      - foldkit-flow:README.md:24
      - foldkit-flow:packages/flow/src/model.ts:14-29
      - log:118
    attributes:
      - id
      - nodes
      - edges
      - viewport
      - attribution option
    relations:
      - { type: relates, to: concept-flow-out-message, label: emits }

  - id: concept-flow-node
    kind: concept
    title: Node
    statement: >-
      A node is one box on the canvas. It declares its position, size and handles, and the application draws its
      content.
    status: proposed
    source:
      - foldkit-flow:README.md:3
      - foldkit-flow:README.md:35-47
      - foldkit-flow:packages/flow/src/types.ts:42-59
    rationale: >-
      README lines 35 to 47 show the node fields in use, and types.ts lines 42 to 59 define them. A node declares its
      size and handles, so edges are placed without measuring the DOM. The operator must confirm the vocabulary.
    attributes:
      - id
      - label
      - type
      - position
      - width and height
      - handles
      - parent id
      - clamped to parent
    relations:
      - { type: part-of, to: concept-flow-flow, multiplicity: many to one }

  - id: concept-flow-edge
    kind: concept
    title: Edge
    statement: >-
      An edge is a line between a source handle and a target handle. It can be a bezier, smooth-step or straight line,
      with an optional arrow.
    status: proposed
    source:
      - foldkit-flow:README.md:47
      - foldkit-flow:README.md:66
      - foldkit-flow:packages/flow/src/types.ts:63-77
    rationale: >-
      README line 47 shows an edge, and line 66 says there are three edge types with an optional arrow. types.ts lines
      63 to 77 define the kinds (Bezier, SmoothStep, Straight) and the fields, including a label. The operator must
      confirm the vocabulary.
    attributes:
      - id
      - source node and handle
      - target node and handle
      - kind
      - arrow
      - label
    relations:
      - { type: part-of, to: concept-flow-flow, multiplicity: many to one }
      - { type: relates, to: concept-flow-handle, label: joins two, multiplicity: "2" }

  - id: concept-flow-handle
    kind: concept
    title: Handle
    statement: >-
      A handle is a connection point on a node. A person drags from one handle to another to make a connection.
    status: decided
    source:
      - foldkit-flow:README.md:3
      - foldkit-flow:README.md:43
      - foldkit-flow:packages/flow/src/types.ts:33-38
      - log:118
    attributes:
      - id
      - kind (source or target)
      - side
    relations:
      - { type: part-of, to: concept-flow-node, multiplicity: many to one }

  - id: concept-flow-connection
    kind: concept
    title: Connection
    statement: >-
      A connection is a pair of handles that a person joins with a gesture. The application's check accepts or refuses
      it, and the application turns an accepted one into an edge.
    status: decided
    source:
      - foldkit-flow:README.md:53-54
      - foldkit-flow:packages/flow/src/types.ts:81-89
      - log:118
    relations:
      - { type: relates, to: concept-flow-handle, label: from a source handle to a target handle }
      - { type: relates, to: concept-flow-edge, label: becomes, multiplicity: zero or one }

  - id: concept-flow-parent-node
    kind: concept
    title: Compound (parent) node
    statement: >-
      A parent node contains child nodes. A child positions relative to its parent and may be clamped inside it. A
      Scene holding States is one example.
    status: decided
    source:
      - log:19
      - foldkit-flow:README.md:45
      - foldkit-flow:README.md:66
      - foldkit-flow:packages/flow/src/types.ts:52-54
      - log:118
    attributes:
      - children
      - clamp to parent
    relations:
      - { type: isa, to: concept-flow-node }

  - id: concept-flow-viewport
    kind: concept
    title: Viewport
    statement: >-
      The viewport is the visible part of the canvas, given by an offset and a zoom. Pan and zoom change it and touch no
      node.
    status: decided
    source:
      - foldkit-flow:README.md:3
      - foldkit-flow:README.md:82
      - foldkit-flow:packages/flow/src/types.ts:10-14
      - log:118
    attributes:
      - x offset
      - y offset
      - zoom
    relations:
      - { type: part-of, to: concept-flow-flow, multiplicity: one to one }

  - id: concept-flow-selection
    kind: concept
    title: Selection
    statement: >-
      The selection is the set of nodes and edges the person has picked by click, box or key. Delete, move and clear
      act on it.
    status: decided
    source:
      - foldkit-flow:README.md:3
      - foldkit-flow:README.md:66
      - foldkit-flow:packages/flow/src/selection.ts:5-7
      - log:118
    relations:
      - { type: part-of, to: concept-flow-flow, multiplicity: one to one }

  - id: concept-flow-minimap
    kind: concept
    title: Minimap and controls
    statement: >-
      The minimap is a small overview of the graph that a person can drag to pan. The controls are buttons to zoom in,
      zoom out and fit the view.
    status: proposed
    source:
      - foldkit-flow:README.md:66
      - foldkit-flow:packages/flow/src/view.ts:464-478
      - foldkit-flow:packages/flow/src/view.ts:499-523
    rationale: >-
      README line 66 lists a minimap, zoom controls and fit view as built. view.ts draws the controls (lines 464 to
      478) and the minimap (lines 499 to 523), and the minimap Mount lets a person drag it to pan (mounts.ts lines 757
      to 779). The operator must confirm them as part of the first release.
    relations:
      - { type: part-of, to: concept-flow-flow }

  - id: concept-flow-attribution
    kind: concept
    title: Attribution
    statement: >-
      Attribution is the "Built with xyflow" link in the corner of the canvas. It is either Visible or Hidden. Visible is
      the default, and an application may set it to Hidden.
    status: decided
    source:
      - log:106
      - foldkit-flow:README.md:86
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:53
      - foldkit-flow:packages/flow/src/attribution.ts:15-22
    attributes:
      - Visible or Hidden
      - link to xyflow.com
    relations:
      - { type: part-of, to: concept-flow-flow }

  - id: concept-flow-mount
    kind: concept
    title: Mount
    statement: >-
      A Mount is a Foldkit construct that runs work when an element appears and cleans up when it goes. The library
      uses Mounts to own its controllers.
    status: decided
    source:
      - foldkit-flow:AGENTS.md:63
      - foldkit-flow:packages/flow/src/mounts.ts:34-39
      - log:118
    relations:
      - { type: relates, to: concept-flow-controller, label: owns the lifetime of, multiplicity: one to one }

  - id: concept-flow-controller
    kind: concept
    title: Controller
    statement: >-
      A controller is an xyflow object that handles one kind of interaction: pan and zoom, node drag, handle
      connection or the minimap.
    status: decided
    source:
      - foldkit-flow:README.md:86
      - foldkit-flow:AGENTS.md:63
      - foldkit-flow:packages/flow/src/xyflow.ts:7-20
      - log:118
    relations:
      - { type: relates, to: concept-flow-flow, label: acts on }

  - id: concept-flow-out-message
    kind: concept
    title: Out-message (outcome)
    statement: >-
      An out-message tells the application what a gesture produced: Connected, Reconnected, Deleted, Moved or a
      selection change. The library only reports it, and the application decides what to do with it and applies the
      graph change.
    status: decided
    source:
      - log:109
      - foldkit-flow:README.md:52
      - foldkit-flow:packages/flow/src/message.ts:67-83
    relations:
      - { type: relates, to: concept-flow-connection, label: reports }

  - id: concept-flow-live-region
    kind: concept
    title: Live region
    statement: >-
      The live region is a polite status area that announces selection, moves, connections and deletions to screen
      readers.
    status: proposed
    source:
      - foldkit-flow:README.md:76
      - foldkit-flow:packages/flow/src/view.ts:665-673
    rationale: >-
      README line 76 says a polite live region (`role="status"`) announces selection, moves, connections and
      deletions, and view.ts lines 665 to 673 render it. The operator must confirm the live region as part of the
      keyboard contract.
    relations:
      - { type: part-of, to: concept-flow-flow }
