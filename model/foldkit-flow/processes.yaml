elements:
  - id: process-flow-adopt-library
    kind: process
    category: primary
    title: A Foldkit app adopts the library
    statement: >-
      A Foldkit developer adds a Flow to the application's Model, declares nodes, edges and handles, supplies the node
      views and a connection check, and applies the outcomes the Flow reports.
    status: proposed
    source:
      - pr:foldkit-flow#4
      - foldkit-flow:README.md:3
    rationale: >-
      The steps come from the API sketch in PR #4, since the README at the pinned commit 5dd44a9 (PR #4 has since merged;
      see the tracker) has no usage section. The operator must confirm this as the adoption path.
    refs: [pr:foldkit-flow#4]
    canvas: [key-activities]
    links:
      serves: [goal-flow-vision]
      next: [process-flow-use-canvas]
      uses: [concept-flow-flow, concept-flow-node, comp-flow-library]

  - id: process-flow-use-canvas
    kind: process
    category: primary
    title: A person works on the graph canvas
    statement: >-
      A person pans and zooms, drags nodes, connects handles, reconnects edges, selects, and edits by keyboard on the
      canvas of an application that uses the library.
    status: proposed
    source:
      - pr:foldkit-flow#4
      - foldkit-flow:README.md:3
    rationale: >-
      PR #4 plan: the journey is the one in PR #4, including reconnection and keyboard editing. The README at the pinned commit names
      only the basic pointer gestures (pan and zoom, drag, connect, box select). The operator must confirm it.
    refs: [pr:foldkit-flow#4]
    links:
      serves: [goal-flow-first-journey]
      uses: [concept-flow-flow]

  - id: process-flow-pan-zoom
    kind: process
    category: primary
    title: Pan and zoom the canvas
    statement: >-
      A person scrolls the wheel or drags the empty canvas. The viewport changes and no node is re-rendered.
    status: proposed
    source:
      - pr:foldkit-flow#4
      - foldkit-flow:README.md:3
    rationale: >-
      Step 1 of the PR journey; falsifier J1. Absent at the pinned commit 5dd44a9 (PR #4 has since merged; see the tracker). The operator must confirm the behaviour.
    refs: [pr:foldkit-flow#4]
    links:
      part-of: [process-flow-use-canvas]
      serves: [goal-flow-first-journey]
      next: [process-flow-drag-node]
      uses: [concept-flow-viewport]

  - id: process-flow-drag-node
    kind: process
    category: primary
    title: Drag a node
    statement: >-
      A person drags a node. Its position changes in the Model and its edges follow. A clamped child stays inside its
      parent.
    status: proposed
    source:
      - pr:foldkit-flow#4
      - foldkit-flow:README.md:3
    rationale: >-
      Falsifiers J2 and J7 of spec 0001. Absent at the pinned commit 5dd44a9 (PR #4 has since merged; see the tracker). The operator must confirm the behaviour.
    refs: [pr:foldkit-flow#4]
    links:
      part-of: [process-flow-use-canvas]
      serves: [goal-flow-first-journey]
      next: [process-flow-connect-handles]
      uses: [concept-flow-node, concept-flow-parent-node]

  - id: process-flow-connect-handles
    kind: process
    category: primary
    title: Connect two handles
    statement: >-
      A person drags from a source handle to a target handle. The application's check accepts or refuses it, and the
      library reports an accepted one as Connected.
    status: proposed
    source:
      - pr:foldkit-flow#4
      - foldkit-flow:README.md:3
    rationale: >-
      Falsifier J3 of spec 0001. Absent at the pinned commit 5dd44a9 (PR #4 has since merged; see the tracker). The operator must confirm the behaviour.
    refs: [pr:foldkit-flow#4]
    links:
      part-of: [process-flow-use-canvas]
      serves: [goal-flow-first-journey]
      next: [process-flow-reconnect-edge, process-flow-apply-outcome]
      uses: [concept-flow-handle, concept-flow-connection]
      produces: [concept-flow-out-message]

  - id: process-flow-reconnect-edge
    kind: process
    category: primary
    title: Reconnect an edge end
    statement: >-
      A person selects an edge and drags one end to another handle. The library reports it as Reconnected, and the
      opposite end stays where it was.
    status: proposed
    source:
      - pr:foldkit-flow#4
    rationale: >-
      Falsifier J3 of spec 0001. The PR says the first build used the wrong end and was fixed. The operator must
      confirm the reconnection behaviour, including that the opposite end stays fixed.
    refs: [pr:foldkit-flow#4]
    links:
      part-of: [process-flow-use-canvas]
      serves: [goal-flow-first-journey]
      next: [process-flow-box-select, process-flow-apply-outcome]
      uses: [concept-flow-edge]
      produces: [concept-flow-out-message]

  - id: process-flow-box-select
    kind: process
    category: primary
    title: Select with a box
    statement: >-
      A person holds Shift and drags on the empty canvas. The nodes inside the box become the selection, and no others.
    status: proposed
    source:
      - pr:foldkit-flow#4
      - foldkit-flow:README.md:3
    rationale: >-
      Falsifier J4 of spec 0001. Absent at the pinned commit 5dd44a9 (PR #4 has since merged; see the tracker). The operator must confirm the behaviour.
    refs: [pr:foldkit-flow#4]
    links:
      part-of: [process-flow-use-canvas]
      serves: [goal-flow-first-journey]
      next: [process-flow-delete-selection]
      uses: [concept-flow-selection]

  - id: process-flow-keyboard-navigate
    kind: process
    category: primary
    title: Work the graph by keyboard
    statement: >-
      A person presses Tab to reach a node, Enter or Space to select it, arrow keys to move it and Escape to clear. A
      live region announces each result.
    status: proposed
    source:
      - pr:foldkit-flow#4
    rationale: >-
      Falsifier J5 of spec 0001. Keyboard connection creation is not part of it (see
      problem-flow-keyboard-connect-missing). The operator must confirm the keyboard contract (keys and announcements).
    refs: [pr:foldkit-flow#4]
    links:
      part-of: [process-flow-use-canvas]
      serves: [goal-flow-keyboard-access]
      next: [process-flow-delete-selection]
      uses: [concept-flow-selection, concept-flow-live-region]

  - id: process-flow-delete-selection
    kind: process
    category: primary
    title: Delete the selection
    statement: >-
      A person presses Delete or Backspace. The selected nodes go, with their descendants and every attached edge, and
      the library reports all of it.
    status: proposed
    source:
      - pr:foldkit-flow#4
    rationale: >-
      Falsifier J5 of spec 0001 and the round-1 fix for parent deletion. The operator must confirm that deletion removes
      descendants and all attached edges and reports them.
    refs: [pr:foldkit-flow#4]
    links:
      part-of: [process-flow-use-canvas]
      serves: [goal-flow-keyboard-access]
      next: [process-flow-apply-outcome]
      uses: [concept-flow-selection]
      produces: [concept-flow-out-message]

  - id: process-flow-apply-outcome
    kind: process
    category: primary
    title: The application applies an outcome
    statement: >-
      The application receives an outcome message and changes its graph: it adds an edge on Connected, moves one on
      Reconnected and records a Deleted set.
    status: proposed
    source:
      - pr:foldkit-flow#4
    rationale: >-
      PR #4 states that the application applies graph changes through helper functions. See
      rule-flow-outcomes-not-mutations. The operator must confirm that the application, not the library, owns these
      changes.
    refs: [pr:foldkit-flow#4]
    links:
      serves: [goal-flow-generic-library]
      uses: [concept-flow-out-message]

  - id: process-flow-run-journey-gate
    kind: process
    category: supporting
    title: Run the browser journey gate
    statement: >-
      A contributor builds the example, then runs the journey in headless Chromium with real pointer and keyboard input.
      The run also measures performance.
    status: proposed
    source:
      - pr:foldkit-flow#4
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:92
    rationale: >-
      The gate is in PR #4 and spec 0000 line 92 calls it a local gate; see problem-flow-journey-not-in-ci. The operator
      must confirm it as a standing gate.
    refs: [pr:foldkit-flow#4]
    links:
      part-of: [process-flow-ship-spec]
      serves: [goal-flow-browser-proof]
      uses: [resource-flow-chromium, comp-flow-journey-tool]

  - id: process-flow-ship-spec
    kind: process
    category: governance
    title: Ship a spec as a PR
    statement: >-
      A contributor writes a spec, branches, commits through the hooks, pushes, opens the PR, passes CI and a recorded
      review round, and merges.
    status: proposed
    source:
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:13-24
      - foldkit-flow:AGENTS.md:13-19
    rationale: >-
      Observed in the repository: spec 0000 and AGENTS.md describe these steps. The operator's assignment of spec 0000
      accepted the plan as a whole, not each step. The operator must confirm.
    canvas: [key-activities]
    links:
      part-of: [process-org-ship-change]
      serves: [goal-flow-lifecycle]
      next: [process-flow-publish-package, process-flow-offer-upstream]
      uses: [resource-flow-specs, resource-flow-repo, comp-flow-ci]

  - id: process-flow-publish-package
    kind: process
    category: supporting
    title: Publish the package
    statement: >-
      The project publishes the library to npm after it is implemented.
    status: proposed
    source:
      - foldkit-flow:AGENTS.md:3
      - foldkit-flow:README.md:5
    rationale: >-
      AGENTS.md says the package is published as `foldkit-flow`, but no publish step exists yet. The org has a publish
      process that this step should follow. The operator must confirm name and timing.
    canvas: [channels]
    links:
      serves: [goal-flow-publish]
      part-of: [process-org-publish-packages]
      uses: [resource-npm-org]

  - id: process-flow-offer-upstream
    kind: process
    category: governance
    title: Offer the library to Foldkit
    statement: >-
      Once its API has settled, the library is offered to Foldkit as `@foldkit/flow`.
    status: decided
    source:
      - record:foldkit-flow:STATE.md:13
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:111
    links:
      serves: [goal-flow-upstream-offer]
      next: [extproc-flow-foldkit-decision]

  - id: extproc-flow-foldkit-decision
    kind: external-process
    title: Foldkit decides on the offer
    statement: >-
      The Foldkit project decides whether to take the library, and under which name and licence header.
    status: proposed
    source:
      - foldkit-flow:STATE.md:13
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:111
    rationale: >-
      The sources describe the offer but nothing about how Foldkit decides. The step is implied. The operator must
      confirm.

  - id: extproc-flow-xyflow-release
    kind: external-process
    title: xyflow releases a new @xyflow/system
    statement: >-
      The xyflow project publishes new versions of `@xyflow/system`. Versions 0.0.x may break the library, so each bump
      needs the journey to run again.
    status: proposed
    source:
      - pr:foldkit-flow#4
      - foldkit-flow:NOTICE:4-7
    rationale: >-
      PR #4 pins the version exactly because 0.0.x may break, and says the journey pins the controller contract. The
      link to the journey gate is inferred. The operator must confirm.
    links:
      next: [process-flow-run-journey-gate]
