elements:
  - id: process-flow-adopt-library
    kind: process
    category: primary
    title: A Foldkit app adopts the library
    statement: >-
      A Foldkit developer adds a Flow to the application's Model, declares nodes, edges and handles, supplies the node
      views and a connection check, and applies the outcomes the Flow reports. The library reports outcomes, and the
      application applies the graph changes.
    status: decided
    source:
      - log:109
      - foldkit-flow:README.md:3
      - foldkit-flow:README.md:24-64
      - foldkit-flow:packages/flow/src/flow.ts:14-24
    refs: [pr:foldkit-flow#4]
    canvas: [key-activities]
    links:
      serves: [goal-flow-vision]
      next: [process-flow-use-canvas]
      uses: [concept-flow-flow, concept-flow-node, comp-flow-library]

  - id: process-flow-use-canvas
    kind: process
    category: primary
    title: A person works on the graph canvas
    statement: >-
      A person pans and zooms, drags nodes, connects handles, reconnects edges, selects, and edits by keyboard on the
      canvas of an application that uses the library.
    status: decided
    source:
      - foldkit-flow:README.md:20
      - foldkit-flow:README.md:66
      - foldkit-flow:README.md:74-77
      - log:118
    refs: [pr:foldkit-flow#4]
    links:
      serves: [goal-flow-first-journey]
      uses: [concept-flow-flow]

  - id: process-flow-pan-zoom
    kind: process
    category: primary
    title: Pan and zoom the canvas
    statement: >-
      A person scrolls the wheel or drags the empty canvas. The viewport changes and no node is re-rendered.
    status: proposed
    source:
      - foldkit-flow:packages/flow/src/mounts.ts:157-208
      - foldkit-flow:README.md:82
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:83
    rationale: >-
      The pane Mount creates the xyflow pan and zoom controller (mounts.ts lines 157 to 208). README line 82 says pan
      and zoom change only the viewport element's transform and render no node, and spec 0001 sets this as falsifier
      J1 (line 83). The operator must confirm the behaviour.
    refs: [pr:foldkit-flow#4]
    links:
      part-of: [process-flow-use-canvas]
      serves: [goal-flow-first-journey]
      next: [process-flow-drag-node]
      uses: [concept-flow-viewport]

  - id: process-flow-drag-node
    kind: process
    category: primary
    title: Drag a node
    statement: >-
      A person drags a node. Its position changes in the Model and its edges follow. A clamped child stays inside its
      parent.
    status: proposed
    source:
      - foldkit-flow:packages/flow/src/mounts.ts:384-470
      - foldkit-flow:packages/flow/src/update.ts:183-186
      - foldkit-flow:packages/flow/src/geometry.ts:88
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:84
    rationale: >-
      The node Mount creates the xyflow drag controller (mounts.ts lines 384 to 470), and `DraggedNodes` changes the
      position in the Model (update.ts lines 183 to 186). A clamped child stays inside its parent (geometry.ts line
      88). Spec 0001 sets falsifiers J2 and J7 (lines 84 and 89). The operator must confirm the behaviour.
    refs: [pr:foldkit-flow#4]
    links:
      part-of: [process-flow-use-canvas]
      serves: [goal-flow-first-journey]
      next: [process-flow-connect-handles]
      uses: [concept-flow-node, concept-flow-parent-node]

  - id: process-flow-connect-handles
    kind: process
    category: primary
    title: Connect two handles
    statement: >-
      A person drags from a source handle to a target handle. The application's check accepts or refuses it, and the
      library reports an accepted one as Connected.
    status: proposed
    source:
      - foldkit-flow:packages/flow/src/mounts.ts:601-625
      - foldkit-flow:packages/flow/src/update.ts:266-281
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:85
    rationale: >-
      The handle Mount starts the xyflow connection gesture with the application's `isValidConnection` (mounts.ts
      lines 601 to 625). `update` reports an accepted drop as `Connected` and an invalid one as nothing (update.ts
      lines 266 to 281). Spec 0001 sets falsifier J3 (line 85). The operator must confirm the behaviour.
    refs: [pr:foldkit-flow#4]
    links:
      part-of: [process-flow-use-canvas]
      serves: [goal-flow-first-journey]
      next: [process-flow-reconnect-edge, process-flow-apply-outcome]
      uses: [concept-flow-handle, concept-flow-connection]
      produces: [concept-flow-out-message]

  - id: process-flow-reconnect-edge
    kind: process
    category: primary
    title: Reconnect an edge end
    statement: >-
      A person selects an edge and drags one end to another handle. The library reports it as Reconnected, and the
      opposite end stays where it was.
    status: decided
    source:
      - foldkit-flow:packages/flow/src/view.ts:270-281
      - foldkit-flow:packages/flow/src/mounts.ts:723-755
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:130
      - log:118
    refs: [pr:foldkit-flow#4]
    links:
      part-of: [process-flow-use-canvas]
      serves: [goal-flow-first-journey]
      next: [process-flow-box-select, process-flow-apply-outcome]
      uses: [concept-flow-edge]
      produces: [concept-flow-out-message]

  - id: process-flow-box-select
    kind: process
    category: primary
    title: Select with a box
    statement: >-
      A person holds Shift and drags on the empty canvas. The nodes inside the box become the selection, and no others.
    status: proposed
    source:
      - foldkit-flow:packages/flow/src/mounts.ts:235-252
      - foldkit-flow:packages/flow/src/update.ts:125-152
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:86
    rationale: >-
      The pane Mount starts a box on a Shift and left-button press on the empty pane (mounts.ts lines 235 to 252).
      `update` selects the nodes inside the box while it moves and reports the final selection when it ends (update.ts
      lines 125 to 152). Spec 0001 sets falsifier J4 (line 86). The operator must confirm the behaviour.
    refs: [pr:foldkit-flow#4]
    links:
      part-of: [process-flow-use-canvas]
      serves: [goal-flow-first-journey]
      next: [process-flow-delete-selection]
      uses: [concept-flow-selection]

  - id: process-flow-keyboard-navigate
    kind: process
    category: primary
    title: Work the graph by keyboard
    statement: >-
      A person presses Tab to reach a node, Enter or Space to select it, arrow keys to move it and Escape to clear. A
      live region announces each result.
    status: decided
    source:
      - foldkit-flow:README.md:74-77
      - foldkit-flow:packages/flow/src/update.ts:413-435
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:87
      - log:118
    refs: [pr:foldkit-flow#4]
    links:
      part-of: [process-flow-use-canvas]
      serves: [goal-flow-keyboard-access]
      next: [process-flow-delete-selection]
      uses: [concept-flow-selection, concept-flow-live-region]

  - id: process-flow-delete-selection
    kind: process
    category: primary
    title: Delete the selection
    statement: >-
      A person presses Delete or Backspace. The selected nodes go, with their descendants and every attached edge, and
      the library reports all of it.
    status: decided
    source:
      - foldkit-flow:README.md:75
      - foldkit-flow:packages/flow/src/update.ts:289-343
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:135
      - log:118
    refs: [pr:foldkit-flow#4]
    links:
      part-of: [process-flow-use-canvas]
      serves: [goal-flow-keyboard-access]
      next: [process-flow-apply-outcome]
      uses: [concept-flow-selection]
      produces: [concept-flow-out-message]

  - id: process-flow-apply-outcome
    kind: process
    category: primary
    title: The application applies an outcome
    statement: >-
      The application receives an outcome message and applies the graph change itself: it adds an edge on Connected,
      moves one on Reconnected and records a Deleted set. The library reports the outcome, and the application may veto
      a change.
    status: decided
    source:
      - log:109
      - foldkit-flow:README.md:51-54
      - foldkit-flow:packages/flow/src/update.ts:563-604
    refs: [pr:foldkit-flow#4]
    links:
      serves: [goal-flow-generic-library]
      uses: [concept-flow-out-message]

  - id: process-flow-run-journey-gate
    kind: process
    category: supporting
    title: Run the browser journey gate
    statement: >-
      A contributor builds the example, then runs the journey in headless Chromium with real pointer and keyboard input.
      The run also measures performance.
    status: decided
    source:
      - foldkit-flow:package.json:18
      - foldkit-flow:README.md:17
      - foldkit-flow:AGENTS.md:48
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:92
      - log:118
    refs: [pr:foldkit-flow#4]
    links:
      part-of: [process-flow-ship-spec]
      serves: [goal-flow-browser-proof]
      uses: [resource-flow-chromium, comp-flow-journey-tool]

  - id: process-flow-ship-spec
    kind: process
    category: governance
    title: Ship a spec as a PR
    statement: >-
      A contributor writes a spec, branches, commits through the hooks, pushes, opens the PR, passes CI and a recorded
      review round, and merges.
    status: decided
    source:
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:13-24
      - foldkit-flow:AGENTS.md:13-19
      - log:118
    canvas: [key-activities]
    links:
      part-of: [process-org-ship-change]
      serves: [goal-flow-lifecycle]
      next: [process-flow-publish-package, process-flow-offer-upstream]
      uses: [resource-flow-specs, resource-flow-repo, comp-flow-ci]

  - id: process-flow-publish-package
    kind: process
    category: supporting
    title: Publish the package
    statement: >-
      The project publishes pre-releases of the library to npm as `@tsukuri/flow`, under the tsukuri org and through the
      org's publish process; on 2026-10-30 the operator decided not to wait for the Norwegian IP advisor (log line 118). If Foldkit adopts
      the library, the project publishes `@foldkit/flow` and deprecates `@tsukuri/flow`.
    status: decided
    source:
      - log:49
      - log:105
      - log:113
      - log:118
      - foldkit-flow:README.md:5
    canvas: [channels]
    links:
      serves: [goal-flow-publish]
      part-of: [process-org-publish-packages]
      uses: [resource-npm-org]

  - id: process-flow-offer-upstream
    kind: process
    category: governance
    title: Offer the library to Foldkit
    statement: >-
      Once its API has settled, the library is offered to Foldkit as `@foldkit/flow`.
    status: decided
    source:
      - record:foldkit-flow:STATE.md:13
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:111
      - log:118
    links:
      serves: [goal-flow-upstream-offer]
      next: [extproc-flow-foldkit-decision]

  - id: extproc-flow-foldkit-decision
    kind: external-process
    title: Foldkit decides on the offer
    statement: >-
      The Foldkit project decides whether to adopt the library, and under which licence header. If it adopts the
      library, `@foldkit/flow` is published and `@tsukuri/flow` is deprecated.
    status: decided
    source:
      - log:105
      - foldkit-flow:STATE.md:13
      - foldkit-flow:docs/specs/0000-development-lifecycle.md:111

  - id: extproc-flow-xyflow-release
    kind: external-process
    title: xyflow releases a new @xyflow/system
    statement: >-
      The xyflow project publishes new versions of `@xyflow/system`. Versions 0.0.x may break the library, so it stays
      on its exact pin until the project bumps it on purpose, and each bump needs the journey to run again.
    status: decided
    source:
      - log:107
      - foldkit-flow:packages/flow/package.json:18
      - foldkit-flow:docs/specs/0001-first-felt-journey.md:111
      - foldkit-flow:NOTICE:4-17
    links:
      next: [process-flow-run-journey-gate]
