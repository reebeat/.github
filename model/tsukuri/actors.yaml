elements:
  # --------------------------------------------------------------- actors
  - id: actor-tsukuri-story-author
    kind: actor
    actorType: role
    persona: true
    title: Story author
    statement: >-
      A creator who writes one Fountain screenplay and runs `plan`, `build` and `check`. They declare the story and leave
      the building to tsukuri.
    status: decided
    source: ["tsukuri:README.md:3", "tsukuri:README.md:14-20", "log:7", log:118]
    canvas: [customer-segments]
    links:
      part-of: [actor-creator]
      performs: [process-tsukuri-author-story, process-tsukuri-review-plan]
      serves: [goal-tsukuri-vision]

  - id: actor-tsukuri-presenter
    kind: actor
    actorType: role
    persona: true
    title: Presenter
    statement: >-
      A speaker who steps through the Deck with the arrow keys and reads the narration as speaker notes.
    status: decided
    source: ["tsukuri:README.md:22", "tsukuri:GLOSSARY.md:127-129", log:118]
    canvas: [customer-segments]
    links:
      part-of: [actor-presenter]
      uses: [concept-tsukuri-deck]
      serves: [goal-tsukuri-deck-and-video]

  - id: actor-tsukuri-agent-operator
    kind: actor
    actorType: role
    persona: true
    title: Agent operator
    statement: >-
      A person whose own agent writes and repairs stories with the compiler's text source and its line-numbered messages.
    status: decided
    source: ["log:43", "tsukuri:docs/specs/0002-explicit-anchors-and-syntax.md:11", log:118]
    canvas: [customer-segments]
    links:
      part-of: [actor-agent-operator]
      performs: [process-tsukuri-author-story]
      serves: [goal-tsukuri-explicit-source]

  - id: actor-tsukuri-plugin-author
    kind: actor
    actorType: role
    persona: true
    title: Plugin author
    statement: >-
      A developer who writes an adapter for one service and proves it with the service's contract suite.
    status: decided
    source:
      - log:43
      - tsukuri:docs/design/open-core-boundary.md:24
      - tsukuri:AGENTS.md:66
      - log:118
    canvas: [customer-segments]
    links:
      part-of: [actor-plugin-author]
      performs: [process-tsukuri-add-adapter]
      serves: [goal-tsukuri-plugin-sdk]

  - id: actor-tsukuri-cli
    kind: actor
    actorType: system
    title: The tsukuri command
    statement: >-
      The `tsukuri` command with `plan`, `lint`, `build`, `check` and `journey`. It is the one composition root that reads
      the selection and fills each service with an adapter.
    status: decided
    source:
      - tsukuri:packages/cli/src/cli.ts:70
      - tsukuri:packages/cli/src/cli.ts:324
      - tsukuri:AGENTS.md:63
      - log:118
    canvas: [channels]
    links:
      performs: [process-tsukuri-select-adapters, process-tsukuri-run-journey]
      responsible-for: [rule-tsukuri-only-cli-composes]
      uses: [comp-tsukuri-cli]

  - id: actor-tsukuri-build-program
    kind: actor
    actorType: system
    title: The build program
    statement: >-
      One Effect program over the seven services. It runs every stage from the story to a finished build directory and
      knows no model, browser or binary.
    status: decided
    source:
      - tsukuri:packages/pipeline/src/buildProgram.ts:1-3
      - log:118
    links:
      performs:
        - process-tsukuri-parse-story
        - process-tsukuri-build-plan
        - process-tsukuri-speech-stage
        - process-tsukuri-schedule
        - process-tsukuri-render-deck
        - process-tsukuri-write-manifest
      uses: [comp-tsukuri-pipeline]

  - id: actor-tsukuri-local-adapters
    kind: actor
    actorType: system
    title: The local adapters
    statement: >-
      The adapters for Kokoro, whisper.cpp, synthesised sounds, reveal.js, Chromium, ffmpeg and the file cache. Each runs
      on the user's machine and sends nothing out.
    status: decided
    source:
      - tsukuri:README.md:22
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:260
      - log:118
    links:
      performs: [process-tsukuri-capture-frames, process-tsukuri-encode-video]
      uses: [resource-tsukuri-chromium, resource-tsukuri-ffmpeg, resource-tsukuri-whisper-cpp]

  - id: actor-tsukuri-verifier
    kind: actor
    actorType: system
    title: The verifier
    statement: >-
      The `verify` tool reads a written build and the source, and prints one verdict per falsifier. It never reads the
      pipeline's memory.
    status: decided
    source:
      - tsukuri:packages/verify/src/index.ts:1-2
      - log:118
    links:
      performs: [process-tsukuri-verify-build]
      uses: [comp-tsukuri-verify]

  - id: actor-tsukuri-reviewers
    kind: actor
    actorType: role
    title: Independent reviewers and the fixer
    statement: >-
      A verification reviewer and a conformance reviewer judge the plan, the code and their agreement. A fixer addresses
      the findings. Reviewers are read-only on product code.
    status: decided
    source:
      - tsukuri:docs/specs/0000-development-lifecycle.md:75
      - tsukuri:docs/specs/0000-development-lifecycle.md:79
      - log:118
    links:
      part-of: [actor-contributor-agent]
      performs: [process-tsukuri-review-round]
      serves: [goal-tsukuri-correct-by-construction]

  - id: actor-tsukuri-maintainer
    kind: actor
    actorType: role
    title: Maintainer
    statement: >-
      The person who owns the repository. They answer operator-owned forks, merge a pull request that has a passing
      recorded round, and provision the npm and GitHub environment for a release.
    status: decided
    source:
      - tsukuri:docs/specs/0000-development-lifecycle.md:23
      - tsukuri:AGENTS.md:78-86
      - log:118
    links:
      part-of: [actor-operator]
      performs: [process-tsukuri-release-publish]
      responsible-for: [goal-tsukuri-npm-publication]

  # ------------------------------------------------------------ resources
  - id: resource-tsukuri-chromium
    kind: resource
    resourceType: external-tool
    title: Chromium
    statement: >-
      The browser that renders the Deck page for frame capture, driven by Playwright under a virtual clock. It runs as a
      separate process.
    status: decided
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:86
      - tsukuri:docs/design/third-party.md:56
      - tsukuri:AGENTS.md:92
      - log:118
    canvas: [key-partners, key-resources]
    links:
      serves: [goal-tsukuri-deck-and-video]

  - id: resource-tsukuri-ffmpeg
    kind: resource
    resourceType: external-tool
    title: ffmpeg and ffprobe
    statement: >-
      The tools that encode lossless audio, mix, mux the Video and measure written files. The configured build is
      GPL-3.0-or-later because it includes libx264.
    status: decided
    source:
      - tsukuri:docs/design/third-party.md:57
      - tsukuri:AGENTS.md:93
      - log:50
      - log:118
    canvas: [key-partners, key-resources]
    links:
      serves: [goal-tsukuri-deck-and-video]

  - id: resource-tsukuri-whisper-cpp
    kind: resource
    resourceType: external-tool
    title: whisper.cpp
    statement: >-
      The `whisper-cli` program that gives word timestamps for the aligned narration. It is MIT licensed and runs as a
      separate process.
    status: decided
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:78
      - tsukuri:docs/design/third-party.md:59
      - log:118
    canvas: [key-partners, key-resources]
    links:
      serves: [goal-tsukuri-event-timing]

  - id: resource-tsukuri-kokoro-model
    kind: resource
    resourceType: model-asset
    title: Kokoro speech model
    statement: >-
      The Kokoro-82M model, with its voices, run locally through `kokoro-js`. It is Apache-2.0, is downloaded on first use,
      and is never stored in the repository.
    status: decided
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:78
      - tsukuri:docs/design/third-party.md:71
      - log:118
    canvas: [key-partners, key-resources]
    links:
      serves: [goal-tsukuri-deck-and-video]

  - id: resource-tsukuri-whisper-model
    kind: resource
    resourceType: model-asset
    title: Whisper base English model
    statement: >-
      The `ggml-base.en` model file that whisper.cpp reads. It is MIT licensed. It is not in the repository or in devenv,
      so the user downloads it.
    status: decided
    source:
      - tsukuri:docs/design/third-party.md:72
      - tsukuri:AGENTS.md:94
      - log:118
    links:
      serves: [goal-tsukuri-event-timing]

  - id: resource-tsukuri-reveal-js
    kind: resource
    resourceType: software
    title: reveal.js
    statement: >-
      The presentation framework that renders the Deck. Its Auto-Animate matches Elements by id and is the animator and the
      identity diff in release 1. It is MIT licensed.
    status: decided
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:213
      - tsukuri:docs/design/third-party.md:44
      - log:118
    canvas: [key-partners, key-resources]
    links:
      serves: [goal-tsukuri-deck-and-video]

  - id: resource-tsukuri-fountain-format
    kind: resource
    resourceType: document
    title: The Fountain screenplay format
    statement: >-
      The plain-text screenplay syntax, version 1.1. tsukuri reads it through an existing parser and defines a small fixed
      vocabulary on top; that is the importer. tsukuri is also to write Fountain as an artifact, which is not built at the
      pinned commit.
    status: proposed
    rationale: >-
      Spec plan: the operator decided that the source is one Fountain file (spec 0001 line 213). The version, the parser and
      the fixed vocabulary come from the spec plan, so confirm them. The operator also said Fountain is both an importer
      and an artifact renderer (log:67-69); confirm that the renderer shares this vocabulary.
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:213
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:32
      - log:67-69
    links:
      serves: [goal-tsukuri-screenplay-first]

  - id: resource-tsukuri-licence-inventory
    kind: resource
    resourceType: data
    title: The licence inventory
    statement: >-
      One file lists every locked npm package with its licence, taken from the package's own manifest. A test ties it to
      the lockfile, so nothing else lists packages.
    status: decided
    source:
      - tsukuri:docs/design/third-party.md:33
      - tsukuri:docs/specs/0008-apache-2-licence.md:61
      - log:118
    canvas: [key-resources]
    links:
      serves: [goal-tsukuri-apache-licence]

  - id: resource-tsukuri-devenv
    kind: resource
    resourceType: external-tool
    title: devenv shell
    statement: >-
      The pinned toolchain that provides Bun, Node, gitleaks, Chromium, ffmpeg and whisper.cpp for builds, hooks and CI. It
      runs on Linux, and elsewhere the user sets the Chromium path.
    status: decided
    source:
      - tsukuri:devenv.nix:16-23
      - tsukuri:README.md:12
      - log:118
    canvas: [key-resources]
    links:
      serves: [goal-tsukuri-reproducible-builds]

  - id: resource-tsukuri-same-id-story
    kind: resource
    resourceType: document
    title: The story same-id
    statement: >-
      The one original, public story that builds end to end. It holds the screenplay and a committed speech cache, and it
      is the subject of every journey check.
    status: decided
    source:
      - tsukuri:README.md:8
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:14
      - log:118
    links:
      serves: [goal-tsukuri-verified-output]

  - id: resource-tsukuri-speech-cache
    kind: resource
    resourceType: data
    title: The speech cache
    statement: >-
      Content-addressed FLAC audio and word timings, keyed by the narration text and the adapter settings. It is the only
      generated asset kept in git, so a build needs no model.
    status: decided
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:78
      - tsukuri:README.md:22
      - log:118
    canvas: [key-resources]
    links:
      serves: [goal-tsukuri-reproducible-builds]
