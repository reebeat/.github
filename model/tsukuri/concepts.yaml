elements:
  - id: concept-tsukuri-story
    kind: concept
    title: Story
    statement: >-
      The largest unit with one concern and one audience. It contains Scenes. Its declaration is the story IR, and in
      release 1 a Story is imported from one Screenplay. A Video is a rendering of a Story, not the Story.
    attributes:
      - one concern and one audience
      - title, author and default speech speed
    status: proposed
    rationale: >-
      Observed in the repository: the glossary, which an agent wrote, defines Story and says its source is one Screenplay.
      The operator later said that JSON stays the persistent IR and that a Screenplay is both an importer input and an
      artifact (log:25, log:67-69). The glossary does not yet say so. The decision log defines Scene, State and Beat but
      does not define Story, so confirm it.
    source:
      - tsukuri:GLOSSARY.md:17-19
      - log:25
      - log:67-69
    relations:
      - type: relates
        to: concept-tsukuri-screenplay
        label: is imported from, or written as
        multiplicity: "1 to 0..*"

  - id: concept-tsukuri-screenplay
    kind: concept
    title: Screenplay
    statement: >-
      A Fountain file with tsukuri's fixed vocabulary. It is an input of the importer, which reads it into a Story, and an
      artifact that a renderer writes from a Story. In release 1 the importer is the only way to declare a Story. A
      Screenplay is not the persistent IR: JSON stays the IR.
    status: decided
    source:
      - record:tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:213
      - tsukuri:GLOSSARY.md:21-23
      - log:25
      - log:67-69
    relations:
      - type: relates
        to: concept-tsukuri-plan
        label: is read into
        multiplicity: "1 to 1"

  - id: concept-tsukuri-scene
    kind: concept
    title: Scene
    statement: >-
      A Scene is a compound State: it groups States in the story's statechart.
    status: decided
    source:
      - log:19
    relations:
      - type: part-of
        to: concept-tsukuri-story
        multiplicity: "1..* per Story"
      - type: isa
        to: concept-tsukuri-state
        label: is a compound

  - id: concept-tsukuri-state
    kind: concept
    title: State
    statement: >-
      A node of the story's statechart. Scenes and States are nodes, and Beats are the edges between them.
    status: decided
    source: [log:19]
    relations:
      - type: relates
        to: concept-tsukuri-beat
        label: is joined by
        multiplicity: "0..* to 0..*"

  - id: concept-tsukuri-beat
    kind: concept
    title: Beat
    statement: >-
      A Beat is a transition, an edge between States.
    status: decided
    source:
      - log:19
    relations:
      - type: relates
        to: concept-tsukuri-state
        label: joins

  - id: concept-tsukuri-keyframe
    kind: concept
    title: Keyframe
    statement: >-
      The visual state a Beat ends in: every visible Element with its properties.
    status: decided
    source: ["tsukuri:GLOSSARY.md:37-39", log:118]
    relations:
      - type: relates
        to: concept-tsukuri-element
        label: shows
        multiplicity: "1 to 0..*"
      - type: relates
        to: concept-tsukuri-beat
        label: is the end state of
        multiplicity: "1 to 1"

  - id: concept-tsukuri-line
    kind: concept
    title: Line
    statement: >-
      The narration that carries a Beat: the dialogue of the NARRATOR, aligned to words. Its narration text is the
      dialogue itself. Subtitles and speaker notes carry exactly that text.
    attributes:
      - narration text
      - aligned word times
      - delivery hints
    status: decided
    source:
      - log:27
      - tsukuri:GLOSSARY.md:41-43
      - log:118
    relations:
      - type: relates
        to: concept-tsukuri-hint
        label: may carry
        multiplicity: "1 to 0..*"
      - type: part-of
        to: concept-tsukuri-beat
        label: carries
        multiplicity: "0..1 per Beat"

  - id: concept-tsukuri-effect
    kind: concept
    title: Effect
    statement: >-
      An effect is declared in a Scene's effects block and is timed against an anchor.
    status: decided
    source:
      - record:tsukuri:docs/specs/0002-explicit-anchors-and-syntax.md:162
      - record:tsukuri:docs/specs/0002-explicit-anchors-and-syntax.md:163
      - tsukuri:GLOSSARY.md:45-47
      - log:118
    relations:
      - type: part-of
        to: concept-tsukuri-scene
        multiplicity: "0..* per Scene"
      - type: relates
        to: concept-tsukuri-anchor
        label: is timed against
        multiplicity: "1 to 1"
      - type: relates
        to: concept-tsukuri-element
        label: acts on
        multiplicity: "0..* to 0..1"

  - id: concept-tsukuri-anchor
    kind: concept
    title: Anchor
    statement: >-
      A named moment an effect is timed against: a word, `scene.start`, `scene.end`, the transition into the Scene (its
      start, its end or a percent of the way), or an Element's lifecycle.
    status: decided
    source:
      - record:tsukuri:docs/specs/0002-explicit-anchors-and-syntax.md:163
      - tsukuri:docs/specs/0002-explicit-anchors-and-syntax.md:15
      - tsukuri:GLOSSARY.md:49-51
      - log:118
    relations:
      - type: relates
        to: concept-tsukuri-lifecycle-event
        label: may name
        multiplicity: "1 to 0..1"

  - id: concept-tsukuri-transition-anchor
    kind: concept
    title: Transition anchor
    statement: >-
      The Scene's incoming slide transition as an anchor: its start, its end or a percent of the way. A sound that belongs
      to the slide change is anchored here, so it follows the motion and not the voice.
    status: decided
    source:
      - record:tsukuri:docs/specs/0002-explicit-anchors-and-syntax.md:163
      - tsukuri:GLOSSARY.md:57-59
      - log:118
    relations:
      - type: isa
        to: concept-tsukuri-anchor

  - id: concept-tsukuri-lifecycle-event
    kind: concept
    title: Lifecycle event
    statement: >-
      What happens to an Element in a Scene, from the identity diff: enter, exit, move or update. Enter, exit, move and
      update each have a start and an end, except an instant such as an exit, which has no window and no percent. Move and
      update follow the renderer's declared easing. The others are linear in time.
    status: decided
    source:
      - tsukuri:GLOSSARY.md:53-55
      - log:118
    relations:
      - type: relates
        to: concept-tsukuri-element
        label: happens to
        multiplicity: "0..* to 1"
      - type: relates
        to: concept-tsukuri-identity-diff
        label: comes from
        multiplicity: "0..* to 1"

  - id: concept-tsukuri-hint
    kind: concept
    title: Hint
    statement: >-
      An optional instruction that the content alone does not carry: a delivery parenthetical before a Line, or a
      transition between Scenes.
    status: decided
    source: ["tsukuri:GLOSSARY.md:61-63", log:118]
    relations:
      - type: part-of
        to: concept-tsukuri-beat
        multiplicity: "0..* per Beat"

  - id: concept-tsukuri-element
    kind: concept
    title: Element
    statement: >-
      A visible thing with an id. Elements declare styles and transitions, and the same id is the same entity across
      Scenes.
    status: decided
    source:
      - log:20
      - log:23
    relations:
      - type: part-of
        to: concept-tsukuri-scene
        multiplicity: "0..* per Scene"

  - id: concept-tsukuri-identity-diff
    kind: concept
    title: Identity diff
    statement: >-
      The comparison of two Keyframes by Element id that derives motion. Ids are story-global, so one id is one entity. An
      id only in the second enters, an id only in the first exits, and an id in both updates. Until spec 0005 the
      comparison runs between adjacent Scenes.
    status: decided
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:213
      - log:23
      - log:83
      - tsukuri:GLOSSARY.md:114-116
    relations:
      - type: relates
        to: concept-tsukuri-keyframe
        label: compares
        multiplicity: "1 to 2"
      - type: relates
        to: concept-tsukuri-plan
        label: is listed in
        multiplicity: "1 to 1"

  - id: concept-tsukuri-plan
    kind: concept
    title: Plan
    statement: >-
      The named compiler stage between the Story and the schedule. It lists every Element, effect and identity decision,
      keeps the author's intent, and is plain data for review and golden tests. `tsukuri plan` prints it.
    attributes:
      - source hash
      - Scenes, Elements, effects, identity
      - canonical JSON, byte-comparable
    status: decided
    source:
      - tsukuri:docs/design/keyframe-engine.md:1112
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:90
      - log:118
    relations:
      - type: relates
        to: concept-tsukuri-story
        label: is derived from
        multiplicity: "1 to 1"
      - type: relates
        to: concept-tsukuri-timeline
        label: is resolved into
        multiplicity: "1 to 0..1"
      - type: relates
        to: concept-org-ir
        label: is the release-1 form of

  - id: concept-tsukuri-timeline
    kind: concept
    title: Timeline
    statement: >-
      The Plan with every Line, effect, step and slide change placed at an integer frame. The schedule stage builds it from
      the aligned words and the renderer's lifecycle.
    attributes:
      - total frames
      - frame of each effect
    status: decided
    source:
      - tsukuri:docs/design/keyframe-engine.md:1112
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:68
      - log:118
    relations:
      - type: relates
        to: concept-tsukuri-effect
        label: holds the frame of
        multiplicity: "1 to 0..*"

  - id: concept-tsukuri-model
    kind: concept
    title: Model
    statement: >-
      The first of three layers: a statechart plus functional reactive and SMIL time. It may contain cycles, such as
      interactive loops and repeats.
    status: decided
    source: [log:62]
    relations:
      - type: relates
        to: concept-tsukuri-plan
        label: is unrolled into
        multiplicity: "1 to 1..* per artifact"

  - id: concept-tsukuri-build-graph
    kind: concept
    title: Build graph
    statement: >-
      The third layer: an incremental graph with dynamic dependencies, early cutoff and content-addressed persistent
      traces. "DAG" applies to this graph only.
    status: decided
    source: [log:62]
    relations:
      - type: relates
        to: concept-tsukuri-plan
        label: builds from
        multiplicity: "1 to 1..*"

  - id: concept-tsukuri-ir
    kind: concept
    title: Story IR and Timeline IR
    statement: >-
      tsukuri's own JSON format, defined by an Effect Schema, for the story and for the timeline. The story IR is public
      and versioned. The timeline IR is an unstable build artifact, tagged unstable until the website Plan and the engine
      protocol exist. Exact time is stored in flicks. The JSON Schema is generated from the Effect Schema.
    status: decided
    source:
      - log:25
      - log:85
      - tsukuri:docs/specs/0007-scxml-persistent-ir-spike.md:23
      - pr:tsukuri#17
    relations:
      - type: isa
        to: concept-org-ir

  - id: concept-tsukuri-rendering
    kind: concept
    title: Rendering
    statement: >-
      An output derived from a Story. It is an artifact, and artifact formats are different from IR formats.
    status: decided
    source:
      - log:25
    relations:
      - type: isa
        to: concept-org-artifact
      - type: relates
        to: concept-tsukuri-story
        label: is derived from
        multiplicity: "0..* to 1"

  - id: concept-tsukuri-deck
    kind: concept
    title: Deck
    statement: >-
      A rendering that is a reveal.js presentation.
    status: decided
    source:
      - record:tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:213
      - tsukuri:README.md:5
      - tsukuri:GLOSSARY.md:127-129
      - log:118
    relations:
      - type: isa
        to: concept-tsukuri-rendering

  - id: concept-tsukuri-video
    kind: concept
    title: Video
    statement: >-
      A rendering captured from the Deck's page on a controlled clock.
    status: decided
    source:
      - record:tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:213
      - tsukuri:README.md:6
      - tsukuri:GLOSSARY.md:124-125
      - log:118
    relations:
      - type: isa
        to: concept-tsukuri-rendering

  - id: concept-tsukuri-chapter
    kind: concept
    title: Chapter
    statement: >-
      A named run of consecutive Scenes, introduced by a Section heading. A Video's chapter marks and a Deck's slide groups
      come from it.
    status: decided
    source: ["tsukuri:GLOSSARY.md:173-174", "tsukuri:GLOSSARY.md:138", log:118]
    relations:
      - type: part-of
        to: concept-tsukuri-story
        multiplicity: "0..* per Story"

  - id: concept-tsukuri-library
    kind: concept
    title: Library
    statement: >-
      Pure code with no runtime and no service.
    status: decided
    source:
      - record:tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:235
      - tsukuri:GLOSSARY.md:150-151
      - log:118
    relations:
      - type: relates
        to: concept-tsukuri-tier
        label: is a
        multiplicity: "1 to 1"

  - id: concept-tsukuri-service
    kind: concept
    title: Service
    statement: >-
      An Effect interface plus a contract that every implementation passes.
    status: decided
    source:
      - record:tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:235
      - tsukuri:docs/design/keyframe-engine.md:1225
      - tsukuri:GLOSSARY.md:153-155
      - log:118
    relations:
      - type: relates
        to: concept-tsukuri-contract-suite
        label: is tested by
        multiplicity: "1 to 1"

  - id: concept-tsukuri-adapter
    kind: concept
    title: Adapter
    statement: >-
      A Layer that implements a service on an outside runtime. It is an integration.
    status: decided
    source:
      - record:tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:235
      - tsukuri:GLOSSARY.md:157-159
      - log:118
    relations:
      - type: relates
        to: concept-tsukuri-service
        label: fills
        multiplicity: "0..* to 1"

  - id: concept-tsukuri-selection
    kind: concept
    title: Selection
    statement: >-
      Which adapter fills each service. Selection is explicit configuration at the composition root, and it never falls
      back silently.
    status: decided
    source:
      - record:tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:235
      - tsukuri:GLOSSARY.md:161-162
      - tsukuri:packages/services/src/selection.ts:18-26
      - log:118
    relations:
      - type: relates
        to: concept-tsukuri-adapter
        label: chooses

  - id: concept-tsukuri-stand-in
    kind: concept
    title: Stand-in
    statement: >-
      An offline stand-in for an integration, used in tests.
    status: decided
    source:
      - record:tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:235
      - tsukuri:GLOSSARY.md:164-166
      - log:118
    relations:
      - type: isa
        to: concept-tsukuri-adapter

  - id: concept-tsukuri-egress
    kind: concept
    title: Egress
    statement: >-
      What an integration sends out of the machine, declared by the integration.
    status: decided
    source:
      - record:tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:235
      - tsukuri:GLOSSARY.md:168-169
      - log:118
    relations:
      - type: part-of
        to: concept-tsukuri-adapter

  - id: concept-tsukuri-contract-suite
    kind: concept
    title: Contract suite
    statement: >-
      The suite that every adapter of one service must pass.
    status: decided
    source:
      - record:tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:235
      - tsukuri:docs/design/keyframe-engine.md:1225
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:259
      - log:118
    relations:
      - type: relates
        to: concept-tsukuri-adapter
        label: is run against
        multiplicity: "1 to 1..*"

  - id: concept-tsukuri-tier
    kind: concept
    title: Tier
    statement: >-
      One of three categories, library, service or integration, with one dependency direction.
    status: decided
    source:
      - record:tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:235
      - log:118
