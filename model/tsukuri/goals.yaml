  - id: problem-tsukuri-anchor-probes-missing
    kind: problem
    title: Two anchor kinds have no probe
    statement: >-
      The `update` and `scene.end` anchors exist in code, but no check observes them in the written media. No lint reports
      an Element that is declared and never used.
    status: decided
    source: ["tsukuri:docs/specs/0002-explicit-anchors-and-syntax.md:200", log:118]
    gap:
      repo: tsukuri
      fix: Add probes for update and scene.end and an unusedElement lint rule.
    links:
      hinders: [goal-tsukuri-verified-output]

  - id: problem-tsukuri-speed-interim
    kind: problem
    title: One Line keeps an interim speed hint
    statement: >-
      The story `same-id` keeps `(speed 1.05)` on one Line as an interim fix. Removal waits for word timings from the
      synthesiser or for alignment judged by its path.
    status: decided
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:275
      - tsukuri:STATE.md:12
      - log:118
    gap:
      repo: tsukuri
      fix: Remove the speed hint once word timings come from the synthesiser or alignment is judged by its path.
    links:
      hinders: [goal-tsukuri-event-timing]

  - id: problem-tsukuri-licence-gate-declared-only
    kind: problem
    title: The licence gate trusts the declared licence field
    statement: >-
      The licence gate reads the `license` field of each package. It does not read licence files inside packages, the
      licences of what a package bundles, or the binaries and models.
    status: decided
    source: ["tsukuri:docs/design/third-party.md:93", log:118]
    gap:
      repo: tsukuri
      fix: Read licence files inside packages for those that bundle components.
    links:
      hinders: [goal-tsukuri-apache-licence]

  - id: problem-tsukuri-dco-and-trademark-open
    kind: problem
    title: DCO is enforced now; the trademark policy waits
    statement: >-
      DCO sign-off is enforced now: CI checks a Signed-off-by trailer on commits, including commits written by coding
      agents. The trademark policy is written after the name is cleared (line 82). The operator has since chosen Tsukuri and
      skipped the advisor's clearance (lines 118 and 119), so the log names no trigger for the policy now. Commits that
      are already unsigned stay unsigned.
    status: decided
    source:
      - log:82
      - log:118
      - log:119
      - tsukuri:docs/design/open-core-boundary.md:63
      - tsukuri:docs/design/open-core-boundary.md:68
    gap:
      repo: tsukuri
      fix: Add a CI check for the Signed-off-by trailer, and write the trademark policy (the operator names no trigger since lines 118 and 119).
    links:
      hinders: [goal-tsukuri-apache-licence]

  - id: problem-tsukuri-review-cleanup
    kind: problem
    title: Verify cleanup misses a Chromium from build or journey
    statement: >-
      The `verify-tsukuri` cleanup does not stop a Chromium that `tsukuri build` or `journey` starts through
      capture-chromium. Playwright launches it detached, in its own process group, and nothing records it in `pids.txt`.
      After an interrupted build it can stay running.
    status: proposed
    rationale: >-
      PR #16 merged at the pinned commit and disclosed this gap in the `cleanup.sh` header and in the skill. Issue #25 (open)
      tracks it. It is a finding of a review round and an issue, not an operator statement, so confirm it.
    source:
      - issue:tsukuri#25
      - tsukuri:.agents/skills/verify-reebeat/scripts/cleanup.sh:4-6
      - tsukuri:.agents/skills/verify-reebeat/scripts/run.sh:48
      - tsukuri:.agents/skills/verify-reebeat/SKILL.md:83
    refs: ["issue:tsukuri#25"]
    links:
      hinders: [process-tsukuri-verify-build]

  - id: problem-tsukuri-state-machine-conformance
    kind: problem
    title: "Explicit state machines (PR #17) are not merged"
    statement: >-
      Spec 0004 (explicit state machines and timing combinators, pull request #17) is not merged at the pinned commit. Its
      review findings change with each push and live on the pull request.
    status: proposed
    rationale: >-
      Pull request #17 was open at head 9394420 on 2026-10-29, and no spec 0004 file exists at the pinned commit. The model
      keeps the fact, not the review rounds, which belong to the tracker. Confirm it.
    source:
      - pr:tsukuri#17
      - absent:tsukuri:docs/specs/0004-explicit-state-machines-and-timing-combinators.md
    refs: ["pr:tsukuri#17"]
    links:
      hinders: [goal-tsukuri-statechart-model]

  # ---------------------------------------------------------- constraints
  - id: constraint-tsukuri-apache-2
    kind: constraint
    constraintType: legal
    title: The compiler and its formats are Apache-2.0
    statement: >-
      The compiler and its formats are Apache-2.0. Contributions come in under the same licence, with no contributor
      agreement. The copyright holder is the individual named in NOTICE.
    status: decided
    source:
      - log:44
      - tsukuri:NOTICE:2
      - record:tsukuri:docs/design/open-core-boundary.md:21
      - record:tsukuri:docs/design/open-core-boundary.md:62
      - record:tsukuri:docs/design/open-core-boundary.md:64
    links:
      constrains: [comp-tsukuri-product]

  - id: constraint-tsukuri-ffmpeg-process-only
    kind: constraint
    constraintType: legal
    title: External tools run as separate processes
    statement: >-
      tsukuri calls ffmpeg, ffprobe, whisper-cli and Chromium as external processes. It neither links nor bundles them, so
      their licences do not reach tsukuri's code.
    status: decided
    source:
      - tsukuri:docs/design/third-party.md:12
      - tsukuri:README.md:46
      - log:50
      - log:118
    links:
      constrains: [comp-tsukuri-encode-ffmpeg, comp-tsukuri-capture-chromium, comp-tsukuri-align-whisper]

  - id: constraint-tsukuri-public-repo
    kind: constraint
    constraintType: process
    title: The repository is public, no private material
    statement: >-
      The repository is public. It holds no secret, no personal data and no course-private material. A regression
      baseline derived from course material stays outside the repository.
    status: decided
    source:
      - tsukuri:AGENTS.md:3
      - tsukuri:docs/specs/0000-development-lifecycle.md:34
      - tsukuri:docs/design/4em-regression-baseline.md:11-12
      - log:118
    links:
      constrains: [comp-tsukuri-product]

  - id: constraint-reebeat-working-name
    kind: constraint
    constraintType: organisational
    title: The name reebeat was the working name
    statement: >-
      `reebeat` was the working name until 2026-10-30; the operator replaced it with Tsukuri (see
      constraint-org-final-name). The clearance check found no register hit for REEBEAT itself, but a registered EU mark
      REBEAT and an active Norwegian registration FREEBEAT. The operator paused the first npm publish for a Norwegian IP
      advisor's opinion, then named Tsukuri the preferred replacement (line 114) and decided on 2026-10-30 not to wait for
      the advisor (lines 118 and 119).
      The GitHub and npm organisations were reserved, and a trademark policy is not written yet.
    status: decided
    source:
      - log:75
      - log:113
      - log:114
      - log:118
      - log:119
      - tsukuri:README.md:42
      - tsukuri:docs/design/open-core-boundary.md:68
    links:
      constrains: [comp-tsukuri-product]

  - id: constraint-tsukuri-effect-pin
    kind: constraint
    constraintType: technical
    title: Effect is pinned at 4.1.0 as one family
    statement: >-
      `effect` and every `@effect/*` runtime package share one version, 4.1.0, pinned in the root catalog. `@effect/tsgo`
      is one version for the whole repository. An upgrade is its own spec.
    status: decided
    source:
      - tsukuri:package.json:70
      - tsukuri:AGENTS.md:56
      - log:55
      - log:118
    links:
      constrains: [comp-tsukuri-product]

  - id: constraint-tsukuri-xstate-pinned
    kind: constraint
    constraintType: technical
    title: XState is a pinned alpha behind a boundary
    statement: >-
      The build-time interpreter is XState v6 alpha, pinned exactly at alpha.71, using its pure system API. It sits in an
      integration package behind a tsukuri-owned service, and its types never appear in the public API.
    status: decided
    source:
      - log:26
      - record:tsukuri:docs/specs/0007-scxml-persistent-ir-spike.md:616-620
    links:
      constrains: [comp-tsukuri-statechart-xstate]

  - id: constraint-tsukuri-local-tools
    kind: constraint
    constraintType: technical
    title: A local build needs Linux, Chromium and ffmpeg
    statement: >-
      A local build runs on Linux inside devenv only, for now. Even with offline stand-ins for speech and alignment, a
      build still needs Chromium and ffmpeg. Others use their own Linux environment, and there is no macOS or Windows
      support.
    status: decided
    source:
      - log:89
      - tsukuri:README.md:12
      - tsukuri:README.md:23
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:190
    links:
      constrains: [process-tsukuri-capture-frames, process-tsukuri-encode-video]

  - id: constraint-tsukuri-canvas
    kind: constraint
    constraintType: technical
    title: Release 1 renders 1280x720 at 30 fps
    statement: >-
      The release-1 canvas is 1280 by 720 at 30 frames per second. Frame rate is meant to be explicit configuration with
      presets 24, 30 and 60. A larger canvas costs more capture time.
    status: decided
    source:
      - log:22
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:80-82
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:209
      - log:118
    links:
      constrains: [process-tsukuri-capture-frames]

  # -------------------------------------------------------- opportunities
  - id: opportunity-tsukuri-identity-diff-motion
    kind: opportunity
    title: The identity diff derives motion
    statement: >-
      Element ids are story-global, so when the same id appears in two Keyframes the compiler derives enter, exit and
      update. Authors do not write the motion by hand. Until spec 0005 the motion runs between adjacent Scenes.
    status: decided
    source:
      - log:23
      - log:83
      - tsukuri:GLOSSARY.md:65-67
    canvas: [value-propositions]
    links:
      supports: [goal-tsukuri-vision, goal-tsukuri-statechart-model]

  - id: opportunity-tsukuri-one-declaration-many-surfaces
    kind: opportunity
    title: One declaration, many surfaces
    statement: >-
      One interaction declaration generates an agent function signature, a web control, a visible-cursor action in a Video
      and a Deck step. No one writes each surface by hand. An artifact that cannot realise a declared interaction fails at
      plan time for that output. A flag may bypass the plan-time failure for a specific output, so the drift is silent but
      explicit (a declared opt-out, never a default).
    status: decided
    source:
      - issue:tsukuri#19@6503203735
      - log:38
      - log:87
    refs: ["issue:tsukuri#19"]
    links:
      supports: [goal-tsukuri-interactive-website, goal-tsukuri-multi-renderer]

  - id: opportunity-tsukuri-offline-standins
    kind: opportunity
    title: Offline stand-ins need no model
    statement: >-
      A silent narrator, an even aligner, tone sounds and an in-memory cache let anyone build and test the whole pipeline
      with no model, key or network.
    status: decided
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:235
      - tsukuri:README.md:23
      - tsukuri:GLOSSARY.md:115-117
      - log:118
    links:
      supports: [goal-tsukuri-plugin-sdk, goal-tsukuri-reproducible-builds]

  - id: opportunity-tsukuri-byo-agents
    kind: opportunity
    title: A text source agents can write and repair
    statement: >-
      A story is one text file, and `plan`, `lint` and `check` print line-numbered results. A user's own agent can write
      and repair stories with the same tools as a hosted agent.
    status: decided
    source:
      - log:43
      - tsukuri:docs/specs/0002-explicit-anchors-and-syntax.md:11
      - tsukuri:docs/specs/0002-explicit-anchors-and-syntax.md:119
      - log:118
    links:
      supports: [goal-tsukuri-plugin-sdk, goal-tsukuri-explicit-source]

  - id: opportunity-tsukuri-lint-open-fixes-paid
    kind: opportunity
    title: Lint in the compiler, fixes in the editor
    statement: >-
      The lint and its deterministic `--fix` are open and live in the compiler. Only hosted-AI guided fixes in the editor
      are paid, because they cost inference money.
    status: decided
    source: ["issue:tsukuri#8", "log:43", "log:91"]
    refs: ["issue:tsukuri#8"]
    links:
      supports: [goal-tsukuri-teaching-lint]

  - id: opportunity-tsukuri-react-engine
    kind: opportunity
    title: React as render engine, JSX as importer
    statement: >-
      React's core was rejected as the compiler core. The operator kept it as a possible render engine, and JSX as a
      possible authoring importer.
    status: decided
    source: [log:64]
    links:
      supports: [goal-tsukuri-multi-renderer]
