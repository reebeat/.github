elements:
  # ---------------------------------------------------------------- goals
  - id: goal-tsukuri-vision
    kind: goal
    title: Declare the story, tsukuri builds the artifacts
    statement: >-
      tsukuri takes care of building, so you can focus on creating. You declare the story's beats and what they mean.
      tsukuri derives motion, timing and every artifact, reproducibly, and rebuilds only what an edit changes.
    status: decided
    source: [log:7, log:9, log:10, log:61]
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-org-vision]

  - id: goal-tsukuri-screenplay-first
    kind: goal
    title: One screenplay, every rendering
    statement: >-
      Authors declare the narrative and its structure, and artifacts are generated from that declaration. In release 1 the
      declaration is imported from one Fountain file. A Fountain file is an input of the importer, not the persistent IR.
    status: decided
    source:
      - log:11
      - log:25
      - log:67-69
      - record:tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:213
      - tsukuri:README.md:3
      - tsukuri:GLOSSARY.md:15-17
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-tsukuri-vision]
      supports: [goal-org-declarative-creation]

  - id: goal-tsukuri-deck-and-video
    kind: goal
    title: A Deck and a Video from one source
    statement: >-
      In release 1 a reveal.js Deck and a Video, captured from the same page on a controlled clock, are generated from the
      one source.
    status: decided
    source:
      - record:tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:213
      - tsukuri:README.md:3-6
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:9-12
      - log:118
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-tsukuri-screenplay-first]

  - id: goal-tsukuri-explicit-source
    kind: goal
    title: An explicit source nobody can misread
    statement: >-
      Every reference in a screenplay is written down: Elements, Scenes, effects and anchors each have an id. Nothing
      means "the next one" or "the one above". Errors say the file and line, what was found and the nearest valid form.
    status: decided
    source:
      - tsukuri:docs/specs/0002-explicit-anchors-and-syntax.md:11
      - tsukuri:docs/specs/0002-explicit-anchors-and-syntax.md:16-18
      - log:118
    links:
      subgoal-of: [goal-tsukuri-screenplay-first]

  - id: goal-tsukuri-event-timing
    kind: goal
    title: Effects connect to produced events
    statement: >-
      Sound and visual effects connect to produced events. Narration produces and consumes events that the timeline adjusts
      to. Sound effects can too, but by default more mildly.
    status: decided
    source:
      - log:20
      - log:27
      - tsukuri:docs/specs/0002-explicit-anchors-and-syntax.md:15
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-org-declarative-creation]

  - id: goal-tsukuri-statechart-model
    kind: goal
    title: Declare the implicit state machine explicitly
    statement: >-
      Scenes and States are the nodes of a statechart and Beats are its transitions. Time comes from a small, ratified
      subset of SMIL and functional reactive time. The model may contain cycles, and each artifact unrolls it into its own
      Plan.
    status: decided
    source: [log:19, log:24, log:62]
    refs: ["pr:tsukuri#17"]
    links:
      subgoal-of: [goal-org-declarative-creation]

  - id: goal-tsukuri-accessible-artifacts
    kind: goal
    title: Accessible artifacts for different audiences
    statement: >-
      Material produces accessible artifacts for hearing-impaired viewers, visually impaired viewers and people who want
      reduced motion. Subtitles stay readable at a reasonable pace.
    status: decided
    source: [log:10, log:27, log:32]
    refs: ["issue:tsukuri#12"]
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-tsukuri-vision]
      supports: [goal-org-accessible-artifacts]

  - id: goal-tsukuri-localisation
    kind: goal
    title: One story, several narration languages
    statement: >-
      One story can have language variants, and each variant adjusts the timings.
    status: decided
    source: [log:32]
    refs: ["issue:tsukuri#10"]
    links:
      subgoal-of: [goal-tsukuri-accessible-artifacts]

  - id: goal-tsukuri-reproducible-builds
    kind: goal
    title: Reproducible builds
    statement: >-
      Builds are reproducible: the same declared story gives the same artifact.
    status: decided
    source:
      - log:10
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:151
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-tsukuri-vision]
      supports: [goal-org-reproducible-builds]

  - id: goal-tsukuri-incremental-builds
    kind: goal
    title: Fast, incremental and reactive builds
    statement: >-
      An edit rebuilds only what it changes. The build is an incremental graph with dynamic dependencies, early cutoff
      and content-addressed traces that persist between builds.
    status: decided
    source: [log:10, log:62]
    refs: ["issue:tsukuri#9"]
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-tsukuri-vision]
      supports: [goal-org-incremental-builds]

  - id: goal-tsukuri-interactive-website
    kind: goal
    title: An interactive website as an artifact type
    statement: >-
      Websites become an artifact type, with a focus on interactive learning material that uses the story's multimedia.
      Websites support clicking and other interactions.
    status: decided
    source: [log:36, log:37]
    refs: ["issue:tsukuri#19"]
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-tsukuri-vision]
      supports: [goal-org-interactive-multimedia]

  - id: goal-tsukuri-interactive-lessons
    kind: goal
    title: Interactive lessons, deferred for later
    statement: >-
      Interactive lessons would add learner input, branching, progress and feedback to the website artifact. The
      operator deferred them for later investigation. Nothing is planned.
    status: decided
    source: [log:36, log:118]
    refs: ["issue:tsukuri#20"]
    links:
      subgoal-of: [goal-tsukuri-interactive-website]

  - id: goal-tsukuri-teaching-lint
    kind: goal
    title: A teaching lint for explainer stories
    statement: >-
      The compiler checks explainer stories against multimedia-learning principles: temporal contiguity, signalling,
      redundancy and coherence. Each threshold comes from its primary source.
    status: decided
    source: ["issue:tsukuri#8", log:118]
    refs: ["issue:tsukuri#8"]
    links:
      supports: [goal-tsukuri-interactive-website, goal-org-interactive-multimedia]

  - id: goal-tsukuri-plugin-sdk
    kind: goal
    title: Plugins and a render-engine SDK
    statement: >-
      The compiler gives modular contracts, components and building blocks. Users can write plugins and extensions, and an
      SDK supports building render engines.
    status: decided
    source: [log:15, log:28, log:43]
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-org-modular-extensible]

  - id: goal-tsukuri-multi-renderer
    kind: goal
    title: Several render engines in one story
    statement: >-
      A Scene can name its own render engine, for example one for math scenes. Beats that join Scenes of different
      engines follow explicit transition rules.
    status: decided
    source: [log:28]
    links:
      subgoal-of: [goal-tsukuri-plugin-sdk]

  - id: goal-tsukuri-npm-publication
    kind: goal
    title: Publish @tsukuri packages to npm
    statement: >-
      tsukuri publishes `@tsukuri/*` pre-releases to npm, so products and plugin authors can depend on them. The npm
      organisation `tsukuri` exists.
    status: decided
    source: [log:49]
    refs: ["pr:tsukuri#18"]
    links:
      supports: [goal-org-open-compiler, goal-org-modular-extensible]

  - id: goal-tsukuri-apache-licence
    kind: goal
    title: License the compiler and its formats under Apache-2.0
    statement: >-
      The compiler and its formats, the IR, its JSON Schema and the codecs, are open source under Apache-2.0.
    status: decided
    source:
      - log:44
      - record:tsukuri:docs/design/open-core-boundary.md:21-22
    links:
      supports: [goal-org-open-compiler]

  - id: goal-tsukuri-correct-by-construction
    kind: goal
    title: A compiler whose structure prevents bad states
    statement: >-
      The compiler follows correctness by construction: one source of truth for every fact, and explicit dependency graphs
      between the core and its derivations.
    status: decided
    source:
      - log:54
    links:
      supports: [goal-org-correctness-by-construction]

  - id: goal-tsukuri-verified-output
    kind: goal
    title: Check the written files, not the pipeline's memory
    statement: >-
      A check reads the files a build wrote and the source, never the build's internal state. Each falsifier has a
      negative control that fails at the stated place.
    status: decided
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:28
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:142
      - log:118
    links:
      subgoal-of: [goal-tsukuri-correct-by-construction]
      supports: [goal-tsukuri-reproducible-builds]

  - id: goal-tsukuri-visible-egress
    kind: goal
    title: Every build says what leaves the machine
    statement: >-
      Every integration declares what it sends out, and the output manifest records provenance.
    status: decided
    source:
      - record:tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:235
      - tsukuri:docs/design/keyframe-engine.md:1241-1242
      - tsukuri:GLOSSARY.md:119-120
      - log:118
    links:
      subgoal-of: [goal-tsukuri-correct-by-construction]

  # ------------------------------------------------------------- problems
  - id: problem-tsukuri-ffmpeg-gpl
    kind: problem
    title: ffmpeg is GPL, so it is never bundled
    statement: >-
      Libx264 stays and the project never bundles ffmpeg: a person uses their own ffmpeg or the one in devenv, and a hosted
      service does not distribute it. This holds for now; in future the compiler may support multiple encoders behind an
      adapter. If a product ever bundles ffmpeg, it complies with the GPL for that binary.
    status: decided
    source:
      - log:50
      - log:78
      - issue:tsukuri#7
      - tsukuri:docs/design/third-party.md:18-20
    refs: ["issue:tsukuri#7"]
    links:
      hinders: [comp-tsukuri-encode-ffmpeg, goal-tsukuri-npm-publication]

  - id: problem-tsukuri-state-stale
    kind: problem
    title: STATE.md is out of date
    statement: >-
      STATE.md says specs 0001 and 0002 are in review. Both pull requests are merged. The file also lists "candidates for
      0003" that are not the spec 0003 the repository holds.
    status: decided
    source:
      - tsukuri:STATE.md:7
      - tsukuri:STATE.md:13
      - tsukuri:docs/specs/0003-effect-4-1-upgrade.md:1
      - pr:tsukuri#3
      - pr:tsukuri#4
      - log:118
    gap:
      repo: tsukuri
      fix: Rewrite STATE.md from the merged pull requests and the specs that exist, or generate it from this model.
    links:
      hinders: [goal-org-correctness-by-construction]

  - id: problem-tsukuri-spec-status-mismatch
    kind: problem
    title: Spec status lines disagree with the pull requests
    statement: >-
      Spec 0002 says "built; in review (PR #4)" and spec 0001 and spec 0003 say "plan", but all three pull requests are
      merged. A reader cannot tell the state of a spec from the spec.
    status: decided
    source:
      - tsukuri:docs/specs/0002-explicit-anchors-and-syntax.md:3
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:3
      - tsukuri:docs/specs/0003-effect-4-1-upgrade.md:3
      - tsukuri:docs/specs/0000-development-lifecycle.md:129
      - log:118
    gap:
      repo: tsukuri
      fix: Show merge state from GitHub in generated views and leave the frozen spec text alone.
    links:
      hinders: [goal-org-correctness-by-construction]

  - id: problem-tsukuri-exceptions-gate-blind
    kind: problem
    title: The exception gate ignores @effect-diagnostics comments
    statement: >-
      `check:exceptions` does not count `@effect-diagnostics` directives. One such comment can silence an Effect rule
      with no registry entry, which breaks the rule that every suppression is registered.
    status: decided
    source:
      - issue:tsukuri#14
      - tsukuri:AGENTS.md:46
      - tsukuri:tools/quality/effectExceptions.ts:44
      - log:118
    refs: ["issue:tsukuri#14"]
    gap:
      repo: tsukuri
      fix: Add both @effect-diagnostics forms to the directive pattern, add a negative control and register existing directives.
    links:
      hinders: [comp-tsukuri-quality-gates]

  - id: problem-tsukuri-bun-not-pinned
    kind: problem
    title: vp run uses its own Bun
    statement: >-
      The repository declares Bun as `^1.4.2` and asks to download when the installed Bun does not match. `vp run` then
      uses its own Bun, not the one devenv pins, so scripts may run on another version.
    status: decided
    source:
      - issue:tsukuri#15
      - tsukuri:package.json:55-61
      - tsukuri:devenv.nix:17
      - log:118
    refs: ["issue:tsukuri#15"]
    gap:
      repo: tsukuri
      fix: Pin devEngines.packageManager to the devenv Bun version exactly and check that both report the same revision.
    links:
      hinders: [goal-tsukuri-reproducible-builds]

  - id: problem-tsukuri-no-contributing
    kind: problem
    title: No CONTRIBUTING.md
    statement: >-
      The repository has no CONTRIBUTING.md. The README points contributors to AGENTS.md and spec 0000 instead.
    status: decided
    source:
      - absent:tsukuri:CONTRIBUTING.md
      - tsukuri:README.md:50
      - log:118
    gap:
      repo: tsukuri
      fix: Add a short CONTRIBUTING.md that links AGENTS.md and the spec, code and pull request road.
    links:
      hinders: [goal-org-open-compiler]

  - id: problem-tsukuri-no-security-policy
    kind: problem
    title: Security reporting comes from tsukuri-labs/.github
    statement: >-
      The security policy comes from the organisation-level defaults in tsukuri-labs/.github, which this repository inherits,
      and private vulnerability reporting is enabled for this repository. A SECURITY.md in this repository would override
      the default. This repository has none yet.
    status: decided
    source:
      - log:90
      - absent:tsukuri:SECURITY.md
    gap:
      repo: tsukuri
      fix: Enable private vulnerability reporting for this repository, and add SECURITY.md to the organisation defaults in tsukuri-labs/.github.
    links:
      hinders: [goal-org-open-compiler]

  - id: problem-tsukuri-no-code-of-conduct
    kind: problem
    title: Conduct defaults come from tsukuri-labs/.github
    statement: >-
      The code of conduct comes from the organisation-level defaults in tsukuri-labs/.github, which this repository inherits. A
      CODE_OF_CONDUCT.md in this repository would override them. This repository has none yet.
    status: decided
    source:
      - log:90
      - absent:tsukuri:CODE_OF_CONDUCT.md
    gap:
      repo: org
      fix: Add CODE_OF_CONDUCT.md to the organisation defaults in tsukuri-labs/.github.
    links:
      hinders: [goal-org-open-compiler]

  - id: problem-tsukuri-no-issue-templates
    kind: problem
    title: No issue templates
    statement: >-
      The .github directory holds only a workflow. There are no issue templates, so a report may arrive without the spec,
      journey or version that a maintainer needs.
    status: decided
    source: [absent:tsukuri:.github/ISSUE_TEMPLATE, log:118]
    gap:
      repo: tsukuri
      fix: Add issue templates for a bug and for a roadmap item under .github/ISSUE_TEMPLATE.
    links:
      hinders: [goal-org-open-compiler]

  - id: problem-tsukuri-no-pr-template
    kind: problem
    title: No pull request template
    statement: >-
      The repository has no pull request template. The report format of spec 0000 lives in a skill, so a contributor
      without the skill does not see it.
    status: decided
    source:
      - absent:tsukuri:.github/PULL_REQUEST_TEMPLATE.md
      - tsukuri:docs/specs/0000-development-lifecycle.md:60-71
      - log:118
    gap:
      repo: tsukuri
      fix: Add .github/PULL_REQUEST_TEMPLATE.md with the eight report sections.
    links:
      hinders: [goal-org-open-compiler]

  - id: problem-tsukuri-goals-not-in-readme
    kind: problem
    title: The README does not state the goals
    statement: >-
      The README opens with the mechanism, "explainer videos from a screenplay". It does not state the tagline or the
      qualities the operator wants to promote.
    status: decided
    source:
      - log:7
      - log:9
      - tsukuri:README.md:1-3
      - log:118
    gap:
      repo: tsukuri
      fix: Open the README with the tagline and the four qualities, and generate that text from this model.
    links:
      hinders: [goal-tsukuri-vision]

  - id: problem-tsukuri-roadmap-only-in-issues
    kind: problem
    title: The README does not link the generated roadmap
    statement: >-
      The tsukuri README has no link to the roadmap that tsukuri-labs/.github generates from the model and the tracker, and
      STATE.md is out of date. The tsukuri repository holds no roadmap file.
    status: open
    rationale: >-
      No roadmap file exists at the pinned commit, and the README does not mention a roadmap. The roadmap now exists as
      `docs/roadmap.md` of tsukuri-labs/.github, generated from this model, which keeps a single source. The open item is the
      link. The stale STATE.md is also recorded in problem-tsukuri-state-stale.
    source:
      - absent:tsukuri:ROADMAP.md
      - tsukuri:README.md:1-50
      - tsukuri:STATE.md:7
      - issue:tsukuri#19
      - issue:tsukuri#20
    gap:
      repo: tsukuri
      fix: Link the generated roadmap from the README and bring STATE.md up to date.
    links:
      hinders: [goal-org-written-intent]

  - id: problem-tsukuri-demand-unmeasured
    kind: problem
    title: Demand is measured with pilot users and a waitlist
    statement: >-
      Demand is measured with named pilot users and a waitlist, using one activation step: a story built end to end. The
      README and the specs read for this model report no usage or uptake yet.
    status: decided
    source:
      - "tsukuri:README.md:1-50"
      - log:92
    gap:
      repo: tsukuri
      fix: Recruit named pilot users, open a waitlist and record the activation step, a story built end to end.
    links:
      hinders: [goal-tsukuri-vision]

  - id: problem-tsukuri-packages-private
    kind: problem
    title: No pre-release yet; cli and adapters unpublished
    statement: >-
      No `@tsukuri/*` package is on npm yet: the registry answered 404 for `@tsukuri/core` on 2026-10-29. Seven packages are
      set up to publish (core, subtitles, lint, services, pipeline, sounds-synth, render-reveal). The `tsukuri` command
      (`cli`), `verify` and the five Node adapters stay `"private": true`, so they have no distribution path.
    status: open
    rationale: >-
      Observed at the pinned commit: seven of the 14 manifests under `packages/` carry no `"private": true`, and
      `.github/workflows/release.yml` exists (PR #18, merged). The other seven are private by design (spec 0009). A lookup of
      `@tsukuri/core` in the npm registry returned 404 on 2026-10-29, which a pinned file cannot show. Spec 0009 says the
      first release needs operator steps (claim the names, configure trusted publishers); whether they are done is not
      verified. The operator should confirm the gap and say how the `tsukuri` command and the adapters are distributed.
    source:
      - tsukuri:packages/core/package.json:11-14
      - tsukuri:packages/cli/package.json:4
      - tsukuri:packages/verify/package.json:4
      - tsukuri:packages/speech-kokoro/package.json:4
      - tsukuri:packages/align-whisper/package.json:4
      - tsukuri:packages/capture-chromium/package.json:4
      - tsukuri:packages/encode-ffmpeg/package.json:4
      - tsukuri:packages/cache-fs/package.json:4
      - tsukuri:.github/workflows/release.yml:1-5
      - tsukuri:docs/design/open-core-boundary.md:26
      - tsukuri:docs/specs/0009-npm-prereleases.md:23
      - tsukuri:docs/specs/0009-npm-prereleases.md:36-38
      - pr:tsukuri#18
    refs: ["pr:tsukuri#18"]
    gap:
      repo: tsukuri
      fix: Publish the first alpha release after the operator steps, and decide how the cli and the Node adapters are distributed.
    links:
      hinders: [goal-tsukuri-npm-publication]

  - id: problem-tsukuri-xstate-alpha-risk
    kind: problem
    title: XState v6 is an alpha with breaking releases
    statement: >-
      The planned build-time interpreter, XState v6, is an alpha. Its releases renamed public names without aliases, and
      its declarations failed under the stricter compiler flags of the packages.
    status: decided
    source:
      - tsukuri:docs/specs/0007-scxml-persistent-ir-spike.md:582-584
      - tsukuri:docs/specs/0007-scxml-persistent-ir-spike.md:586-588
      - log:26
      - log:118
    links:
      hinders: [comp-tsukuri-statechart-xstate]

  - id: problem-tsukuri-experimental-gate-open
    kind: problem
    title: No gate for experimental types in the API
    statement: >-
      The rule that experimental types stay out of the public API is decided, but no test enforces it. Whether to scan
      exported declarations is open.
    status: decided
    source:
      - tsukuri:docs/design/open-core-boundary.md:58
      - tsukuri:docs/design/third-party.md:48
      - log:118
    gap:
      repo: tsukuri
      fix: Add a test that scans exported declarations for imports from a list of experimental packages.
    links:
      hinders: [comp-tsukuri-quality-gates]

  - id: problem-tsukuri-extension-points-open
    kind: problem
    title: Extension points are staged under ADR-0000
    statement: >-
      The extension ADR-0000 is adopted in stages, decision by decision. Extension points that are still open are tagged
      unstable until a second real engine has run the protocol. Adapter seams are the plugin API today; new effect kinds,
      new importers and the agent tool protocol come through the ADR.
    status: decided
    source:
      - tsukuri:docs/design/open-core-boundary.md:24-25
      - issue:tsukuri#19
      - log:86
    refs: ["pr:tsukuri#23"]
    gap:
      repo: tsukuri
      fix: Write ADR-0000 in stages, including capability declarations and the agent tool protocol, and tag open points unstable.
    links:
      hinders: [goal-tsukuri-plugin-sdk, goal-tsukuri-multi-renderer]

  - id: problem-tsukuri-no-incremental-render
    kind: problem
    title: The build engine is incremental, built in steps
    statement: >-
      The build reuses work with the decided incremental build engine, built in steps: a build library with tasks, a trace
      store and early cutoff. Stages become tasks first and render segments later. Until then speech assets are cached by
      content, and an edit still rebuilds the whole timeline and the whole render.
    status: decided
    source:
      - issue:tsukuri#9
      - log:62
      - log:88
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:78
      - tsukuri:packages/pipeline/src/buildProgram.ts:5-7
    gap:
      repo: tsukuri
      fix: Build the incremental build engine in steps, with stages as tasks first and render segments later.
    refs: ["issue:tsukuri#9"]
    links:
      hinders: [goal-tsukuri-incremental-builds]

  - id: problem-tsukuri-identity-scene-bounded
    kind: problem
    title: Element ids are story-global; motion is adjacent first
    statement: >-
      Element ids are story-global: one id is one entity in the whole story, as a rule enforced by a lint. Until spec 0005,
      motion runs only between adjacent Scenes. Release 1 matches ids only between two consecutive Scenes joined by
      AUTO-ANIMATE.
    status: decided
    source:
      - log:23
      - log:83
      - tsukuri:GLOSSARY.md:19-21
      - pr:tsukuri#17
    gap:
      repo: tsukuri
      fix: Add the story-global id lint, change the glossary to story-wide identity now, and build non-adjacent motion in spec 0005.
    links:
      hinders: [goal-tsukuri-statechart-model]

  - id: problem-tsukuri-transition-lines-positional
    kind: problem
    title: Transition lines stay Fountain's, the IR is explicit
    statement: >-
      Fountain's own transition line stays, and the IR carries each Scene's incoming transition explicitly as a property.
      The positional reading, where a transition line applies to the Scene below, lives in one adapter only.
    status: decided
    source:
      - log:84
      - tsukuri:docs/specs/0002-explicit-anchors-and-syntax.md:203
