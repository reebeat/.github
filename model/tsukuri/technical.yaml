    statement: >-
      Each Line's audio and word times are cached under a key made from its narration text and the adapter settings. A cache
      hit loads no model. A miss fails and names the Line unless the build is refreshing, or the narrator is the silent
      stand-in, which fills a miss without the flag.
    status: proposed
    rationale: >-
      Spec plan and observed in the repository: spec 0001 sets out the speech cache and its key, and
      packages/cli/src/build.ts:26-31 at the pinned commit adds the silent stand-in exception. The operator has not decided
      those details or this feature's free mark, so confirm them.
    source:
