elements:
  # -------------------------------------------------------------- product
  - id: comp-tsukuri-product
    kind: component
    tier: product
    repo: tsukuri
    licence: Apache-2.0
    pricing: free
    title: tsukuri, the open compiler
    tagline: "Declarative multimedia: accessible, reproducible, rebuilt as you edit."
    statement: >-
      Semantically declared story beats, compiled into multimedia artifacts: statecharts for structure, functional reactive
      time, and an incremental build graph, written in Effect. The compiler and its formats are open source, and running
      them locally is free.
    status: decided
    source:
      - log:7
      - log:60
      - log:44
      - log:43
      - record:tsukuri:docs/design/open-core-boundary.md:21
      - record:tsukuri:docs/design/open-core-boundary.md:39-44
    canvas: [value-propositions]
    links:
      serves: [goal-tsukuri-vision]
      depends-on: [comp-org-effect]

  # ------------------------------------------------ libraries (pure code)
  - id: comp-tsukuri-core
    kind: component
    tier: library
    package: "@tsukuri/core"
    licence: Apache-2.0
    proposedPricing: free
    title: core, from screenplay to Plan and Timeline
    statement: >-
      Pure code that parses a Fountain screenplay into a Story, runs the identity diff, builds the Plan, schedules the
      Timeline from aligned words, and prints the review text. It has no browser, ffmpeg, reveal.js or Node built-in.
    status: proposed
    rationale: >-
      Observed in the repository: spec 0001's package layout and the package source show this role. The operator decided
      the three categories (spec 0001 line 234), not this package, its free mark or its layer. The layer is inferred from
      log:62, so confirm them.
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:239
      - tsukuri:packages/core/src/index.ts:1-2
      - tsukuri:packages/core/package.json:5
      - tsukuri:docs/design/open-core-boundary.md:39
    links:
      part-of: [comp-tsukuri-product, comp-org-layer-model, comp-org-layer-plan]
      depends-on: [comp-org-effect, resource-tsukuri-fountain-format]
      realizes: [req-tsukuri-plan, req-tsukuri-nfr-timing, req-tsukuri-nfr-usability]
      serves: [goal-tsukuri-screenplay-first, goal-tsukuri-statechart-model]

  - id: comp-tsukuri-subtitles
    kind: component
    tier: library
    package: "@tsukuri/subtitles"
    licence: Apache-2.0
    proposedPricing: free
    title: subtitles, WebVTT and SubRip writers
    statement: >-
      Pure code that writes the narration of a scheduled Plan as WebVTT and SubRip, and reads WebVTT back into cues.
    status: proposed
    rationale: >-
      Observed in the repository: spec 0001's package layout and the package source show this role. The operator decided
      the three categories (spec 0001 line 234), not this package, its free mark or its layer. The layer is inferred from
      log:62, so confirm them.
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:240
      - tsukuri:packages/subtitles/src/index.ts:1-2
    links:
      part-of: [comp-tsukuri-product, comp-org-layer-plan]
      depends-on: [comp-org-effect, comp-tsukuri-core]
      realizes: [req-tsukuri-nfr-accessibility]
      serves: [goal-tsukuri-accessible-artifacts]

  - id: comp-tsukuri-lint
    kind: component
    tier: library
    package: "@tsukuri/lint"
    licence: Apache-2.0
    proposedPricing: free
    title: lint, pure rules over a Plan
    statement: >-
      Pure rules that return diagnostics for a Plan: every absolute time needs a reason, contrast, and agreement of
      fragments with effects. The cross-reference checks live in the core, not here.
    status: proposed
    rationale: >-
      Observed in the repository: spec 0001's package layout and the package source show this role. The operator decided
      the three categories (spec 0001 line 234), not this package, its free mark or its layer. The layer is inferred from
      log:62, so confirm them.
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:241
      - tsukuri:packages/lint/src/index.ts:1-4
    links:
      part-of: [comp-tsukuri-product, comp-org-layer-plan]
      depends-on: [comp-org-effect, comp-tsukuri-core]
      realizes: [req-tsukuri-lint, req-tsukuri-nfr-usability]
      serves: [goal-tsukuri-explicit-source]

  # ----------------------------------------------------------- the service
  - id: comp-tsukuri-services
    kind: component
    tier: service
    package: "@tsukuri/services"
    licence: Apache-2.0
    proposedPricing: free
    title: services, the seven contracts
    statement: >-
      The seven Effect service tags with their request types, tagged errors, the one cache key and the one selection
      registry. It also ships the contract suites and the offline stand-ins. This is the plugin seam.
    status: proposed
    rationale: >-
      Observed in the repository: spec 0001's package layout and the package source show this role. The operator decided
      the three categories (spec 0001 line 234), not this package, its free mark or its layer. The layer is inferred from
      log:62, so confirm them.
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:242
      - tsukuri:packages/services/src/index.ts:1-3
      - tsukuri:packages/services/package.json:22
    canvas: [key-resources]
    links:
      part-of: [comp-tsukuri-product, comp-org-layer-build]
      depends-on: [comp-org-effect, comp-tsukuri-core]
      realizes:
        - req-tsukuri-selection
        - req-tsukuri-renderer-lifecycle
        - req-tsukuri-nfr-extensibility
        - req-tsukuri-nfr-security
      serves: [goal-tsukuri-plugin-sdk]

  # ------------------------------------------------------------ the program
  - id: comp-tsukuri-pipeline
    kind: component
    tier: program
    package: "@tsukuri/pipeline"
    licence: Apache-2.0
    proposedPricing: free
    title: pipeline, the build program
    statement: >-
      One Effect program over the seven services, from the story to a finished build directory, with the manifest schema. It
      names no model, browser, binary or directory.
    status: proposed
    rationale: >-
      Observed in the repository: spec 0001's package layout and the package source show this role. The operator decided
      the three categories (spec 0001 line 234), not this package, its free mark or its layer. The layer is inferred from
      log:62, so confirm them.
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:243
      - tsukuri:packages/pipeline/src/index.ts:1-2
    links:
      part-of: [comp-tsukuri-product, comp-org-layer-build]
      depends-on: [comp-org-effect, comp-tsukuri-core, comp-tsukuri-services, comp-tsukuri-subtitles]
      realizes: [req-tsukuri-deck, req-tsukuri-video, req-tsukuri-nfr-reliability]
      serves: [goal-tsukuri-deck-and-video]

  # ------------------------------------------------------------- adapters
  - id: comp-tsukuri-speech-kokoro
    kind: component
    tier: integration
    package: "@tsukuri/speech-kokoro"
    licence: Apache-2.0
    proposedPricing: free
    title: speech-kokoro, local speech synthesis
    statement: >-
      The SpeechSynthesizer adapter on `kokoro-js`. It runs locally, declares no egress, and has a silent stand-in.
    status: proposed
    rationale: >-
      Observed in the repository: spec 0001's package layout and the package source show this role. The operator decided
      the three categories (spec 0001 line 234), not this package, its free mark or its layer. The layer is inferred from
      log:62, so confirm them.
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:244
      - tsukuri:packages/speech-kokoro/src/index.ts:1
    links:
      part-of: [comp-tsukuri-product, comp-org-layer-build]
      depends-on: [comp-org-effect, comp-tsukuri-services, resource-tsukuri-kokoro-model]
      realizes: [req-tsukuri-speech-cache]
      serves: [goal-tsukuri-deck-and-video]

  - id: comp-tsukuri-align-whisper
    kind: component
    tier: integration
    package: "@tsukuri/align-whisper"
    licence: Apache-2.0
    proposedPricing: free
    title: align-whisper, word alignment
    statement: >-
      The WordAligner adapter on whisper.cpp. It gives word times for the narration, runs locally, and has an even-spread
      stand-in.
    status: proposed
    rationale: >-
      Observed in the repository: spec 0001's package layout and the package source show this role. The operator decided
      the three categories (spec 0001 line 234), not this package, its free mark or its layer. The layer is inferred from
      log:62, so confirm them.
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:245
      - tsukuri:packages/align-whisper/src/index.ts:1
    links:
      part-of: [comp-tsukuri-product, comp-org-layer-build]
      depends-on:
        - comp-org-effect
        - comp-tsukuri-core
        - comp-tsukuri-services
        - resource-tsukuri-whisper-cpp
        - resource-tsukuri-whisper-model
      realizes: [req-tsukuri-speech-cache]
      serves: [goal-tsukuri-event-timing]

  - id: comp-tsukuri-sounds-synth
    kind: component
    tier: integration
    package: "@tsukuri/sounds-synth"
    licence: Apache-2.0
    proposedPricing: free
    title: sounds-synth, built-in sound effects
    statement: >-
      The SoundLibrary adapter that synthesises `pop`, `whoosh` and `ding` in TypeScript. It uses no recorded sample, so
      nothing needs attribution.
    status: proposed
    rationale: >-
      Observed in the repository: spec 0001's package layout and the package source show this role. The operator decided
      the three categories (spec 0001 line 234), not this package, its free mark or its layer. The layer is inferred from
      log:62, so confirm them.
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:246
      - tsukuri:docs/design/third-party.md:78
    links:
      part-of: [comp-tsukuri-product, comp-org-layer-build]
      depends-on: [comp-org-effect, comp-tsukuri-core, comp-tsukuri-services]
      realizes: [req-tsukuri-video]
      serves: [goal-tsukuri-deck-and-video]

  - id: comp-tsukuri-render-reveal
    kind: component
    tier: integration
    package: "@tsukuri/render-reveal"
    licence: Apache-2.0
    proposedPricing: free
    title: render-reveal, the Deck renderer
    statement: >-
      The Renderer adapter that turns a scheduled Plan into a reveal.js page. It declares the renderer's lifecycle timing,
      reads and checks a written page, and never parses a screenplay.
    status: proposed
    rationale: >-
      Observed in the repository: spec 0001's package layout and the package source show this role. The operator decided
      the three categories (spec 0001 line 234), not this package, its free mark or its layer. The layer is inferred from
      log:62, so confirm them.
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:247
      - tsukuri:packages/render-reveal/src/index.ts:1-4
    canvas: [key-resources]
    links:
      part-of: [comp-tsukuri-product, comp-org-layer-plan]
      depends-on:
        - comp-org-effect
        - comp-tsukuri-core
        - comp-tsukuri-lint
        - comp-tsukuri-services
        - resource-tsukuri-reveal-js
      realizes: [req-tsukuri-deck, req-tsukuri-renderer-lifecycle, req-tsukuri-nfr-accessibility]
      serves: [goal-tsukuri-deck-and-video, goal-tsukuri-multi-renderer]

  - id: comp-tsukuri-capture-chromium
    kind: component
    tier: integration
    package: "@tsukuri/capture-chromium"
    licence: Apache-2.0
    proposedPricing: free
    title: capture-chromium, frame capture
    statement: >-
      The FrameCapturer adapter. It opens the Deck in Chromium under a virtual clock, steps it to the scheduled frames,
      seeks animations and takes one screenshot per frame.
    status: proposed
    rationale: >-
      Observed in the repository: spec 0001's package layout and the package source show this role. The operator decided
      the three categories (spec 0001 line 234), not this package, its free mark or its layer. The layer is inferred from
      log:62, so confirm them.
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:248
      - tsukuri:packages/capture-chromium/src/index.ts:1-2
    links:
      part-of: [comp-tsukuri-product, comp-org-layer-build]
      depends-on:
        - comp-org-effect
        - comp-tsukuri-core
        - comp-tsukuri-services
        - resource-tsukuri-chromium
      realizes: [req-tsukuri-video, req-tsukuri-nfr-reproducibility]
      serves: [goal-tsukuri-reproducible-builds]

  - id: comp-tsukuri-encode-ffmpeg
    kind: component
    tier: integration
    package: "@tsukuri/encode-ffmpeg"
    licence: Apache-2.0
    proposedPricing: free
    title: encode-ffmpeg, mix and mux
    statement: >-
      The Encoder adapter on ffmpeg: lossless audio, the mix, the mux and the media probes that verify uses. It runs ffmpeg
      as a separate process.
    status: proposed
    rationale: >-
      Observed in the repository: spec 0001's package layout and the package source show this role. The operator decided
      the three categories (spec 0001 line 234), not this package, its free mark or its layer. The layer is inferred from
      log:62, so confirm them.
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:249
      - tsukuri:packages/encode-ffmpeg/src/index.ts:1-2
    links:
      part-of: [comp-tsukuri-product, comp-org-layer-build]
      depends-on: [comp-org-effect, comp-tsukuri-services, resource-tsukuri-ffmpeg]
      realizes: [req-tsukuri-video, req-tsukuri-nfr-reproducibility]
      serves: [goal-tsukuri-deck-and-video]

  - id: comp-tsukuri-cache-fs
    kind: component
    tier: integration
    package: "@tsukuri/cache-fs"
    licence: Apache-2.0
    proposedPricing: free
    title: cache-fs, the content-addressed cache
    statement: >-
      The AssetCache adapter on a directory. It stores files by content key, writes the provenance record last, and checks
      each file's hash when it reads.
    status: proposed
    rationale: >-
      Observed in the repository: spec 0001's package layout and the package source show this role. The operator decided
      that the cache is content-addressed (spec 0001 line 234), not this adapter, its free mark or its layer. The layer is
      inferred from log:62, so confirm them.
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:250
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:261
    links:
      part-of: [comp-tsukuri-product, comp-org-layer-build]
      depends-on: [comp-org-effect, comp-tsukuri-services]
      realizes: [req-tsukuri-speech-cache, req-tsukuri-nfr-reproducibility]
      serves: [goal-tsukuri-incremental-builds, goal-tsukuri-reproducible-builds]

  # ---------------------------------------------------------------- tools
  - id: comp-tsukuri-verify
    kind: component
    tier: tool
    package: "@tsukuri/verify"
    licence: Apache-2.0
    proposedPricing: free
    title: verify, the output-side checks
    statement: >-
      The checks of the falsifiers on a build directory, the table that prints their verdicts and the exit code. It reads
      the written files and the source only. `compareBuilds` checks determinism.
    status: proposed
    rationale: >-
      Observed in the repository: spec 0001's package layout and the package source show this role. The operator decided
      the three categories (spec 0001 line 234), not this package, its free mark or its layer. The layer is inferred from
      log:62, so confirm them.
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:251
      - tsukuri:packages/verify/src/index.ts:1-2
    links:
      part-of: [comp-tsukuri-product, comp-org-layer-build]
      depends-on:
        - comp-org-effect
        - comp-tsukuri-core
        - comp-tsukuri-encode-ffmpeg
        - comp-tsukuri-lint
        - comp-tsukuri-pipeline
        - comp-tsukuri-render-reveal
        - comp-tsukuri-services
        - comp-tsukuri-sounds-synth
        - comp-tsukuri-subtitles
      realizes: [req-tsukuri-check, req-tsukuri-nfr-timing, req-tsukuri-nfr-reproducibility]
      serves: [goal-tsukuri-verified-output]

  - id: comp-tsukuri-cli
    kind: component
    tier: tool
    package: "@tsukuri/cli"
    licence: Apache-2.0
    proposedPricing: free
    title: cli, the tsukuri command
    statement: >-
      The `tsukuri` command with `plan`, `lint`, `build`, `check` and `journey`. It is the only place that chooses and
      composes adapters.
    status: proposed
    rationale: >-
      Observed in the repository: spec 0001's package layout and the package source show this role. The operator decided
      the three categories (spec 0001 line 234), not this package, its free mark or its layer. The layer is inferred from
      log:62, so confirm them.
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:252
      - tsukuri:packages/cli/src/cli.ts:70
      - tsukuri:packages/cli/package.json:17-28
    canvas: [channels]
    links:
      part-of: [comp-tsukuri-product, comp-org-layer-build]
      depends-on:
        - comp-org-effect
        - comp-tsukuri-align-whisper
        - comp-tsukuri-cache-fs
        - comp-tsukuri-capture-chromium
        - comp-tsukuri-core
        - comp-tsukuri-encode-ffmpeg
        - comp-tsukuri-lint
        - comp-tsukuri-pipeline
        - comp-tsukuri-render-reveal
        - comp-tsukuri-services
        - comp-tsukuri-sounds-synth
        - comp-tsukuri-speech-kokoro
        - comp-tsukuri-verify
      realizes: [req-tsukuri-plan, req-tsukuri-lint, req-tsukuri-check, req-tsukuri-selection, req-tsukuri-journey]
      serves: [goal-tsukuri-vision]

  - id: comp-tsukuri-quality-gates
    kind: component
    tier: tool
    proposedPricing: free
    title: quality gates, the repository checks
    statement: >-
      The scripts in `tools/quality`: the tier gate, the exception registry check, the Effect family check, the licence
      gate and the grammar generator. Together with the format and lint rules they make up `bun run ready`.
    status: proposed
    rationale: >-
      Observed in the repository: spec 0000 and AGENTS.md list these tools. The operator has not decided this collection or
      its free mark, so confirm them.
    source:
      - tsukuri:docs/specs/0000-development-lifecycle.md:9
      - tsukuri:AGENTS.md:26-42
    links:
      part-of: [comp-tsukuri-product]
      depends-on: [comp-org-effect]
      realizes: [req-tsukuri-nfr-tier-gate, req-tsukuri-nfr-licensing]
      serves: [goal-tsukuri-correct-by-construction, goal-tsukuri-apache-licence]

  # --------------------------------------------------- planned components
  - id: comp-tsukuri-statechart-xstate
    kind: component
    tier: integration
    proposedPricing: free
    title: statechart-xstate, the build-time interpreter
    statement: >-
      A planned integration package. It turns the resolved statechart into XState machine data and reads back a total order
      of generated events through a tsukuri-owned service. XState is its only dependency.
    status: proposed
    rationale: >-
      Spec 0007 names this package as the recommendation, and the operator decided that XState sits in an integration
      package behind a service (log:26, spec 0007 line 620). The package does not exist at the pinned commit, and its spec,
      0005, is not written. Its name and tier come from the spike.
    source:
      - log:26
      - tsukuri:docs/specs/0007-scxml-persistent-ir-spike.md:591
      - tsukuri:docs/specs/0007-scxml-persistent-ir-spike.md:620
    links:
      part-of: [comp-tsukuri-product, comp-org-layer-plan]
      depends-on: [comp-org-xstate, comp-org-effect, comp-tsukuri-services]
      realizes: [req-tsukuri-statechart-interpreter]
      serves: [goal-tsukuri-statechart-model]

  - id: comp-tsukuri-website-renderer
    kind: component
    tier: integration
    proposedPricing: free
    title: website renderer, a planned artifact renderer
    statement: >-
      A planned Renderer that emits a static website: a folder of HTML, CSS and JavaScript that any static host serves,
      with the viewer controlling the pace.
    status: proposed
    rationale: >-
      Issue #19 proposes it and says its spec follows the IR work and an extension architecture ADR. The operator decided
      that websites become an artifact type (log:36) but no renderer exists or is specified.
    source:
      - log:36
      - issue:tsukuri#19
    refs: ["issue:tsukuri#19"]
    links:
      part-of: [comp-tsukuri-product, comp-org-layer-plan]
      depends-on: [comp-org-effect, comp-tsukuri-services]
      realizes: [req-tsukuri-website-artifact, req-tsukuri-interaction-declaration]
      serves: [goal-tsukuri-interactive-website]

  # ------------------------------------------------------ artifacts, assets

  - id: comp-tsukuri-plan-json
    kind: component
    tier: artifact
    title: plan.json, the one input of the renderers
    statement: >-
      The Plan with the Timeline and the source hash, as canonical JSON. Two equal Plans are byte-equal. The renderers and
      the verifier read it, and nothing else reaches them.
    status: proposed
    rationale: >-
      Spec plan: spec 0001 sets out plan.json as the one renderer input. The operator has not decided the canonical JSON
      form, so confirm it.
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:74
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:90
    links:
      part-of: [comp-tsukuri-product]
      serves: [goal-tsukuri-screenplay-first]

  - id: comp-tsukuri-build-manifest
    kind: component
    tier: artifact
    title: build.json, the build manifest
    statement: >-
      The record of one build: the source hash, each adapter with its egress and settings, and the provenance of every
      cached asset. It is written last, and `check` refuses a directory without a valid one.
    status: proposed
    rationale: >-
      Spec plan: spec 0001 sets out the manifest fields and the write order. The operator decided that the output manifest
      records provenance (spec 0001 line 234), so confirm the rest.
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:263
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:224
    links:
      part-of: [comp-tsukuri-product]
      realizes: [isgoal-tsukuri-visible-provenance]
      serves: [goal-tsukuri-visible-egress]

  - id: comp-tsukuri-deck-output
    kind: component
    tier: artifact
    title: deck.html, the Deck artifact
    statement: >-
      The reveal.js presentation with its assets, the Inter font and each package's licence beside them. Narration is in the
      speaker notes.
    status: proposed
    rationale: >-
      Spec plan: the README and spec 0001 describe the Deck output, and the third-party audit lists its assets. The
      operator has not decided this bundle, so confirm it.
    source:
      - tsukuri:README.md:5
      - tsukuri:docs/design/third-party.md:44
    links:
      part-of: [comp-tsukuri-product]
      serves: [goal-tsukuri-deck-and-video]

  - id: comp-tsukuri-video-output
    kind: component
    tier: artifact
    title: the MP4 Video artifact
    statement: >-
      The narrated MP4 with WebVTT subtitles and chapter marks, built from the same Plan as the Deck.
    status: proposed
    rationale: >-
      Spec plan: the README and spec 0001 describe the MP4 with subtitles and chapters. The operator has not decided every
      detail, so confirm it.
    source:
      - tsukuri:README.md:6
    links:
      part-of: [comp-tsukuri-product]
      serves: [goal-tsukuri-deck-and-video, goal-tsukuri-accessible-artifacts]

  - id: comp-tsukuri-grammar-doc
    kind: component
    tier: artifact
    title: The generated effects grammar document
    statement: >-
      The document of the screenplay grammar, generated from the grammar schema. A test fails when it differs from its
      generator and parses every example in it.
    status: proposed
    rationale: >-
      Spec plan: spec 0002 sets out the generated grammar document and its test. The operator picked the effects syntax,
      not this arrangement, so confirm it.
    source:
      - tsukuri:docs/grammar/effects.md:3
    links:
      part-of: [comp-tsukuri-product]
      serves: [goal-tsukuri-explicit-source]

