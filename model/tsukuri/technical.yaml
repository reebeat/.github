  - id: req-tsukuri-statechart-interpreter
    kind: requirement
    reqType: functional
    title: Interpreters pass one contract suite
    statement: >-
      A tsukuri-owned StatechartInterpreter service wraps the build-time interpreter. A hand-written interpreter must pass
      the same contract suite, which compares byte-equal logs across interpreters.
    status: decided
    source:
      - record:tsukuri:docs/specs/0007-scxml-persistent-ir-spike.md:616-620
    links:
      serves: [goal-tsukuri-statechart-model]

  - id: req-tsukuri-state-machines
    kind: requirement
    reqType: functional
    proposedPricing: free
    title: Explicit state machines and timing combinators
    statement: >-
      The compiler declares presence, position, style, effect, slide and Beat lifecycles as machines. It stores exact time
      as flicks, generates the JSON Schema from the Effect Schema, and rejects cycles and nonsense.
    status: proposed
    rationale: >-
      Read from the body of PR #17 (spec 0004), which is open and unmerged. The PR records two review rounds, both with
      verdict "changes", so it has not passed review. Its body still says no review rounds yet, which is out of date. Parts
      of it, such as the nearest-frame rule, are marked as operator decisions there, so confirm them.
    source: ["pr:tsukuri#17", "log:24"]
    refs: ["pr:tsukuri#17"]
    links:
      serves: [goal-tsukuri-statechart-model]

  - id: req-tsukuri-accessible-variants
    kind: requirement
    reqType: functional
    proposedPricing: free
    title: Generate captions, audio description and reduced motion
    statement: >-
      The compiler generates SDH captions from narration and sound metadata, audio description from Element tags and state
      changes, a transcript, an accessible Deck, and a reduced-motion variant that uses cuts or crossfades. It checks
      rendered frames for flashes and for contrast.
    status: proposed
    rationale: >-
      Issue #12 proposes it. The operator decided the audiences (log:32), but every threshold in the issue is noted from
      memory and must be checked against its source in the spec.
    source: ["issue:tsukuri#12", "log:32"]
    refs: ["issue:tsukuri#12"]
    links:
      serves: [goal-tsukuri-accessible-artifacts]

  - id: req-tsukuri-readable-subtitles
    kind: requirement
    reqType: functional
    proposedPricing: free
    title: Subtitles stay readable
    statement: >-
      The compiler checks subtitle speed, duration, line length and line count against one cited guideline. Narration,
      subtitles and notes stay one string, so the repair for a pace that is too fast extends the State hold. Videos can
      slow down as a result.
    status: decided
    source: ["issue:tsukuri#12", "log:27", "log:94"]
    refs: ["issue:tsukuri#12"]
    links:
      serves: [goal-tsukuri-accessible-artifacts]

  - id: req-tsukuri-language-variants
    kind: requirement
    reqType: functional
    proposedPricing: free
    title: Build one story in several narration languages
    statement: >-
      A story builds with a narration in each language, and anchors tied to words and events retime on their own. Word
      anchors use phrase ids declared once in a per-language phrase table, so narration stays pure prose. Not yet settled:
      whether subtitles and Deck notes are per language, and whether the speech cache is keyed by language and voice.
    status: decided
    source: ["issue:tsukuri#10", "log:32", "log:93"]
    refs: ["issue:tsukuri#10"]
    links:
      serves: [goal-tsukuri-localisation]

  - id: req-tsukuri-render-segment-cache
    kind: requirement
    reqType: functional
    proposedPricing: free
    title: Cache render segments
    statement: >-
      The build caches render segments by state pair, transition program and time window, as tasks of the incremental build
      engine. This comes in a later step, after stages become tasks. After a narration change it retimes and reuses the
      later segments instead of rendering them again.
    status: decided
    source: ["issue:tsukuri#9", "log:62", "log:88"]
    refs: ["issue:tsukuri#9"]
    links:
      serves: [goal-tsukuri-incremental-builds]

  - id: req-tsukuri-website-artifact
    kind: requirement
    reqType: functional
    proposedPricing: free
    title: Emit a static interactive website
    statement: >-
      The compiler emits a folder of static HTML, CSS and JavaScript from the same IR as the Video and the Deck. The viewer
      steps by Beat or scrubs the timeline, and narration, captions and sounds follow. It is keyboard accessible and
      supports reduced motion and transcripts.
    status: proposed
    rationale: >-
      Issue #19 proposes it. The operator decided that websites become an artifact type (log:36), but the relation to the
      Deck and the reproducibility definition remain open in the issue.
    source: ["issue:tsukuri#19", "log:36", "log:65"]
    refs: ["issue:tsukuri#19"]
    links:
      serves: [goal-tsukuri-interactive-website]

  - id: req-tsukuri-interaction-declaration
    kind: requirement
    reqType: functional
    proposedPricing: free
    title: One interaction declaration for every surface
    statement: >-
      An interaction is a declared event-raising element with a payload schema and a label, declared once for every surface.
      Each artifact declares what it realises. Static artifacts realise it at build time, for example with a visible cursor
      in a Video. Dynamic artifacts realise it at view time. An artifact that cannot realise it fails at plan time for that
      output, unless the author wrote an explicit fallback or a flag bypasses the failure for that output, so the drift is
      silent but explicit (a declared opt-out, never a default).
    status: decided
    source: ["issue:tsukuri#19@6503203735", "log:38", "log:65", "log:87"]
    refs: ["issue:tsukuri#19"]
    links:
      serves: [goal-tsukuri-interactive-website, goal-tsukuri-multi-renderer]

  - id: req-tsukuri-renderer-capabilities
    kind: requirement
    reqType: functional
    proposedPricing: free
    title: Renderers declare what they can realise
    statement: >-
      A renderer declares whether its artifact is static or dynamic, which interaction kinds it can realise and which
      surfaces it exposes. Beats between Scenes of different renderers follow declared transition rules. The declarations
      come through the extension ADR-0000, adopted in stages, and stay tagged unstable until a second real engine has run
      the protocol.
    status: decided
    source: ["issue:tsukuri#19@6503256239", "log:28", "log:86"]
    refs: ["issue:tsukuri#19"]
    links:
      serves: [goal-tsukuri-multi-renderer, goal-tsukuri-plugin-sdk]

  - id: req-tsukuri-teaching-lint
    kind: requirement
    reqType: functional
    proposedPricing: free
    title: Lint temporal contiguity, signalling, redundancy and coherence
    statement: >-
      Lint rules read the semantic tags on Elements and check the four principles. Each threshold is set from its primary
      source before the rule is built.
    status: proposed
    rationale: "Issue #8 proposes it and says it follows specs 0004 to 0006. The operator has not decided it."
    source: ["issue:tsukuri#8"]
    refs: ["issue:tsukuri#8"]
    links:
      serves: [goal-tsukuri-teaching-lint]

  - id: req-tsukuri-npm-prerelease
    kind: requirement
    reqType: functional
    proposedPricing: free
    title: Publish only built, audited packages
    statement: >-
      A release stages only built JavaScript, types, docs and the licence, enforces peer ranges for unstable Effect APIs,
      requires clean checks, and publishes by trusted publishing with provenance.
    status: proposed
    rationale: >-
      Read from the body of PR #18, which was open at the pinned commit and has since merged (see the tracker). The operator
      decided to publish pre-releases (log:49), so confirm the release details.
    source: ["pr:tsukuri#18", "log:49"]
    refs: ["pr:tsukuri#18"]
    links:
      serves: [goal-tsukuri-npm-publication]

  - id: req-tsukuri-encoder-reproducible
    kind: requirement
    reqType: functional
    proposedPricing: free
    title: Any chosen encoder keeps decoded output identical
    statement: >-
      Whichever encoder is used, now ffmpeg with libx264 and in future others behind an adapter, two builds with the pinned
      toolchain give identical decoded frames and audio samples, and container bytes are recorded. The determinism check is
      measured again when the encoder changes.
    status: decided
    source: ["issue:tsukuri#7", "log:78", "log:81"]
    refs: ["issue:tsukuri#7"]
    links:
      serves: [goal-tsukuri-reproducible-builds]

  - id: req-tsukuri-exception-directives
    kind: requirement
    reqType: functional
    proposedPricing: free
    title: The exception gate counts @effect-diagnostics comments
    statement: >-
      The exception gate recognises both `@effect-diagnostics` and `@effect-diagnostics-next-line`, has a negative control,
      and every existing directive is registered.
    status: proposed
    rationale: "Issue #14 proposes it. It is a gap in a gate, not a decided feature."
    source: ["issue:tsukuri#14"]
    refs: ["issue:tsukuri#14"]
    links:
      serves: [goal-tsukuri-correct-by-construction]

  - id: req-tsukuri-pin-bun
    kind: requirement
    reqType: functional
    proposedPricing: free
    title: Pin the package manager to the devenv Bun
    statement: >-
      `devEngines.packageManager` names the exact Bun version of devenv, and a check shows that both report the same
      revision. Both are bumped together.
    status: proposed
    rationale: "Issue #15 proposes it as the working fix."
    source: ["issue:tsukuri#15"]
    refs: ["issue:tsukuri#15"]
    links:
      serves: [goal-tsukuri-reproducible-builds]

  # -------------------------------------------- non-functional requirements
  - id: req-tsukuri-nfr-reproducibility
    kind: requirement
    reqType: non-functional
    quality: reproducibility
    title: Two builds are identical
    statement: >-
      Text and data artifacts are byte-identical across builds. For video, the same source and cache, built twice on the
      same machine with the pinned toolchain, give identical decoded frames and identical decoded audio samples. Container
      bytes are compared and the result is recorded.
    scenario: >-
      A developer builds `stories/same-id` twice with the same speech cache. `tsukuri journey` compares every decoded frame
      hash and the decoded audio hash. The check passes when all agree. Adding random jitter to the clock makes it fail and
      name the first differing frame.
    status: decided
    source:
      - log:10
      - log:81
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:151
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:225
    links:
      serves: [goal-tsukuri-reproducible-builds]

  - id: req-tsukuri-nfr-accessibility
    kind: requirement
    reqType: non-functional
    quality: accessibility
    title: Artifacts serve different audiences
    statement: >-
      Subtitles and speaker notes carry the narration text exactly. Captions, audio description and reduced-motion variants
      for the other audiences follow in issue #12.
    scenario: >-
      A viewer who cannot hear opens the Video and reads the WebVTT subtitles. The check confirms one cue per Line with
      text equal to the narration. A viewer who prefers reduced motion gets a variant with cuts or crossfades, which is
      planned and not built.
    status: proposed
    rationale: >-
      Spec plan: spec 0001 sets out the subtitle and notes check. The operator decided the audiences (log:32), not this
      acceptance scenario, and the variants are tracked in issue #12, so confirm it.
    source:
      - log:32
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:146-148
    refs: ["issue:tsukuri#12"]
    links:
      serves: [goal-tsukuri-accessible-artifacts]

  - id: req-tsukuri-nfr-timing
    kind: requirement
    reqType: non-functional
    quality: correctness
    title: Effects appear within one frame of their anchor
    statement: >-
      Every effect shows in the written video, and sounds in the written audio, within one frame of the frame its anchor
      resolves to.
    scenario: >-
      A story has a sound anchored to the start of a transition. After a build, the check measures the first changed frame
      and the sound onset in the files. The check passes when both are within one frame. Shifting one effect by three frames
      makes it fail and name the effect.
    status: proposed
    rationale: >-
      Spec plan: spec 0001 and spec 0002 set out the one-frame tolerance. The operator has not decided the threshold, so
      confirm it.
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:146
      - tsukuri:docs/specs/0002-explicit-anchors-and-syntax.md:129
    links:
      serves: [goal-tsukuri-event-timing, goal-tsukuri-verified-output]

  - id: req-tsukuri-nfr-tier-gate
    kind: requirement
    reqType: non-functional
    quality: correctness
    title: The package direction is enforced by a gate
    statement: >-
      A package cannot depend on a tier it may not use, in its manifest or in an import, and no package directory can
      exist outside a tier.
    scenario: >-
      A contributor makes the core import the services package. `bun run check:tiers` fails and names the edge. Adding a
      directory under `packages/` that is in no tier also fails.
    status: proposed
    rationale: >-
      Observed in the repository: the tier gate and AGENTS.md describe this check. The operator decided the direction of
      dependency (spec 0001 line 234), not the gate, so confirm it.
    source:
      - tsukuri:AGENTS.md:35
      - tsukuri:tools/quality/tiers.ts:41-48
    links:
      serves: [goal-tsukuri-correct-by-construction]

  - id: req-tsukuri-nfr-extensibility
    kind: requirement
    reqType: non-functional
    quality: extensibility
    title: A new adapter needs no core change
    statement: >-
      A plugin author adds an adapter by implementing a service's Layer and passing its contract suite. The name is then
      selectable, and the core, the program and the screenplay do not change.
    scenario: >-
      A plugin author writes a hosted speech adapter. It must pass the speech contract suite. Selecting it by name builds
      the story, and the manifest lists the adapter and what it sends out. Without its credential the build fails and
      falls back to nothing.
    status: proposed
    rationale: >-
      Observed in the repository: AGENTS.md describes adding an adapter. The operator decided plugins are supported and
      every adapter passes a contract suite, but the adapter shape is marked proposed, so confirm this scenario.
    source:
      - tsukuri:docs/design/open-core-boundary.md:24
      - tsukuri:AGENTS.md:65
    links:
      serves: [goal-tsukuri-plugin-sdk]

  - id: req-tsukuri-nfr-licensing
    kind: requirement
    reqType: non-functional
    quality: licensing
    title: Licences are checked before a dependency lands
    statement: >-
      Every manifest declares Apache-2.0, and every locked package has a recorded licence on the allowlist. GPL, AGPL, SSPL
      and unknown licences are rejected.
    scenario: >-
      A contributor adds a package to `bun.lock` without recording its licence. `bun run test` fails and names the package.
      Adding a GPL package fails too.
    status: proposed
    rationale: >-
      Spec plan: spec 0008 sets out the licence gate and its allowlist. The operator decided Apache-2.0 (log:44), not the
      gate, so confirm it.
    source:
      - tsukuri:docs/specs/0008-apache-2-licence.md:42
      - tsukuri:AGENTS.md:31
    links:
      serves: [goal-tsukuri-apache-licence]

  - id: req-tsukuri-nfr-usability
    kind: requirement
    reqType: non-functional
    quality: usability
    title: Errors say how to fix the source
    statement: >-
      Each error names the file and line, what was found, what was expected and the nearest valid form. Old forms are
      rejected with the replacement in the message.
    scenario: >-
      An author writes the old `[[next]]` cue. The parser stops, names the line and shows the form to use instead. A
      person who rewrote a story from the messages alone built and checked it.
    status: proposed
    rationale: >-
      Spec plan: spec 0002 sets out the error format. The operator has not decided it, so confirm it.
    source:
      - tsukuri:docs/specs/0002-explicit-anchors-and-syntax.md:18
      - tsukuri:docs/specs/0002-explicit-anchors-and-syntax.md:191
    links:
      serves: [goal-tsukuri-explicit-source]

  - id: req-tsukuri-nfr-reliability
    kind: requirement
    reqType: non-functional
    quality: reliability
    title: A failed build leaves no accepted output
    statement: >-
      A speech cache miss with models absent, an alignment below the threshold, and a capture timeout each stop the build
      with a typed error. No directory remains that `check` would accept.
    scenario: >-
      A developer deletes one speech cache entry and builds without refreshing. The build stops with a cache-miss error
      that names the Line. The output directory holds no partial build.
    status: proposed
    rationale: >-
      Spec plan: spec 0001 falsifier F12 sets out the three failure cases. The operator has not decided them, so confirm
      it.
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:157
      - tsukuri:packages/pipeline/src/buildProgram.ts:9-11
    links:
      serves: [goal-tsukuri-correct-by-construction]

  - id: req-tsukuri-nfr-security
    kind: requirement
    reqType: non-functional
    quality: security
    title: Credentials never reach outputs
    statement: >-
      Credentials are read from the environment inside the adapter. They never appear in a cache key, the Plan, the
      manifest or an output.
    scenario: >-
      A test adapter needs a credential from the environment. Without it the build fails and names the requirement and
      writes nothing. With it, a canary value never appears in any written file.
    status: proposed
    rationale: >-
      Spec plan: design R3 rule 3 and spec 0001 set out the credential handling. The operator has not decided it, so
      confirm it.
    source:
      - tsukuri:docs/design/keyframe-engine.md:1242
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:263
    links:
      serves: [goal-tsukuri-visible-egress]

  - id: req-tsukuri-nfr-incremental
    kind: requirement
    reqType: non-functional
    quality: performance
    title: An edit rebuilds only what it changes
    statement: >-
      After an edit, the build redoes only the work that depends on it, and the result equals a cold build. The build
      engine is built in steps: a build library with tasks, a trace store and early cutoff, with stages as tasks first and
      render segments later.
    scenario: >-
      An author changes one narration line in a story. Only that Line's speech and the render segments that depend on its
      length are rebuilt. The output equals a cold build of the new story. This is planned and not built.
    status: decided
    source: ["log:10", "log:62", "log:88", "issue:tsukuri#9"]
    refs: ["issue:tsukuri#9"]
    links:
      serves: [goal-tsukuri-incremental-builds]

  - id: req-tsukuri-nfr-portability
    kind: requirement
    reqType: non-functional
    quality: portability
    title: Release 1 runs on Linux inside devenv
    statement: >-
      A build runs on Linux with the pinned devenv tools, for now. Others use their own Linux environment with their own
      Chromium. Windows and macOS are not supported, and nothing is maintained for them.
    scenario: >-
      A contributor clones the repository on Linux and runs the journey inside `devenv shell`. It builds and checks the
      story. On another Linux system the contributor sets the Chromium path and installs the other tools by hand.
    status: decided
    source:
      - log:89
      - tsukuri:README.md:12
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:190
      - tsukuri:devenv.nix:3
    links:
      serves: [goal-tsukuri-reproducible-builds]
