  # --------------------------------------------------- information system goals
  - id: isgoal-tsukuri-one-source
    kind: is-goal
    title: One declared story yields every rendering
    statement: >-
      The system generates the Plan, the Deck and the Video from one declared story. In release 1 the declaration is
      imported from one Fountain file. The speech cache is the only generated file kept.
    status: proposed
    rationale: >-
      Spec plan: the operator decided that the source is one Fountain file (spec 0001 line 213). That Fountain is an importer
      and an artifact renderer, and that the persistent IR stays JSON, is the operator's later refinement (log:25,
      log:67-69). That the speech cache is the only generated file kept is spec 0001's plan (falsifier F5). Confirm the
      wording.
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:213
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:150
      - log:25
      - log:67-69
    links:
      serves: [goal-tsukuri-screenplay-first]

  - id: isgoal-tsukuri-replaceable-pieces
    kind: is-goal
    title: Every piece can be replaced one by one
    statement: >-
      Each outside runtime is reached through a service with a contract, so an adapter can be swapped without changing
      the core, the program or the screenplay.
    status: proposed
    rationale: >-
      Spec plan: design R3 says pieces can be replaced one by one. The operator accepted R3 as a whole, so confirm this
      goal.
    source:
      - tsukuri:docs/design/keyframe-engine.md:1220
    links:
      serves: [goal-tsukuri-plugin-sdk]

  - id: isgoal-tsukuri-verifiable-output
    kind: is-goal
    title: The system can prove what it built
    statement: >-
      The system checks a build from its written files and records which adapters, settings and assets made it.
    status: proposed
    rationale: >-
      Spec plan: spec 0001 sets out the output-side verification. The operator has not decided this goal, so confirm it.
    source:
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:142
    links:
      serves: [goal-tsukuri-verified-output]

  - id: isgoal-tsukuri-visible-provenance
    kind: is-goal
    title: The manifest records provenance
    statement: >-
      The output manifest records provenance.
    status: decided
    source:
      - record:tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:235
      - tsukuri:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:263
    links:
      serves: [goal-tsukuri-visible-egress]

  - id: isgoal-tsukuri-agent-usable
    kind: is-goal
    title: An agent can write and repair a story
    statement: >-
      The system gives a text source, one documented grammar and errors that name the line and the nearest valid form, so
      an agent can write and repair stories without guessing.
    status: proposed
    rationale: >-
      Spec 0002 says people and agents guess wrong at positional rules and rates an effects table best for agents. The
      operator decided that users can bring their own agents (log:43) but has not stated this as a system goal.
    source:
      - tsukuri:docs/specs/0002-explicit-anchors-and-syntax.md:11
      - tsukuri:docs/specs/0002-explicit-anchors-and-syntax.md:116
      - log:43
    links:
      serves: [goal-tsukuri-explicit-source, goal-tsukuri-plugin-sdk]

