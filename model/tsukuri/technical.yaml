    title: A renderer declares its lifecycle timing
    statement: >-
      Each Renderer declares, as plain data, when an Element's motion starts and ends and its easing. The schedule reads it
      to place frames, and the check observes it in the output.
    status: proposed
    rationale: >-
      Spec plan: design R4 and spec 0002 set out the lifecycle declaration. The operator has not decided each field or this
      feature's free mark, so confirm them.
