    statement: >-
      The Video is the same page captured frame by frame on a controlled clock, muxed with narration, sound effects, WebVTT
      subtitles and chapter marks.
    status: proposed
    rationale: >-
      Spec plan: spec 0001 and the README set out the Video. The operator has not decided every detail or this feature's
      free mark, so confirm them.
