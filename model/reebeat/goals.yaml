elements:
  # ---------------------------------------------------------------- goals
  - id: goal-reebeat-vision
    kind: goal
    title: Declare the story, reebeat builds the artifacts
    statement: >-
      reebeat takes care of building, so you can focus on creating. You declare the story's beats and what they mean.
      reebeat derives motion, timing and every artifact, reproducibly, and rebuilds only what an edit changes.
    status: decided
    source: [log:7, log:9, log:10, log:61]
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-org-vision]

  - id: goal-reebeat-screenplay-first
    kind: goal
    title: One screenplay, every rendering
    statement: >-
      Authors declare the narrative and its structure, and artifacts are generated from that declaration. In release 1 the
      declaration is imported from one Fountain file. A Fountain file is an input of the importer, not the persistent IR.
    status: decided
    source:
      - log:11
      - log:25
      - log:67-69
      - record:reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:213
      - reebeat:README.md:3
      - reebeat:GLOSSARY.md:15-17
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-reebeat-vision]
      supports: [goal-org-declarative-creation]

  - id: goal-reebeat-deck-and-video
    kind: goal
    title: A Deck and a Video from one source
    statement: >-
      In release 1 a reveal.js Deck and a Video, captured from the same page on a controlled clock, are generated from the
      one source.
    status: decided
    source:
      - record:reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:213
      - reebeat:README.md:3-6
      - reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:9-12
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-reebeat-screenplay-first]

  - id: goal-reebeat-explicit-source
    kind: goal
    title: An explicit source nobody can misread
    statement: >-
      Every reference in a screenplay is written down: Elements, Scenes, effects and anchors each have an id. Nothing
      means "the next one" or "the one above". Errors say the file and line, what was found and the nearest valid form.
    status: proposed
    rationale: >-
      Spec plan: spec 0002 states this goal. The operator picked the effects syntax and named properties (spec 0002 line
      161), not the universal rule on references and errors, so confirm it.
    source:
      - reebeat:docs/specs/0002-explicit-anchors-and-syntax.md:11
      - reebeat:docs/specs/0002-explicit-anchors-and-syntax.md:16-18
    links:
      subgoal-of: [goal-reebeat-screenplay-first]

  - id: goal-reebeat-event-timing
    kind: goal
    title: Effects connect to produced events
    statement: >-
      Sound and visual effects connect to produced events. Narration produces and consumes events that the timeline adjusts
      to. Sound effects can too, but by default more mildly.
    status: decided
    source:
      - log:20
      - log:27
      - reebeat:docs/specs/0002-explicit-anchors-and-syntax.md:15
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-org-declarative-creation]

  - id: goal-reebeat-statechart-model
    kind: goal
    title: Declare the implicit state machine explicitly
    statement: >-
      Scenes and States are the nodes of a statechart and Beats are its transitions. Time comes from a small, ratified
      subset of SMIL and functional reactive time. The model may contain cycles, and each artifact unrolls it into its own
      Plan.
    status: decided
    source: [log:19, log:24, log:62]
    refs: ["pr:reebeat#17"]
    links:
      subgoal-of: [goal-org-declarative-creation]

  - id: goal-reebeat-accessible-artifacts
    kind: goal
    title: Accessible artifacts for different audiences
    statement: >-
      Material produces accessible artifacts for hearing-impaired viewers, visually impaired viewers and people who want
      reduced motion. Subtitles stay readable at a reasonable pace.
    status: decided
    source: [log:10, log:27, log:32]
    refs: ["issue:reebeat#12"]
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-reebeat-vision]
      supports: [goal-org-accessible-artifacts]

  - id: goal-reebeat-localisation
    kind: goal
    title: One story, several narration languages
    statement: >-
      One story can have language variants, and each variant adjusts the timings.
    status: decided
    source: [log:32]
    refs: ["issue:reebeat#10"]
    links:
      subgoal-of: [goal-reebeat-accessible-artifacts]

  - id: goal-reebeat-reproducible-builds
    kind: goal
    title: Reproducible builds
    statement: >-
      Builds are reproducible: the same declared story gives the same artifact.
    status: decided
    source:
      - log:10
      - reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:151
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-reebeat-vision]
      supports: [goal-org-reproducible-builds]

  - id: goal-reebeat-incremental-builds
    kind: goal
    title: Fast, incremental and reactive builds
    statement: >-
      An edit rebuilds only what it changes. The build is an incremental graph with dynamic dependencies, early cutoff
      and content-addressed traces that persist between builds.
    status: decided
    source: [log:10, log:62]
    refs: ["issue:reebeat#9"]
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-reebeat-vision]
      supports: [goal-org-incremental-builds]

  - id: goal-reebeat-interactive-website
    kind: goal
    title: An interactive website as an artifact type
    statement: >-
      Websites become an artifact type, with a focus on interactive learning material that uses the story's multimedia.
      Websites support clicking and other interactions.
    status: decided
    source: [log:36, log:37]
    refs: ["issue:reebeat#19"]
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-reebeat-vision]
      supports: [goal-org-interactive-multimedia]

  - id: goal-reebeat-interactive-lessons
    kind: goal
    title: Interactive lessons, deferred for later
    statement: >-
      Interactive lessons would add learner input, branching, progress and feedback to the website artifact. The
      operator deferred them for later investigation. Nothing is planned.
    status: open
    rationale: >-
      The operator deferred this item (log:36). It stays open until the investigation of prior art (issue #20) starts and
      the operator decides whether to plan it.
    source: [log:36]
    refs: ["issue:reebeat#20"]
    links:
      subgoal-of: [goal-reebeat-interactive-website]

  - id: goal-reebeat-teaching-lint
    kind: goal
    title: A teaching lint for explainer stories
    statement: >-
      The compiler checks explainer stories against multimedia-learning principles: temporal contiguity, signalling,
      redundancy and coherence. Each threshold comes from its primary source.
    status: proposed
    rationale: >-
      Issue #8 was queued by the operator on 2026-10-29, but the decision log does not mention a teaching lint. The
      operator should confirm it as a product goal.
    source: ["issue:reebeat#8"]
    refs: ["issue:reebeat#8"]
    links:
      supports: [goal-reebeat-interactive-website, goal-org-interactive-multimedia]

  - id: goal-reebeat-plugin-sdk
    kind: goal
    title: Plugins and a render-engine SDK
    statement: >-
      The compiler gives modular contracts, components and building blocks. Users can write plugins and extensions, and an
      SDK supports building render engines.
    status: decided
    source: [log:15, log:28, log:43]
    canvas: [value-propositions]
    links:
      subgoal-of: [goal-org-modular-extensible]

  - id: goal-reebeat-multi-renderer
    kind: goal
    title: Several render engines in one story
    statement: >-
      A Scene can name its own render engine, for example one for math scenes. Beats that join Scenes of different
      engines follow explicit transition rules.
    status: decided
    source: [log:28]
    links:
      subgoal-of: [goal-reebeat-plugin-sdk]

  - id: goal-reebeat-npm-publication
    kind: goal
    title: Publish @reebeat packages to npm
    statement: >-
      reebeat publishes `@reebeat/*` pre-releases to npm, so products and plugin authors can depend on them. The npm
      organisation `reebeat` exists.
    status: decided
    source: [log:49]
    refs: ["pr:reebeat#18"]
    links:
      supports: [goal-org-open-compiler, goal-org-modular-extensible]

  - id: goal-reebeat-apache-licence
    kind: goal
    title: License the compiler and its formats under Apache-2.0
    statement: >-
      The compiler and its formats, the IR, its JSON Schema and the codecs, are open source under Apache-2.0.
    status: decided
    source:
      - log:44
      - record:reebeat:docs/design/open-core-boundary.md:21-22
    links:
      supports: [goal-org-open-compiler]

  - id: goal-reebeat-correct-by-construction
    kind: goal
    title: A compiler whose structure prevents bad states
    statement: >-
      The compiler follows correctness by construction: one source of truth for every fact, and explicit dependency graphs
      between the core and its derivations.
    status: decided
    source:
      - log:54
    links:
      supports: [goal-org-correctness-by-construction]

  - id: goal-reebeat-verified-output
    kind: goal
    title: Check the written files, not the pipeline's memory
    statement: >-
      A check reads the files a build wrote and the source, never the build's internal state. Each falsifier has a
      negative control that fails at the stated place.
    status: proposed
    rationale: >-
      Spec plan: spec 0001 sets out the output-side check and the negative controls. The operator has not decided them, so
      confirm it.
    source:
      - reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:28
      - reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:142
    links:
      subgoal-of: [goal-reebeat-correct-by-construction]
      supports: [goal-reebeat-reproducible-builds]

  - id: goal-reebeat-visible-egress
    kind: goal
    title: Every build says what leaves the machine
    statement: >-
      Every integration declares what it sends out, and the output manifest records provenance.
    status: decided
    source:
      - record:reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:235
      - reebeat:docs/design/keyframe-engine.md:1241-1242
      - reebeat:GLOSSARY.md:119-120
    links:
      subgoal-of: [goal-reebeat-correct-by-construction]

  # ------------------------------------------------------------- problems
  - id: problem-reebeat-ffmpeg-gpl
    kind: problem
    title: ffmpeg is GPL, so shipping needs a decision
    statement: >-
      The ffmpeg build used here is GPL. A product that distributes it takes on GPL duties for that binary. The options
      are an LGPL build with another encoder, another codec, or GPL compliance. None is chosen.
    status: open
    rationale: >-
      The operator noted this for later, before distributing a binary (log:50), and issue #7 tracks it. The third-party
      audit says the decision is the operator's and is not taken.
    source:
      - log:50
      - issue:reebeat#7
      - reebeat:docs/design/third-party.md:18-20
    refs: ["issue:reebeat#7"]
    links:
      hinders: [comp-reebeat-encode-ffmpeg, goal-reebeat-npm-publication]

  - id: problem-reebeat-state-stale
    kind: problem
    title: STATE.md is out of date
    statement: >-
      STATE.md says specs 0001 and 0002 are in review. Both pull requests are merged. The file also lists "candidates for
      0003" that are not the spec 0003 the repository holds.
    status: open
    rationale: >-
      Found by reading STATE.md against the pinned repository: spec 0003 is the Effect 4.1 upgrade
      (docs/specs/0003-effect-4-1-upgrade.md:1) and PRs #3 and #4 are merged. The fix belongs to the repository owner.
    source:
      - reebeat:STATE.md:7
      - reebeat:STATE.md:13
      - reebeat:docs/specs/0003-effect-4-1-upgrade.md:1
      - pr:reebeat#3
      - pr:reebeat#4
    gap:
      repo: reebeat
      fix: Rewrite STATE.md from the merged pull requests and the specs that exist, or generate it from this model.
    links:
      hinders: [goal-org-correctness-by-construction]

  - id: problem-reebeat-spec-status-mismatch
    kind: problem
    title: Spec status lines disagree with the pull requests
    statement: >-
      Spec 0002 says "built; in review (PR #4)" and spec 0001 and spec 0003 say "plan", but all three pull requests are
      merged. A reader cannot tell the state of a spec from the spec.
    status: open
    rationale: >-
      Spec 0000 freezes a spec when its pull request opens, so a stale status line may be by design. The mismatch with
      STATE.md and with GitHub is a real gap in the single current state; the operator should say how a spec shows that
      it is merged.
    source:
      - reebeat:docs/specs/0002-explicit-anchors-and-syntax.md:3
      - reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:3
      - reebeat:docs/specs/0003-effect-4-1-upgrade.md:3
      - reebeat:docs/specs/0000-development-lifecycle.md:129
    gap:
      repo: reebeat
      fix: Show merge state from GitHub in generated views and leave the frozen spec text alone.
    links:
      hinders: [goal-org-correctness-by-construction]

  - id: problem-reebeat-exceptions-gate-blind
    kind: problem
    title: The exception gate ignores @effect-diagnostics comments
    statement: >-
      `check:exceptions` does not count `@effect-diagnostics` directives. One such comment can silence an Effect rule
      with no registry entry, which breaks the rule that every suppression is registered.
    status: open
    rationale: "Issue #14 reports it, found in a foldkit-flow review. The fix and its negative control are proposed there."
    source:
      - issue:reebeat#14
      - reebeat:AGENTS.md:46
      - reebeat:tools/quality/effectExceptions.ts:44
    refs: ["issue:reebeat#14"]
    gap:
      repo: reebeat
      fix: Add both @effect-diagnostics forms to the directive pattern, add a negative control and register existing directives.
    links:
      hinders: [comp-reebeat-quality-gates]

  - id: problem-reebeat-bun-not-pinned
    kind: problem
    title: vp run uses its own Bun
    statement: >-
      The repository declares Bun as `^1.4.2` and asks to download when the installed Bun does not match. `vp run` then
      uses its own Bun, not the one devenv pins, so scripts may run on another version.
    status: open
    rationale: "Issue #15 reports it and proposes to pin the version exactly and to bump it together with devenv."
    source:
      - issue:reebeat#15
      - reebeat:package.json:55-61
      - reebeat:devenv.nix:17
    refs: ["issue:reebeat#15"]
    gap:
      repo: reebeat
      fix: Pin devEngines.packageManager to the devenv Bun version exactly and check that both report the same revision.
    links:
      hinders: [goal-reebeat-reproducible-builds]

  - id: problem-reebeat-no-contributing
    kind: problem
    title: No CONTRIBUTING.md
    statement: >-
      The repository has no CONTRIBUTING.md. The README points contributors to AGENTS.md and spec 0000 instead.
    status: open
    rationale: >-
      The path does not exist at the pinned commit. Whether a standalone file is wanted is the operator's choice, since
      the README already links the procedure.
    source:
      - absent:reebeat:CONTRIBUTING.md
      - reebeat:README.md:50
    gap:
      repo: reebeat
      fix: Add a short CONTRIBUTING.md that links AGENTS.md and the spec, code and pull request road.
    links:
      hinders: [goal-org-open-compiler]

  - id: problem-reebeat-no-security-policy
    kind: problem
    title: No SECURITY.md
    statement: >-
      The repository has no SECURITY.md, so a reporter does not know where to send a vulnerability.
    status: open
    rationale: The path does not exist at the pinned commit. The operator should say where private reports go.
    source: [absent:reebeat:SECURITY.md]
    gap:
      repo: reebeat
      fix: Add SECURITY.md that names a private reporting channel and the supported versions.
    links:
      hinders: [goal-org-open-compiler]

  - id: problem-reebeat-no-code-of-conduct
    kind: problem
    title: No CODE_OF_CONDUCT.md
    statement: The repository has no CODE_OF_CONDUCT.md, so there is no stated standard for behaviour of contributors.
    status: open
    rationale: The path does not exist at the pinned commit. The choice of a code is the operator's.
    source: [absent:reebeat:CODE_OF_CONDUCT.md]
    gap:
      repo: reebeat
      fix: Adopt a standard code of conduct and add it as CODE_OF_CONDUCT.md.
    links:
      hinders: [goal-org-open-compiler]

  - id: problem-reebeat-no-issue-templates
    kind: problem
    title: No issue templates
    statement: >-
      The .github directory holds only a workflow. There are no issue templates, so a report may arrive without the spec,
      journey or version that a maintainer needs.
    status: open
    rationale: >-
      The path does not exist at the pinned commit, which is all the source shows. The risk to reports is an inference.
      Whether to add templates is the operator's choice.
    source: [absent:reebeat:.github/ISSUE_TEMPLATE]
    gap:
      repo: reebeat
      fix: Add issue templates for a bug and for a roadmap item under .github/ISSUE_TEMPLATE.
    links:
      hinders: [goal-org-open-compiler]

  - id: problem-reebeat-no-pr-template
    kind: problem
    title: No pull request template
    statement: >-
      The repository has no pull request template. The report format of spec 0000 lives in a skill, so a contributor
      without the skill does not see it.
    status: open
    rationale: The file does not exist at the pinned commit. Spec 0000 lines 59-70 define the eight sections of the report.
    source:
      - absent:reebeat:.github/PULL_REQUEST_TEMPLATE.md
      - reebeat:docs/specs/0000-development-lifecycle.md:60-71
    gap:
      repo: reebeat
      fix: Add .github/PULL_REQUEST_TEMPLATE.md with the eight report sections.
    links:
      hinders: [goal-org-open-compiler]

  - id: problem-reebeat-goals-not-in-readme
    kind: problem
    title: The README does not state the goals
    statement: >-
      The README opens with the mechanism, "explainer videos from a screenplay". It does not state the tagline or the
      qualities the operator wants to promote.
    status: open
    rationale: >-
      The operator said the compiler framing feels too internal and asked to promote the qualities (log:9). The README
      at the pinned commit has no tagline.
    source:
      - log:7
      - log:9
      - reebeat:README.md:1-3
    gap:
      repo: reebeat
      fix: Open the README with the tagline and the four qualities, and generate that text from this model.
    links:
      hinders: [goal-reebeat-vision]

  - id: problem-reebeat-roadmap-only-in-issues
    kind: problem
    title: The README does not link the generated roadmap
    statement: >-
      The reebeat README has no link to the roadmap that reebeat/.github generates from the model and the tracker, and
      STATE.md is out of date. The reebeat repository holds no roadmap file.
    status: open
    rationale: >-
      No roadmap file exists at the pinned commit, and the README does not mention a roadmap. The roadmap now exists as
      `docs/roadmap.md` of reebeat/.github, generated from this model, which keeps a single source. The open item is the
      link. The stale STATE.md is also recorded in problem-reebeat-state-stale.
    source:
      - absent:reebeat:ROADMAP.md
      - reebeat:README.md:1-50
      - reebeat:STATE.md:7
      - issue:reebeat#19
      - issue:reebeat#20
    gap:
      repo: reebeat
      fix: Link the generated roadmap from the README and bring STATE.md up to date.
    links:
      hinders: [goal-org-written-intent]

  - id: problem-reebeat-demand-unmeasured
    kind: problem
    title: Demand for reebeat is not measured
    statement: >-
      The README and the specs read for this model report no usage or uptake. The roadmap is not evidence of demand.
    status: open
    rationale: >-
      Limited to the inspected documents: the README and the specs show no usage or uptake figure, and no wider inventory
      was made. The organisation-level problem is the same; this one is the product-level view. The operator should decide
      what to measure.
    source: ["reebeat:README.md:1-50"]
    gap:
      repo: reebeat
      fix: Decide a product-level signal, such as installs of the published packages, and record it.
    links:
      hinders: [goal-reebeat-vision]

  - id: problem-reebeat-packages-private
    kind: problem
    title: No pre-release yet; cli and adapters unpublished
    statement: >-
      No `@reebeat/*` package is on npm yet: the registry answered 404 for `@reebeat/core` on 2026-10-29. Seven packages are
      set up to publish (core, subtitles, lint, services, pipeline, sounds-synth, render-reveal). The `reebeat` command
      (`cli`), `verify` and the five Node adapters stay `"private": true`, so they have no distribution path.
    status: open
    rationale: >-
      Observed at the pinned commit: seven of the 14 manifests under `packages/` carry no `"private": true`, and
      `.github/workflows/release.yml` exists (PR #18, merged). The other seven are private by design (spec 0009). A lookup of
      `@reebeat/core` in the npm registry returned 404 on 2026-10-29, which a pinned file cannot show. Spec 0009 says the
      first release needs operator steps (claim the names, configure trusted publishers); whether they are done is not
      verified. The operator should confirm the gap and say how the `reebeat` command and the adapters are distributed.
    source:
      - reebeat:packages/core/package.json:11-14
      - reebeat:packages/cli/package.json:4
      - reebeat:packages/verify/package.json:4
      - reebeat:packages/speech-kokoro/package.json:4
      - reebeat:packages/align-whisper/package.json:4
      - reebeat:packages/capture-chromium/package.json:4
      - reebeat:packages/encode-ffmpeg/package.json:4
      - reebeat:packages/cache-fs/package.json:4
      - reebeat:.github/workflows/release.yml:1-5
      - reebeat:docs/design/open-core-boundary.md:26
      - reebeat:docs/specs/0009-npm-prereleases.md:23
      - reebeat:docs/specs/0009-npm-prereleases.md:36-38
      - pr:reebeat#18
    refs: ["pr:reebeat#18"]
    gap:
      repo: reebeat
      fix: Publish the first alpha release after the operator steps, and decide how the cli and the Node adapters are distributed.
    links:
      hinders: [goal-reebeat-npm-publication]

  - id: problem-reebeat-xstate-alpha-risk
    kind: problem
    title: XState v6 is an alpha with breaking releases
    statement: >-
      The planned build-time interpreter, XState v6, is an alpha. Its releases renamed public names without aliases, and
      its declarations failed under the stricter compiler flags of the packages.
    status: proposed
    rationale: >-
      The operator accepted an exactly pinned alpha behind a reebeat-owned boundary (spec 0007 decisions). That the alpha
      is a risk to keep watching is the spike's own finding, not an operator statement.
    source:
      - reebeat:docs/specs/0007-scxml-persistent-ir-spike.md:582-584
      - reebeat:docs/specs/0007-scxml-persistent-ir-spike.md:586-588
      - log:26
    links:
      hinders: [comp-reebeat-statechart-xstate]

  - id: problem-reebeat-experimental-gate-open
    kind: problem
    title: No gate for experimental types in the API
    statement: >-
      The rule that experimental types stay out of the public API is decided, but no test enforces it. Whether to scan
      exported declarations is open.
    status: open
    rationale: Open-core-boundary says the gate is open. Today none of the locked dependencies is experimental, so nothing leaks yet.
    source:
      - reebeat:docs/design/open-core-boundary.md:58
      - reebeat:docs/design/third-party.md:48
    gap:
      repo: reebeat
      fix: Add a test that scans exported declarations for imports from a list of experimental packages.
    links:
      hinders: [comp-reebeat-quality-gates]

  - id: problem-reebeat-extension-points-open
    kind: problem
    title: Extension points beyond adapters are not defined
    statement: >-
      Plugins are supported, and the adapter seams are the proposed plugin API. New effect kinds, new importers and the
      agent tool protocol are open, and no extension ADR exists.
    status: open
    rationale: >-
      Open-core-boundary marks these open. Issue #19 says its spec follows an extension architecture ADR, which is not in
      the pull request list.
    source:
      - reebeat:docs/design/open-core-boundary.md:24-25
      - issue:reebeat#19
    refs: ["pr:reebeat#23"]
    gap:
      repo: reebeat
      fix: Write the extension architecture ADR, including capability declarations and the agent tool protocol.
    links:
      hinders: [goal-reebeat-plugin-sdk, goal-reebeat-multi-renderer]

  - id: problem-reebeat-no-incremental-render
    kind: problem
    title: Every edit rebuilds the render
    statement: >-
      Speech assets are cached by content. An edit still rebuilds the whole timeline and the whole render, so an editor
      cannot show fast previews.
    status: open
    rationale: "Issue #9 describes it. Release 1 caches speech only, and the build program has no render-segment cache."
    source:
      - issue:reebeat#9
      - reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:78
      - reebeat:packages/pipeline/src/buildProgram.ts:5-7
    refs: ["issue:reebeat#9"]
    links:
      hinders: [goal-reebeat-incremental-builds]

  - id: problem-reebeat-identity-scene-bounded
    kind: problem
    title: Element identity stops at the Scene
    statement: >-
      The operator decided that the same id is the same entity across Scenes. Release 1 matches ids only between two
      consecutive Scenes joined by AUTO-ANIMATE.
    status: open
    rationale: >-
      The log (log:23) and the glossary (GLOSSARY.md:20) disagree, and the log wins until the glossary is corrected. PR #17
      says story-wide identity is deferred to the start of spec 0005.
    source:
      - log:23
      - reebeat:GLOSSARY.md:19-21
      - pr:reebeat#17
    gap:
      repo: reebeat
      fix: Implement story-wide identity at the start of spec 0005 and update the glossary.
    links:
      hinders: [goal-reebeat-statechart-model]

  - id: problem-reebeat-transition-lines-positional
    kind: problem
    title: Transition lines still apply to the Scene below
    statement: >-
      `> AUTO-ANIMATE` and `> CUT` still apply to the Scene heading below them. That is positional, which spec 0002 set out
      to remove.
    status: open
    rationale: >-
      Spec 0002 records it as an operator-owned fork that is open. Making the transition a heading property is one option.
    source:
      - reebeat:docs/specs/0002-explicit-anchors-and-syntax.md:203
      - reebeat:docs/specs/0002-explicit-anchors-and-syntax.md:11
    gap:
      repo: reebeat
      fix: Ask the operator to pick, then make the transition a property of the Scene heading if chosen.
    links:
      hinders: [goal-reebeat-explicit-source]

  - id: problem-reebeat-anchor-probes-missing
    kind: problem
    title: Two anchor kinds have no probe
    statement: >-
      The `update` and `scene.end` anchors exist in code, but no check observes them in the written media. No lint reports
      an Element that is declared and never used.
    status: open
    rationale: Spec 0002 lists them as not done at its as-built entry.
    source: ["reebeat:docs/specs/0002-explicit-anchors-and-syntax.md:200"]
    gap:
      repo: reebeat
      fix: Add probes for update and scene.end and an unusedElement lint rule.
    links:
      hinders: [goal-reebeat-verified-output]

  - id: problem-reebeat-speed-interim
    kind: problem
    title: One Line keeps an interim speed hint
    statement: >-
      The story `same-id` keeps `(speed 1.05)` on one Line as an interim fix. Removal waits for word timings from the
      synthesiser or for alignment judged by its path.
    status: open
    rationale: Spec 0001 names it a follow-up to release 1, not part of spec 0002. STATE.md lists it too.
    source:
      - reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:275
      - reebeat:STATE.md:12
    gap:
      repo: reebeat
      fix: Remove the speed hint once word timings come from the synthesiser or alignment is judged by its path.
    links:
      hinders: [goal-reebeat-event-timing]

  - id: problem-reebeat-licence-gate-declared-only
    kind: problem
    title: The licence gate trusts the declared licence field
    statement: >-
      The licence gate reads the `license` field of each package. It does not read licence files inside packages, the
      licences of what a package bundles, or the binaries and models.
    status: open
    rationale: >-
      The audit states the limit itself. A package can declare a licence wrongly, so assurance is partial.
    source: ["reebeat:docs/design/third-party.md:93"]
    gap:
      repo: reebeat
      fix: Read licence files inside packages for those that bundle components.
    links:
      hinders: [goal-reebeat-apache-licence]

  - id: problem-reebeat-dco-and-trademark-open
    kind: problem
    title: DCO enforcement and a trademark policy are undecided
    statement: >-
      A Developer Certificate of Origin sign-off is recommended and not enforced. A trademark policy waits for the final
      name.
    status: open
    rationale: Open-core-boundary lists both as open.
    source:
      - reebeat:docs/design/open-core-boundary.md:63
      - reebeat:docs/design/open-core-boundary.md:68
    gap:
      repo: reebeat
      fix: Decide DCO enforcement now, and write the trademark policy after the name is final.
    links:
      hinders: [goal-reebeat-apache-licence]

  - id: problem-reebeat-review-cleanup
    kind: problem
    title: Verify cleanup misses a Chromium from build or journey
    statement: >-
      The `verify-reebeat` cleanup does not stop a Chromium that `reebeat build` or `journey` starts through
      capture-chromium. Playwright launches it detached, in its own process group, and nothing records it in `pids.txt`.
      After an interrupted build it can stay running.
    status: proposed
    rationale: >-
      PR #16 merged at the pinned commit and disclosed this gap in the `cleanup.sh` header and in the skill. Issue #25 (open)
      tracks it. It is a finding of a review round and an issue, not an operator statement, so confirm it.
    source:
      - issue:reebeat#25
      - reebeat:.agents/skills/verify-reebeat/scripts/cleanup.sh:4-6
      - reebeat:.agents/skills/verify-reebeat/scripts/run.sh:48
      - reebeat:.agents/skills/verify-reebeat/SKILL.md:83
    refs: ["issue:reebeat#25"]
    links:
      hinders: [process-reebeat-verify-build]

  - id: problem-reebeat-state-machine-conformance
    kind: problem
    title: "Explicit state machines (PR #17) are not merged"
    statement: >-
      Spec 0004 (explicit state machines and timing combinators, pull request #17) is not merged at the pinned commit. Its
      review findings change with each push and live on the pull request.
    status: proposed
    rationale: >-
      Pull request #17 was open at head 9394420 on 2026-10-29, and no spec 0004 file exists at the pinned commit. The model
      keeps the fact, not the review rounds, which belong to the tracker. Confirm it.
    source:
      - pr:reebeat#17
      - absent:reebeat:docs/specs/0004-explicit-state-machines-and-timing-combinators.md
    refs: ["pr:reebeat#17"]
    links:
      hinders: [goal-reebeat-statechart-model]

  # ---------------------------------------------------------- constraints
  - id: constraint-reebeat-apache-2
    kind: constraint
    constraintType: legal
    title: The compiler and its formats are Apache-2.0
    statement: >-
      The compiler and its formats are Apache-2.0. Contributions come in under the same licence, with no contributor
      agreement. The copyright holder is the individual named in NOTICE.
    status: decided
    source:
      - log:44
      - reebeat:NOTICE:2
      - record:reebeat:docs/design/open-core-boundary.md:21
      - record:reebeat:docs/design/open-core-boundary.md:62
      - record:reebeat:docs/design/open-core-boundary.md:64
    links:
      constrains: [comp-reebeat-product]

  - id: constraint-reebeat-ffmpeg-process-only
    kind: constraint
    constraintType: legal
    title: External tools run as separate processes
    statement: >-
      reebeat calls ffmpeg, ffprobe, whisper-cli and Chromium as external processes. It neither links nor bundles them, so
      their licences do not reach reebeat's code.
    status: proposed
    rationale: >-
      The third-party audit states the reading and says it is not legal advice. The operator noted the GPL status (log:50)
      but has not recorded this reading as a decision.
    source:
      - reebeat:docs/design/third-party.md:12
      - reebeat:README.md:46
      - log:50
    links:
      constrains: [comp-reebeat-encode-ffmpeg, comp-reebeat-capture-chromium, comp-reebeat-align-whisper]

  - id: constraint-reebeat-public-repo
    kind: constraint
    constraintType: process
    title: The repository is public, no private material
    statement: >-
      The repository is public. It holds no secret, no personal data and no course-private material. A regression
      baseline derived from course material stays outside the repository.
    status: proposed
    rationale: >-
      AGENTS.md and spec 0000 state it, and gitleaks enforces part of it. The decision log does not repeat it, so the
      operator should confirm it as standing.
    source:
      - reebeat:AGENTS.md:3
      - reebeat:docs/specs/0000-development-lifecycle.md:34
      - reebeat:docs/design/4em-regression-baseline.md:11-12
    links:
      constrains: [comp-reebeat-product]

  - id: constraint-reebeat-working-name
    kind: constraint
    constraintType: organisational
    title: The name reebeat is a working name
    statement: >-
      The name `reebeat` is provisional. The GitHub and npm organisations are reserved. A trademark policy waits for the
      final name.
    status: proposed
    rationale: >-
      Observed in the repository: the README and open-core-boundary.md call the name working, and design decision 9 names
      it. The operator has not stated the decision on its own line, so confirm it.
    source:
      - reebeat:docs/design/keyframe-engine.md:1111
      - reebeat:README.md:42
      - reebeat:docs/design/open-core-boundary.md:68
    links:
      constrains: [comp-reebeat-product]

  - id: constraint-reebeat-effect-pin
    kind: constraint
    constraintType: technical
    title: Effect is pinned at 4.1.0 as one family
    statement: >-
      `effect` and every `@effect/*` runtime package share one version, 4.1.0, pinned in the root catalog. `@effect/tsgo`
      is one version for the whole repository. An upgrade is its own spec.
    status: proposed
    rationale: >-
      Observed in the repository: the catalog pins 4.1.0 and the family check enforces one version. Spec 0003 says the
      operator asked for the latest Effect in every repository, but not this pin, so confirm it.
    source:
      - reebeat:package.json:70
      - reebeat:AGENTS.md:56
      - log:55
    links:
      constrains: [comp-reebeat-product]

  - id: constraint-reebeat-xstate-pinned
    kind: constraint
    constraintType: technical
    title: XState is a pinned alpha behind a boundary
    statement: >-
      The build-time interpreter is XState v6 alpha, pinned exactly at alpha.71, using its pure system API. It sits in an
      integration package behind a reebeat-owned service, and its types never appear in the public API.
    status: decided
    source:
      - log:26
      - record:reebeat:docs/specs/0007-scxml-persistent-ir-spike.md:616-620
    links:
      constrains: [comp-reebeat-statechart-xstate]

  - id: constraint-reebeat-local-tools
    kind: constraint
    constraintType: technical
    title: A local build needs Chromium and ffmpeg
    statement: >-
      Release 1 builds on Linux inside devenv. Even with offline stand-ins for speech and alignment, a build still needs
      Chromium and ffmpeg.
    status: proposed
    rationale: >-
      Observed in the repository: the README and spec 0001 state this need. The operator has not decided a Linux and
      devenv requirement, so confirm it.
    source:
      - reebeat:README.md:12
      - reebeat:README.md:23
      - reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:190
    links:
      constrains: [process-reebeat-capture-frames, process-reebeat-encode-video]

  - id: constraint-reebeat-canvas
    kind: constraint
    constraintType: technical
    title: Release 1 renders 1280x720 at 30 fps
    statement: >-
      The release-1 canvas is 1280 by 720 at 30 frames per second. Frame rate is meant to be explicit configuration with
      presets 24, 30 and 60. A larger canvas costs more capture time.
    status: open
    rationale: >-
      The operator asked for explicit frame rates with presets (log:22). Spec 0001 asks whether 1920 by 1080 is wanted and
      the question stays open.
    source:
      - log:22
      - reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:80-82
      - reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:209
    links:
      constrains: [process-reebeat-capture-frames]

  # -------------------------------------------------------- opportunities
  - id: opportunity-reebeat-identity-diff-motion
    kind: opportunity
    title: The identity diff derives motion
    statement: >-
      When the same id appears in two Keyframes, the compiler derives enter, exit and update. Authors do not write the
      motion by hand.
    status: proposed
    rationale: >-
      The operator decided story-wide identity (log:23). Naming it an opportunity to replace hand-authored animation is
      the model author's reading, so the operator should confirm it.
    source:
      - log:23
      - reebeat:GLOSSARY.md:65-67
    canvas: [value-propositions]
    links:
      supports: [goal-reebeat-vision, goal-reebeat-statechart-model]

  - id: opportunity-reebeat-one-declaration-many-surfaces
    kind: opportunity
    title: One declaration, many surfaces
    statement: >-
      One interaction declaration can generate an agent function signature, a web control, a visible-cursor action in a
      Video and a Deck step. No one writes each surface by hand.
    status: proposed
    rationale: >-
      Proposed in comments on issue #19. The log says an interaction is just another element that triggers events (log:38)
      and is surfaced through functions, tool calling or website controls (log:38).
    source:
      - issue:reebeat#19@6503203735
      - log:38
    refs: ["issue:reebeat#19"]
    links:
      supports: [goal-reebeat-interactive-website, goal-reebeat-multi-renderer]

  - id: opportunity-reebeat-offline-standins
    kind: opportunity
    title: Offline stand-ins need no model
    statement: >-
      A silent narrator, an even aligner, tone sounds and an in-memory cache let anyone build and test the whole pipeline
      with no model, key or network.
    status: proposed
    rationale: >-
      Observed in the repository: the README and the glossary describe the stand-ins. The operator decided only that every
      integration has a stand-in (spec 0001 line 234), so confirm the benefit.
    source:
      - reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:235
      - reebeat:README.md:23
      - reebeat:GLOSSARY.md:115-117
    links:
      supports: [goal-reebeat-plugin-sdk, goal-reebeat-reproducible-builds]

  - id: opportunity-reebeat-byo-agents
    kind: opportunity
    title: A text source agents can write and repair
    statement: >-
      A story is one text file, and `plan`, `lint` and `check` print line-numbered results. A user's own agent can write
      and repair stories with the same tools as a hosted agent.
    status: proposed
    rationale: >-
      The operator decided that users can bring their own agents (log:43). That a line-numbered text source suits agents is
      the spec's reading of the earlier positional grammar.
    source:
      - log:43
      - reebeat:docs/specs/0002-explicit-anchors-and-syntax.md:11
      - reebeat:docs/specs/0002-explicit-anchors-and-syntax.md:119
    links:
      supports: [goal-reebeat-plugin-sdk, goal-reebeat-explicit-source]

  - id: opportunity-reebeat-lint-open-fixes-paid
    kind: opportunity
    title: Lint in the compiler, fixes in the editor
    statement: >-
      The lint can live in the open compiler, and guided fixes can be a paid feature of the editor.
    status: proposed
    rationale: >-
      Issue #8 suggests it as a possible product tier. It applies the operator's rule that costly features are paid (log:43)
      but the operator has not confirmed this split.
    source: ["issue:reebeat#8", "log:43"]
    refs: ["issue:reebeat#8"]
    links:
      supports: [goal-reebeat-teaching-lint]

  - id: opportunity-reebeat-react-engine
    kind: opportunity
    title: React as render engine, JSX as importer
    statement: >-
      React's core was rejected as the compiler core. The operator kept it as a possible render engine, and JSX as a
      possible authoring importer.
    status: decided
    source: [log:64]
    links:
      supports: [goal-reebeat-multi-renderer]
