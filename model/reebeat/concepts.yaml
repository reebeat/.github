elements:
  - id: concept-reebeat-story
    kind: concept
    title: Story
    statement: >-
      The largest unit with one concern and one audience. It contains Scenes, and its source is one Screenplay. A Video is
      a rendering of a Story, not the Story.
    attributes:
      - one concern and one audience
      - title, author and default speech speed
    status: proposed
    rationale: >-
      Observed in the repository: the glossary, which an agent wrote, defines Story. The decision log defines Scene, State
      and Beat but does not define Story, so confirm it.
    source: ["reebeat:GLOSSARY.md:11-13"]
    relations:
      - type: relates
        to: concept-reebeat-screenplay
        label: has source
        multiplicity: "1 to 1"

  - id: concept-reebeat-screenplay
    kind: concept
    title: Screenplay
    statement: >-
      In release 1 the source of a Story is one Fountain file. The renderings are generated from it.
    status: decided
    source:
      - record:reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:212
      - reebeat:GLOSSARY.md:15-17
    relations:
      - type: relates
        to: concept-reebeat-plan
        label: is read into
        multiplicity: "1 to 1"

  - id: concept-reebeat-scene
    kind: concept
    title: Scene
    statement: >-
      A Scene is a compound State: it groups States in the story's statechart.
    status: decided
    source:
      - log:19
    relations:
      - type: part-of
        to: concept-reebeat-story
        multiplicity: "1..* per Story"
      - type: isa
        to: concept-reebeat-state
        label: is a compound

  - id: concept-reebeat-state
    kind: concept
    title: State
    statement: >-
      A node of the story's statechart. Scenes and States are nodes, and Beats are the edges between them.
    status: decided
    source: [log:19]
    relations:
      - type: relates
        to: concept-reebeat-beat
        label: is joined by
        multiplicity: "0..* to 0..*"

  - id: concept-reebeat-beat
    kind: concept
    title: Beat
    statement: >-
      A Beat is a transition, an edge between States.
    status: decided
    source:
      - log:19
    relations:
      - type: relates
        to: concept-reebeat-state
        label: joins

  - id: concept-reebeat-keyframe
    kind: concept
    title: Keyframe
    statement: >-
      The visual state a Beat ends in: every visible Element with its properties.
    status: proposed
    rationale: >-
      Observed in the repository: the glossary defines the Keyframe as the state a Beat ends in. The log decides that an id
      carries identity across Scenes (log:23) but does not define Keyframe, so confirm the exact definition.
    source: ["reebeat:GLOSSARY.md:27-29"]
    relations:
      - type: relates
        to: concept-reebeat-element
        label: shows
        multiplicity: "1 to 0..*"
      - type: relates
        to: concept-reebeat-beat
        label: is the end state of
        multiplicity: "1 to 1"

  - id: concept-reebeat-line
    kind: concept
    title: Line
    statement: >-
      The narration that carries a Beat: the dialogue of the NARRATOR, aligned to words. Its narration text is the
      dialogue itself. Subtitles and speaker notes carry exactly that text.
    attributes:
      - narration text
      - aligned word times
      - delivery hints
    status: proposed
    rationale: >-
      Observed in the repository: the glossary defines Line, and the log describes narration (log:27) without defining it.
      The operator should confirm the definition.
    source:
      - log:27
      - reebeat:GLOSSARY.md:31-33
    relations:
      - type: relates
        to: concept-reebeat-hint
        label: may carry
        multiplicity: "1 to 0..*"
      - type: part-of
        to: concept-reebeat-beat
        label: carries
        multiplicity: "0..1 per Beat"

  - id: concept-reebeat-effect
    kind: concept
    title: Effect
    statement: >-
      An effect is declared in a Scene's effects block and is timed against an anchor.
    status: decided
    source:
      - record:reebeat:docs/specs/0002-explicit-anchors-and-syntax.md:161
      - record:reebeat:docs/specs/0002-explicit-anchors-and-syntax.md:162
      - reebeat:GLOSSARY.md:35-37
    relations:
      - type: part-of
        to: concept-reebeat-scene
        multiplicity: "0..* per Scene"
      - type: relates
        to: concept-reebeat-anchor
        label: is timed against
        multiplicity: "1 to 1"
      - type: relates
        to: concept-reebeat-element
        label: acts on
        multiplicity: "0..* to 0..1"

  - id: concept-reebeat-anchor
    kind: concept
    title: Anchor
    statement: >-
      A named moment an effect is timed against: a word, `scene.start`, `scene.end`, the transition into the Scene (its
      start, its end or a percent of the way), or an Element's lifecycle.
    status: decided
    source:
      - record:reebeat:docs/specs/0002-explicit-anchors-and-syntax.md:162
      - reebeat:docs/specs/0002-explicit-anchors-and-syntax.md:14
      - reebeat:GLOSSARY.md:39-41
    relations:
      - type: relates
        to: concept-reebeat-lifecycle-event
        label: may name
        multiplicity: "1 to 0..1"

  - id: concept-reebeat-transition-anchor
    kind: concept
    title: Transition anchor
    statement: >-
      The Scene's incoming slide transition as an anchor: its start, its end or a percent of the way. A sound that belongs
      to the slide change is anchored here, so it follows the motion and not the voice.
    status: decided
    source:
      - record:reebeat:docs/specs/0002-explicit-anchors-and-syntax.md:162
      - reebeat:GLOSSARY.md:47-49
    relations:
      - type: isa
        to: concept-reebeat-anchor

  - id: concept-reebeat-lifecycle-event
    kind: concept
    title: Lifecycle event
    statement: >-
      What happens to an Element in a Scene, from the identity diff: enter, exit, move or update. Enter, exit, move and
      update each have a start and an end, except an instant such as an exit, which has no window and no percent. Move and
      update follow the renderer's declared easing. The others are linear in time.
    status: proposed
    rationale: >-
      Spec plan: spec 0002 and the glossary define enter, exit, move and update. The operator decided that lifecycles are
      anchors (spec 0002 line 162), not each event, so confirm them.
    source:
      - reebeat:GLOSSARY.md:43-45
    relations:
      - type: relates
        to: concept-reebeat-element
        label: happens to
        multiplicity: "0..* to 1"
      - type: relates
        to: concept-reebeat-identity-diff
        label: comes from
        multiplicity: "0..* to 1"

  - id: concept-reebeat-hint
    kind: concept
    title: Hint
    statement: >-
      An optional instruction that the content alone does not carry: a delivery parenthetical before a Line, or a
      transition between Scenes.
    status: proposed
    rationale: >-
      Observed in the repository: the glossary defines Hint. The operator's log does not name Hints, so confirm it.
    source: ["reebeat:GLOSSARY.md:51-53"]
    relations:
      - type: part-of
        to: concept-reebeat-beat
        multiplicity: "0..* per Beat"

  - id: concept-reebeat-element
    kind: concept
    title: Element
    statement: >-
      A visible thing with an id. Elements declare styles and transitions, and the same id is the same entity across
      Scenes.
    status: decided
    source:
      - log:20
      - log:23
    relations:
      - type: part-of
        to: concept-reebeat-scene
        multiplicity: "0..* per Scene"

  - id: concept-reebeat-identity-diff
    kind: concept
    title: Identity diff
    statement: >-
      The comparison of two Keyframes by Element id that derives motion. An id only in the second enters, an id only in
      the first exits, and an id in both updates.
    status: proposed
    rationale: >-
      Spec plan: the operator decided reveal.js Auto-Animate as the release-1 identity diff (spec 0001 line 212) and
      story-wide identity (log:23). The comparison algorithm comes from the glossary, so confirm it.
    source:
      - reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:212
      - log:23
      - reebeat:GLOSSARY.md:65-67
    relations:
      - type: relates
        to: concept-reebeat-keyframe
        label: compares
        multiplicity: "1 to 2"
      - type: relates
        to: concept-reebeat-plan
        label: is listed in
        multiplicity: "1 to 1"

  - id: concept-reebeat-plan
    kind: concept
    title: Plan
    statement: >-
      The named compiler stage between the Story and the schedule. It lists every Element, effect and identity decision,
      keeps the author's intent, and is plain data for review and golden tests. `reebeat plan` prints it.
    attributes:
      - source hash
      - Scenes, Elements, effects, identity
      - canonical JSON, byte-comparable
    status: proposed
    rationale: >-
      Spec plan: the design names the Plan as a stage and spec 0001 sets out its contents. The operator has not decided
      those contents, so confirm them.
    source:
      - reebeat:docs/design/keyframe-engine.md:1112
      - reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:89
    relations:
      - type: relates
        to: concept-reebeat-story
        label: is derived from
        multiplicity: "1 to 1"
      - type: relates
        to: concept-reebeat-timeline
        label: is resolved into
        multiplicity: "1 to 0..1"
      - type: relates
        to: concept-org-ir
        label: is the release-1 form of

  - id: concept-reebeat-timeline
    kind: concept
    title: Timeline
    statement: >-
      The Plan with every Line, effect, step and slide change placed at an integer frame. The schedule stage builds it from
      the aligned words and the renderer's lifecycle.
    attributes:
      - total frames
      - frame of each effect
    status: proposed
    rationale: >-
      Spec plan: the design names the Timeline as a stage and spec 0001 sets out the integer-frame schedule. The operator
      has not decided those details, so confirm them.
    source:
      - reebeat:docs/design/keyframe-engine.md:1112
      - reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:67
    relations:
      - type: relates
        to: concept-reebeat-effect
        label: holds the frame of
        multiplicity: "1 to 0..*"

  - id: concept-reebeat-model
    kind: concept
    title: Model
    statement: >-
      The first of three layers: a statechart plus functional reactive and SMIL time. It may contain cycles, such as
      interactive loops and repeats.
    status: decided
    source: [log:62]
    relations:
      - type: relates
        to: concept-reebeat-plan
        label: is unrolled into
        multiplicity: "1 to 1..* per artifact"

  - id: concept-reebeat-build-graph
    kind: concept
    title: Build graph
    statement: >-
      The third layer: an incremental graph with dynamic dependencies, early cutoff and content-addressed persistent
      traces. "DAG" applies to this graph only.
    status: decided
    source: [log:62]
    relations:
      - type: relates
        to: concept-reebeat-plan
        label: builds from
        multiplicity: "1 to 1..*"

  - id: concept-reebeat-ir
    kind: concept
    title: Story IR and Timeline IR
    statement: >-
      reebeat's own JSON format, defined by an Effect Schema, for the story and for the timeline. PR #17 keeps the two
      distinct and generates the JSON Schema from the Effect Schema.
    status: proposed
    rationale: >-
      Observed in the repository: the operator decided that JSON is the persistent IR (log:25). The split into a story IR
      and a timeline IR comes from open PR #17, so confirm it.
    source:
      - log:25
      - reebeat:docs/specs/0007-scxml-persistent-ir-spike.md:23
      - pr:reebeat#17
    relations:
      - type: isa
        to: concept-org-ir

  - id: concept-reebeat-rendering
    kind: concept
    title: Rendering
    statement: >-
      An output derived from a Story. It is an artifact, and artifact formats are different from IR formats.
    status: decided
    source:
      - log:25
    relations:
      - type: isa
        to: concept-org-artifact
      - type: relates
        to: concept-reebeat-story
        label: is derived from
        multiplicity: "0..* to 1"

  - id: concept-reebeat-deck
    kind: concept
    title: Deck
    statement: >-
      A rendering that is a reveal.js presentation.
    status: decided
    source:
      - record:reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:212
      - reebeat:README.md:5
      - reebeat:GLOSSARY.md:78-80
    relations:
      - type: isa
        to: concept-reebeat-rendering

  - id: concept-reebeat-video
    kind: concept
    title: Video
    statement: >-
      A rendering captured from the Deck's page on a controlled clock.
    status: decided
    source:
      - record:reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:212
      - reebeat:README.md:6
      - reebeat:GLOSSARY.md:75-76
    relations:
      - type: isa
        to: concept-reebeat-rendering

  - id: concept-reebeat-chapter
    kind: concept
    title: Chapter
    statement: >-
      A named run of consecutive Scenes, introduced by a Section heading. A Video's chapter marks and a Deck's slide groups
      come from it.
    status: proposed
    rationale: >-
      Observed in the repository: the glossary lists Chapter among reserved groupings, yet its mapping table and the Plan
      use chapters. The operator should say whether it is modelled.
    source: ["reebeat:GLOSSARY.md:124-125", "reebeat:GLOSSARY.md:89"]
    relations:
      - type: part-of
        to: concept-reebeat-story
        multiplicity: "0..* per Story"

  - id: concept-reebeat-library
    kind: concept
    title: Library
    statement: >-
      Pure code with no runtime and no service.
    status: decided
    source:
      - record:reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:234
      - reebeat:GLOSSARY.md:101-102
    relations:
      - type: relates
        to: concept-reebeat-tier
        label: is a
        multiplicity: "1 to 1"

  - id: concept-reebeat-service
    kind: concept
    title: Service
    statement: >-
      An Effect interface plus a contract that every implementation passes.
    status: decided
    source:
      - record:reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:234
      - reebeat:docs/design/keyframe-engine.md:1225
      - reebeat:GLOSSARY.md:104-106
    relations:
      - type: relates
        to: concept-reebeat-contract-suite
        label: is tested by
        multiplicity: "1 to 1"

  - id: concept-reebeat-adapter
    kind: concept
    title: Adapter
    statement: >-
      A Layer that implements a service on an outside runtime. It is an integration.
    status: decided
    source:
      - record:reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:234
      - reebeat:GLOSSARY.md:108-110
    relations:
      - type: relates
        to: concept-reebeat-service
        label: fills
        multiplicity: "0..* to 1"

  - id: concept-reebeat-selection
    kind: concept
    title: Selection
    statement: >-
      Which adapter fills each service. Selection is explicit configuration at the composition root, and it never falls
      back silently.
    status: decided
    source:
      - record:reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:234
      - reebeat:GLOSSARY.md:112-113
      - reebeat:packages/services/src/selection.ts:18-26
    relations:
      - type: relates
        to: concept-reebeat-adapter
        label: chooses

  - id: concept-reebeat-stand-in
    kind: concept
    title: Stand-in
    statement: >-
      An offline stand-in for an integration, used in tests.
    status: decided
    source:
      - record:reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:234
      - reebeat:GLOSSARY.md:115-117
    relations:
      - type: isa
        to: concept-reebeat-adapter

  - id: concept-reebeat-egress
    kind: concept
    title: Egress
    statement: >-
      What an integration sends out of the machine, declared by the integration.
    status: decided
    source:
      - record:reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:234
      - reebeat:GLOSSARY.md:119-120
    relations:
      - type: part-of
        to: concept-reebeat-adapter

  - id: concept-reebeat-contract-suite
    kind: concept
    title: Contract suite
    statement: >-
      The suite that every adapter of one service must pass.
    status: decided
    source:
      - record:reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:234
      - reebeat:docs/design/keyframe-engine.md:1225
      - reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:258
    relations:
      - type: relates
        to: concept-reebeat-adapter
        label: is run against
        multiplicity: "1 to 1..*"

  - id: concept-reebeat-tier
    kind: concept
    title: Tier
    statement: >-
      One of three categories, library, service or integration, with one dependency direction.
    status: decided
    source:
      - record:reebeat:docs/specs/0001-release-1-screenplay-to-deck-and-video.md:234
